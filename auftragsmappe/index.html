<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auftragsmappe</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#143f3b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auftragsmappe">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<style>
  :root{
    --bg: #eef1f0;
    --panel: #ffffff;
    --ink: #16221f;
    --ink-soft: #55635f;
    --line: #d7ddda;
    --line-soft: #e6eae8;
    --teal: #1f5c56;
    --teal-deep: #143f3b;
    --amber: #b5790a;
    --amber-bg: #fbeed4;
    --blue: #2b5a8c;
    --blue-bg: #dde7f2;
    --purple: #6a4c8c;
    --purple-bg: #e8e0f2;
    --red: #a3392f;
    --red-bg: #f5e0dd;
    --green: #2c7a4b;
    --green-bg: #dcefe1;
    --orange: #b5540a;
    --orange-bg: #fbe3d0;
    --cyan: #106b78;
    --cyan-bg: #d7eff2;
    --gray-bg: #e7e9e8;
    --font-display: 'IBM Plex Sans', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{ overflow-x:hidden; width:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    width:100%;
  }
  ::selection{ background:var(--teal); color:#fff; }

  /* Header */
  header.app-head{
    background:var(--teal-deep);
    color:#eef4f2;
    padding:22px 28px 18px;
    border-bottom:4px solid var(--teal);
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#8fbdb2;
    margin-bottom:4px;
  }
  .app-title{
    font-family:var(--font-display);
    font-size:24px;
    font-weight:700;
    letter-spacing:-.01em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .app-title .stamp{
    font-family:var(--font-mono);
    font-size:12px;
    font-weight:500;
    color:#9fcabf;
    border:1px solid #3a6f68;
    border-radius:3px;
    padding:2px 7px;
  }

  /* Toolbar */
  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:14px 28px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:20;
  }
  .btn{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    transition:.12s ease;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--teal); color:var(--teal-deep); }
  .btn.primary{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .btn.primary:hover{ background:var(--teal-deep); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); }
  .btn.ghost:hover{ color:var(--teal-deep); }
  .btn.danger{ color:var(--red); border-color:var(--red-bg); }
  .btn.danger:hover{ background:var(--red-bg); border-color:var(--red); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.small{ padding:5px 10px; font-size:12px; }
  input[type=file]{ display:none; }
  .spacer{ flex:1; }
  .count-pill{
    font-family:var(--font-mono);
    font-size:12px;
    background:var(--gray-bg);
    padding:3px 9px;
    border-radius:20px;
    color:var(--ink-soft);
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap:2px;
    padding:0 28px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .tab{
    padding:12px 12px 11px;
    font-family:var(--font-display);
    font-weight:600;
    font-size:19px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .tab .n{
    font-family:var(--font-mono);
    font-size:11px;
    background:var(--gray-bg);
    padding:1px 7px;
    border-radius:10px;
  }
  .tab.active{ color:var(--teal-deep); border-bottom-color:var(--teal); }
  .tab.active .n{ background:var(--teal); color:#fff; }
  .tab:hover:not(.active){ color:var(--ink); }

  main{ padding:20px 28px 60px; max-width:1400px; margin:0 auto; }

  .empty-state{
    padding:70px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty-state .big{
    font-family:var(--font-display);
    font-size:17px;
    color:var(--ink);
    margin-bottom:6px;
    font-weight:600;
  }

  /* Table */
  .grid-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:11px 12px;
    background:#f6f8f7;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid var(--line-soft);
    vertical-align:middle;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#fafcfb; }
  .code{ font-family:var(--font-mono); font-size:12.5px; color:var(--teal-deep); font-weight:600; }
  .code-sm{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); font-weight:500; letter-spacing:.01em; }
  .ro-value{ font-size:13px; color:var(--ink); line-height:1.4; }
  .ro-info-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px 16px;
    margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line-soft);
  }
  .ro-info-item{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .ro-info-label{ font-family:var(--font-mono); font-size:13px; letter-spacing:.02em; color:var(--ink-soft); }
  .edit-section-head{
    font-family:var(--font-display); font-weight:700; font-size:12.5px;
    text-transform:uppercase; letter-spacing:.04em; color:var(--teal-deep);
    margin:16px 0 8px; padding-bottom:4px; border-bottom:2px solid var(--line-soft);
  }
  .edit-section-head:first-of-type{ margin-top:4px; }
  .ro-info-val{ font-size:13.5px; color:var(--ink); word-break:break-word; }
  .custom-field-list{ display:flex; flex-direction:column; gap:4px; margin-bottom:4px; }
  .custom-field-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 10px; background:#f6f8f7; border-radius:6px; font-size:13px;
  }
  .muted{ color:var(--ink-soft); }
  .cell-input{
    width:100%;
    border:1px solid transparent;
    background:transparent;
    font-family:var(--font-body);
    font-size:13px;
    padding:5px 7px;
    border-radius:5px;
    color:var(--ink);
  }
  .cell-input:hover{ border-color:var(--line); }
  .cell-input:focus{ outline:none; border-color:var(--teal); background:#fff; }
  textarea.cell-input{ resize:vertical; min-height:34px; font-family:var(--font-body); }

  select.status-select{
    font-family:var(--font-body);
    font-size:12.5px;
    font-weight:600;
    border:none;
    border-radius:20px;
    padding:6px 26px 6px 12px;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-repeat:no-repeat;
    background-position:right 9px center;
    background-size:9px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%23555'/></svg>");
  }
  .st-offen{ background:var(--gray-bg); color:#3d4744; }
  .st-ohne_termin{ background:var(--blue-bg); color:#4a6b8a; }
  .st-in_bearbeitung{ background:var(--amber-bg); color:var(--amber); }
  .st-termin_vereinbart{ background:var(--blue-bg); color:var(--blue); }
  .st-kunde_rueckmeldung{ background:var(--purple-bg); color:var(--purple); }
  .st-anlage_nicht_fertig{ background:var(--red-bg); color:var(--red); }
  .st-warte_planung{ background:var(--orange-bg); color:var(--orange); }
  .st-inbetriebnahme_erfolgt{ background:var(--cyan-bg); color:var(--cyan); }
  .st-erledigt{ background:var(--green-bg); color:var(--green); }

  .termin-chip{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--blue);
    background:var(--blue-bg);
    padding:4px 9px;
    border-radius:5px;
    white-space:nowrap;
  }
  .row-actions{ display:flex; gap:6px; }
  .icon-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:6px;
    padding:6px 9px;
    font-size:12px;
    cursor:pointer;
    color:var(--ink-soft);
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .icon-btn:hover{ border-color:var(--teal); color:var(--teal-deep); }

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,26,24,.55);
    display:flex; align-items:center; justify-content:center;
    z-index:9999; padding:16px;
  }
  .modal{
    background:#fff; border-radius:12px; width:100%; max-width:520px;
    max-height:90vh; overflow-y:auto; overflow-x:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head{
    padding:18px 22px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .modal-head h3{ margin:0; font-family:var(--font-display); font-size:16px; }
  .modal-body{ padding:20px 22px; }
  .modal-foot{ padding:14px 22px 20px; display:flex; gap:10px; justify-content:flex-end; border-top:1px solid var(--line-soft); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:6px;
    font-family:var(--font-body); font-size:13.5px; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--teal); }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.5; }
  .close-x{ background:none; border:none; font-size:18px; cursor:pointer; color:var(--ink-soft); }

  .mapping-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .mapping-row label{ width:150px; font-size:13px; font-weight:600; flex-shrink:0; }
  .mapping-row select{ flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  .req-star{ color:var(--red); }

  .history-list{ list-style:none; padding:0; margin:0; }
  .history-list li{
    padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px;
  }
  .history-list li:last-child{ border-bottom:none; }
  .history-list .ts{ font-family:var(--font-mono); color:var(--ink-soft); font-size:11px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--teal-deep); color:#fff; padding:11px 20px; border-radius:8px;
    font-size:13px; font-weight:500; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.25);
    display:none;
  }

  .view-toggle{ display:flex; gap:6px; margin-bottom:14px; align-items:center; }
  .filter-bar{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    margin-bottom:12px; padding:12px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px;
  }
  .filter-search{
    flex:1; min-width:180px; padding:8px 12px; border:1px solid var(--line);
    border-radius:20px; font-family:var(--font-body); font-size:13px;
  }
  .filter-search:focus{ outline:none; border-color:var(--teal); }
  .filter-select{
    padding:8px 12px; border:1px solid var(--line); border-radius:20px;
    font-family:var(--font-body); font-size:12.5px; background:#fff; color:var(--ink);
  }
  .agenda-group{ margin-bottom:18px; }
  .agenda-date-header{
    font-family:var(--font-display); font-weight:700; font-size:14px;
    color:var(--teal-deep); padding:8px 14px; background:#f6f8f7;
    border-bottom:1px solid var(--line);
  }
  .agenda-date-header.is-today{ color:var(--teal); background:var(--green-bg); }
  .agenda-date-header.is-past{ color:var(--ink-soft); }
  .agenda-item{
    display:flex; align-items:flex-start; gap:14px; padding:12px 14px;
    border-bottom:1px solid var(--line-soft); cursor:pointer;
  }
  .agenda-item:hover{ background:#fafcfb; }
  .agenda-item:last-child{ border-bottom:none; }
  .agenda-time{
    font-family:var(--font-mono); font-weight:600; font-size:13px;
    color:var(--blue); min-width:48px;
  }
  .agenda-main{ flex:1; min-width:0; }
  .agenda-title{ font-size:13.5px; font-weight:600; }
  .agenda-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .agenda-main .pop-status{
    display:inline-block; margin-top:6px; padding:2px 8px; border-radius:10px;
    font-weight:600; font-size:11px; white-space:normal; line-height:1.4;
  }
  .stat-summary{ display:flex; flex-wrap:wrap; gap:12px; }
  .stat-tile{
    flex:1 1 110px; background:#f6f8f7; border-radius:8px; padding:14px 12px; text-align:center;
  }
  .stat-tile-num{ font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--teal-deep); }
  .stat-tile-label{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .stat-row{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .stat-label{ font-size:12.5px; width:150px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stat-bar-track{ flex:1; height:14px; background:var(--gray-bg); border-radius:8px; overflow:hidden; }
  .stat-bar-fill{ height:100%; border-radius:8px; background:var(--teal); }
  .stat-count{ font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); width:28px; text-align:right; flex-shrink:0; }
  .fab-scan{
    position:fixed; bottom:22px; right:18px; width:56px; height:56px; border-radius:50%;
    background:var(--teal); color:#fff; border:none; font-size:22px; box-shadow:0 6px 18px rgba(0,0,0,.25);
    cursor:pointer; z-index:500;
  }
  .fab-scan:hover{ background:var(--teal-deep); }
  .selection-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 14px; background:var(--teal-deep); color:#fff; border-radius:10px; margin-bottom:12px;
  }
  .selection-bar .btn{ background:#fff; }
  .reconnect-banner{
    background:var(--red); color:#fff; padding:10px 20px;
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-size:13.5px; font-weight:600; flex-wrap:wrap; text-align:center;
  }
  .reconnect-banner .btn{ background:#fff; color:var(--red); border:none; }
  .adr-card-list{ display:flex; flex-direction:column; gap:10px; }
  .adr-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap;
    max-width:100%; box-sizing:border-box;
  }
  .adr-card-main{ flex:1 1 160px; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .adr-name-input, .adr-addr-input, .adr-phone-input{ width:100%; max-width:100%; box-sizing:border-box; }
  .adr-name-input{
    border:none; background:transparent; font-family:var(--font-display); font-weight:700;
    font-size:15.5px; color:var(--ink); padding:2px 4px; border-radius:5px;
  }
  .adr-name-input:hover, .adr-addr-input:hover, .adr-phone-input:hover{ background:var(--gray-bg); }
  .adr-name-input:focus, .adr-addr-input:focus, .adr-phone-input:focus{ outline:none; background:#fff; border:1px solid var(--teal); }
  .adr-addr-input{
    border:none; background:transparent; font-family:var(--font-body); font-size:13.5px;
    color:var(--ink); padding:2px 4px; border-radius:5px;
  }
  .adr-phone-input{
    border:none; background:transparent; font-family:var(--font-mono); font-size:12.5px;
    color:var(--ink-soft); padding:2px 4px; border-radius:5px;
  }
  .adr-card-actions{ display:flex; gap:6px; flex-shrink:0; }
  .adr-card-details{
    width:100%; margin-top:8px; padding-top:12px; border-top:1px solid var(--line-soft);
    box-sizing:border-box;
  }
  .view-toggle .btn.active{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .settings-section{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px 20px; margin-bottom:16px;
  }
  .settings-section h4{
    margin:0 0 12px; font-family:var(--font-display); font-size:14px; color:var(--teal-deep);
  }
  .settings-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .map-empty{ height:200px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .leaflet-popup-content{ font-family:var(--font-body); font-size:12.5px; min-width:180px; }
  .leaflet-popup-content .pop-code{ font-family:var(--font-mono); font-weight:700; color:var(--teal-deep); }
  .leaflet-popup-content .pop-status{ display:inline-block; margin-top:4px; padding:2px 8px; border-radius:10px; font-weight:600; font-size:11px; }
  .col-picker label{ display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13.5px; font-weight:500; border-bottom:1px solid var(--line-soft); }
  .col-picker label:last-child{ border-bottom:none; }
  .col-picker input{ width:16px; height:16px; }
  .col-picker-row{
    display:flex; align-items:center; gap:10px; padding:7px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .col-picker-row:last-child{ border-bottom:none; }
  .col-picker-move{ display:flex; flex-direction:column; gap:2px; }
  .col-picker-move .icon-btn{ padding:2px 7px; font-size:10px; line-height:1; }

  @media (max-width:800px){
    header.app-head, .toolbar, .tabs, main{ padding-left:14px; padding-right:14px; }
    .mapping-row{ flex-wrap:wrap; }
    .mapping-row label{ width:100%; }
    table, thead, tbody, th, td, tr{ display:block; }
    thead{ display:none; }
    tbody tr{ border-bottom:6px solid var(--bg); padding:10px 0; }

<script>
/* ---------------------------------------------------------------
   State
--------------------------------------------------------------- */
const STATUS = {
  offen:              { label: 'Offen', cls: 'st-offen' },
  ohne_termin:        { label: 'Ohne Termin (Station/Zähleranschlusssäule)', cls: 'st-ohne_termin' },
  in_bearbeitung:     { label: 'In Bearbeitung', cls: 'st-in_bearbeitung' },
  termin_vereinbart:  { label: 'Termin vereinbart', cls: 'st-termin_vereinbart' },
  kunde_rueckmeldung: { label: 'Kunde meldet sich zurück', cls: 'st-kunde_rueckmeldung' },
  anlage_nicht_fertig:{ label: 'Anlage noch nicht fertig', cls: 'st-anlage_nicht_fertig' },
  warte_planung:      { label: 'Warte auf Terminvergabe (Planung)', cls: 'st-warte_planung' },
  inbetriebnahme_erfolgt: { label: 'Inbetriebnahme erfolgt', cls: 'st-inbetriebnahme_erfolgt' },
  erledigt:           { label: 'Erledigt', cls: 'st-erledigt' },
};

let auftraege = [];   // array of Auftrag objects
let adressbuch = [];  // array of Anlagen entries
let settings = { organizerEmail: '', lastImport: null };
let columnMapping = null; // { kundencode, vorgang, telefonnummer, adresse, zaehlerplatzId, koordinaten }
let currentTab = 'offen';
let pendingCsvRows = null; // rows waiting on mapping confirmation
let pendingCsvHeaders = null;
let terminModalAuftragId = null;
let historyModalTarget = null;
let viewMode = { offen: 'liste', erledigt: 'liste', adressbuch: 'liste' };
let selection = { offen: new Set(), erledigt: new Set() };
let distanceSortActive = { offen: false, erledigt: false };
let userLocationCache = null;
let mapInstances = {};
const DEFAULT_VISIBLE_COLUMNS = {
  kundenname: true, vorgang: true, auftragsbeschreibung: true, status: true, telefonnummer: true, email: true, adresse: true,
  standort: true, zaehler: true, bauform: true,
  kommentar: true, termin: true, inbetriebnahmeDatum: true, koordinaten: true
};
const COLUMN_DEFS = [
  { key:'kundenname', label:'Kundenname' },
  { key:'vorgang', label:'Vorgang' },
  { key:'auftragsbeschreibung', label:'Auftragsbeschreibung' },
  { key:'status', label:'Status' },
  { key:'telefonnummer', label:'Telefon' },
  { key:'email', label:'E-Mail' },
  { key:'adresse', label:'Adresse' },
  { key:'standort', label:'Standort' },
  { key:'zaehler', label:'Zähler' },
  { key:'bauform', label:'Bauform Zähler' },
  { key:'kommentar', label:'Kommentar' },
  { key:'termin', label:'Termin' },
  { key:'inbetriebnahmeDatum', label:'Inbetriebnahme am' },
  { key:'koordinaten', label:'Koordinaten' },
];
const DEFAULT_COLUMN_ORDER = COLUMN_DEFS.map(c => c.key);

function uid(){ return 'a_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function nowIso(){ return new Date().toISOString(); }
function fmtTs(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'});
}
function fmtDateDe(isoDate){
  if(!isoDate) return '';
  const [y,m,d] = isoDate.split('-');
  return `${d}.${m}.${y}`;
}
function statusLabelWithTermin(a){
  const label = STATUS[a.status].label;
  if(a.status === 'termin_vereinbart' && a.termin){
    return `${label} (${a.termin.date} ${a.termin.time})`;
  }
  return label;
}
function norm(s){ return (s||'').toString().trim().toLowerCase(); }
function parseCoords(str){
  if(!str) return null;
  const parts = str.toString().split(/[,;\s]+/).map(p=>p.trim()).filter(Boolean);
  if(parts.length < 2) return null;
  const lat = parseFloat(parts[0].replace(',','.'));
  const lon = parseFloat(parts[1].replace(',','.'));
  if(isNaN(lat) || isNaN(lon)) return null;
  if(lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
  return { lat, lon };
}
function fmtCoords(c){ return c ? `${c.lat.toFixed(5)}, ${c.lon.toFixed(5)}` : ''; }

let toastUndoFn = null;
function showToast(msg, undoFn){
  const t = document.getElementById('toast');
  toastUndoFn = undoFn || null;
  t.innerHTML = escapeHtml(msg) + (undoFn
    ? ` <button onclick="runToastUndo()" style="margin-left:10px;background:#fff;color:var(--teal-deep);border:none;border-radius:14px;padding:3px 12px;font-size:12px;font-weight:600;cursor:pointer">Rückgängig</button>`
    : '');
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.style.display='none'; toastUndoFn=null; }, undoFn ? 6000 : 3200);
}
function runToastUndo(){
  if(toastUndoFn){ toastUndoFn(); }
  toastUndoFn = null;
  document.getElementById('toast').style.display = 'none';
}

/* ---------------------------------------------------------------
   Storage — works both as a Claude artifact (window.storage) and as
   a standalone hosted app (localStorage + optional linked folder)
--------------------------------------------------------------- */
const hasClaudeStorage = (typeof window.storage !== 'undefined');
const FS_SUPPORTED = ('showDirectoryPicker' in window);
let folderHandle = null;
let folderNeedsPermission = false;
let folderSyncTimer = null;
let photoFolderHandle = null;
let photoFolderNeedsPermission = false;

async function kvGet(key){
  if(hasClaudeStorage){
    try{ const r = await window.storage.get(key); return r ? r.value : null; }
    catch(e){ return null; }
  }
  try{ return localStorage.getItem('am_' + key); }catch(e){ return null; }
}
async function kvSet(key, val){
  if(hasClaudeStorage){
    try{ await window.storage.set(key, val); return; }
    catch(e){ showToast('Speichern fehlgeschlagen: ' + key); return; }
  }
  try{ localStorage.setItem('am_' + key, val); }catch(e){ showToast('Speichern fehlgeschlagen: ' + key); }
}

/* ---------------------------------------------------------------
   Foto-Anhang pro Auftrag (eigener Storage-Key pro Auftrag,
   damit der Haupt-Datensatz klein bleibt)
--------------------------------------------------------------- */
let photoTargetAuftragId = null;
let photoTargetType = 'auftrag'; // 'auftrag' | 'adressbuch'

function getPhotoRecord(id, type){
  return type === 'adressbuch' ? adressbuch.find(x => x.id === id) : auftraege.find(x => x.id === id);
}
function savePhotoRecordOwner(type){
  return type === 'adressbuch' ? saveAdressbuch() : saveAuftraege();
}

function decToDmsRational(dec){
  const abs = Math.abs(dec);
  const deg = Math.floor(abs);
  const minFloat = (abs - deg) * 60;
  const min = Math.floor(minFloat);
  const sec = Math.round((minFloat - min) * 60 * 100);
  return [[deg,1],[min,1],[sec,100]];
}
function embedGpsExif(dataUrl, koordinaten){
  if(!koordinaten || typeof piexif === 'undefined') return dataUrl;
  try{
    const gps = {};
    gps[piexif.GPSIFD.GPSLatitudeRef] = koordinaten.lat >= 0 ? 'N' : 'S';
    gps[piexif.GPSIFD.GPSLatitude] = decToDmsRational(koordinaten.lat);
    gps[piexif.GPSIFD.GPSLongitudeRef] = koordinaten.lon >= 0 ? 'E' : 'W';
    gps[piexif.GPSIFD.GPSLongitude] = decToDmsRational(koordinaten.lon);
    const exifBytes = piexif.dump({ '0th':{}, 'Exif':{}, 'GPS':gps });
    return piexif.insert(exifBytes, dataUrl);
  }catch(e){
    console.error('embedGpsExif', e);
    return dataUrl; // fall back to the photo without GPS metadata rather than failing the save
  }
}
function dataUrlToBlob(dataUrl){
  const parts = dataUrl.split(',');
  const mime = parts[0].match(/:(.*?);/)[1];
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++){ arr[i] = bin.charCodeAt(i); }
  return new Blob([arr], { type: mime });
}
function buildPhotoOverlayLines(a, coords, accuracy){
  if(!a) return [];
  const lines = [];
  const nameLine = [a.kundencode, a.kundenname].filter(Boolean).join(' · ');
  if(nameLine) lines.push(nameLine);
  if(a.adresse) lines.push(a.adresse);
  if(a.standort) lines.push('Standort: ' + a.standort);
  const zaehlerLine = [a.zaehler ? 'Zähler: ' + a.zaehler : '', a.bauform].filter(Boolean).join(' · ');
  if(zaehlerLine) lines.push(zaehlerLine);
  const now = new Date();
  const datumZeit = `${pad(now.getDate())}.${pad(now.getMonth()+1)}.${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const ersteller = settings.userName ? `Ersteller: ${settings.userName}` : '';
  const coordStr = coords ? fmtCoords(coords) : '';
  const accStr = accuracy ? `±${accuracy}m` : '';
  lines.push([datumZeit, ersteller].filter(Boolean).join(' · '));
  if(coordStr || accStr) lines.push([coordStr, accStr].filter(Boolean).join(' · '));
  return lines;
}

function compressImageFile(file, auftrag, coords, accuracy){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const maxW = 1000;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const photoH = Math.round(img.height * scale);

      const lines = buildPhotoOverlayLines(auftrag, coords, accuracy);
      const fontSize = Math.max(13, Math.round(w * 0.028));
      const linePad = Math.round(fontSize * 0.35);
      const stripePad = Math.round(fontSize * 0.6);
      const stripeH = lines.length ? (lines.length * (fontSize + linePad) + stripePad * 2) : 0;

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = photoH + stripeH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, photoH);

      if(stripeH > 0){
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, photoH, w, stripeH);
        ctx.fillStyle = '#111111';
        ctx.font = `${fontSize}px sans-serif`;
        ctx.textBaseline = 'top';
        let y = photoH + stripePad;
        lines.forEach(line => {
          ctx.fillText(line, stripePad, y, w - stripePad*2);
          y += fontSize + linePad;
        });
      }

      let dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      dataUrl = embedGpsExif(dataUrl, coords);
      const blob = dataUrlToBlob(dataUrl);
      resolve({ blob, dataUrl });
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let photoTargetElementId = null;
function triggerPhotoCapture(id, type, elementId){
  photoTargetAuftragId = id;
  photoTargetType = type || 'auftrag';
  photoTargetElementId = elementId || 'photoArea';
  document.getElementById('photoInput').click();
}

function downloadPhotoBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function sharePhotoBlob(blob, filename){
  // Automatic, no-tap save into the device's own Downloads folder — this
  // always works, no share-target picker needed.
  downloadPhotoBlob(blob, filename);
  showToast('Foto im Download-Ordner gespeichert: ' + filename);
}
function flatPhotoFilename(a, datum){
  const datumLabel = (datum || todayDe()).split('.').join('-');
  const zaehler = sanitizeFilename((a && a.zaehler) || 'ohne-zaehlernummer');
  const zpid = sanitizeFilename((a && a.zaehlerplatzId) || '');
  return zpid ? `${datumLabel}_${zaehler}_${zpid}.jpg` : `${datumLabel}_${zaehler}.jpg`;
}
async function collectPendingLocalPhotos(){
  const files = [];
  const keys = [];
  for(const a of auftraege){
    const raw = await kvGet('photo_' + a.id);
    if(!raw) continue;
    let dataUrl, datum;
    try{ const parsed = JSON.parse(raw); dataUrl = parsed.dataUrl; datum = parsed.datum; }
    catch(e){ dataUrl = raw; datum = todayDe(); }
    if(!dataUrl) continue;
    const blob = await (await fetch(dataUrl)).blob();
    files.push(new File([blob], flatPhotoFilename(a, datum), { type:'image/jpeg' }));
    keys.push('photo_' + a.id);
  }
  for(const e of adressbuch){
    const raw = await kvGet('photo_' + e.id);
    if(!raw) continue;
    let dataUrl, datum;
    try{ const parsed = JSON.parse(raw); dataUrl = parsed.dataUrl; datum = parsed.datum; }
    catch(err){ dataUrl = raw; datum = todayDe(); }
    if(!dataUrl) continue;
    const blob = await (await fetch(dataUrl)).blob();
    files.push(new File([blob], flatPhotoFilename(e, datum), { type:'image/jpeg' }));
    keys.push('photo_' + e.id);
  }
  return { files, keys };
}
async function shareAllPendingPhotos(){
  showToast('Fotos werden vorbereitet…');
  const { files, keys } = await collectPendingLocalPhotos();
  if(files.length === 0){ showToast('Keine lokal gespeicherten Fotos zum Sichern'); return; }

  if(navigator.share && navigator.canShare && navigator.canShare({ files })){
    try{
      await navigator.share({ files, title: `${files.length} Fotos` });
      showModal(`
        <div class="modal-head"><h3>Fotos geteilt</h3><button class="close-x" onclick="closeModal()">✕</button></div>
        <div class="modal-body"><p class="hint" style="margin-top:0">Wenn die Fotos in OneDrive angekommen sind: Lokale Kopien in der App jetzt löschen, um Platz zu sparen?</p></div>
        <div class="modal-foot">
          <button class="btn ghost" onclick="closeModal()">Behalten</button>
          <button class="btn danger" onclick="clearPendingLocalPhotos()">Lokale Kopien löschen</button>
        </div>
      `);
      window.__pendingPhotoKeys = keys;
    }catch(e){ /* user cancelled the share sheet — keep everything as-is */ }
  } else if(files.length === 1 && navigator.share){
    try{ await navigator.share({ files, title: files[0].name }); }catch(e){}
  } else {
    showToast(`Teilen mehrerer Dateien wird auf diesem Gerät nicht unterstützt (${files.length} Fotos betroffen)`);
  }
}
async function clearPendingLocalPhotos(){
  const keys = window.__pendingPhotoKeys || [];
  for(const k of keys){ await kvSet(k, ''); }
  window.__pendingPhotoKeys = null;
  closeModal();
  render();
  showToast('Lokale Fotokopien gelöscht');
}
async function countPendingLocalPhotos(){
  let count = 0;
  for(const a of auftraege){ if(await kvGet('photo_' + a.id)) count++; }
  for(const e of adressbuch){ if(await kvGet('photo_' + e.id)) count++; }
  return count;
}

function nextPhotoFilename(a, zaehlerLabel, datumLabel){
  const base = zaehlerLabel;
  const sameDayFiles = (a.photos || []).filter(p => p.datumLabel === datumLabel).map(p => p.filename.replace(/\.jpg$/,''));
  if(!sameDayFiles.includes(base)) return base + '.jpg';
  let n = 2;
  while(sameDayFiles.includes(`${base}_${n}`)) n++;
  return `${base}_${n}.jpg`;
}

function getFreshGpsForPhoto(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: Math.round(pos.coords.accuracy) }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
    );
  });
}

document.getElementById('photoInput').addEventListener('change', async function(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file || !photoTargetAuftragId) return;
  try{
    const id = photoTargetAuftragId;
    const type = photoTargetType;
    const a = getPhotoRecord(id, type);
    showToast('Foto wird verarbeitet, Standort wird ermittelt…');
    const fresh = await getFreshGpsForPhoto();
    const coords = fresh ? { lat: fresh.lat, lon: fresh.lon } : (a ? a.koordinaten : null);
    const accuracy = fresh ? fresh.accuracy : null;

    const { blob, dataUrl } = await compressImageFile(file, a, coords, accuracy);
    const folderReady = photoFolderHandle && !photoFolderNeedsPermission;

    if(FS_SUPPORTED && photoFolderHandle && photoFolderNeedsPermission){
      showModal(`
        <div class="modal-head"><h3>⚠️ Fotoordner nicht verbunden</h3><button class="close-x" onclick="closeModal()">✕</button></div>
        <div class="modal-body">
          <p class="hint" style="margin-top:0">Dieses Foto landet gerade im begrenzten App-Speicher, weil die Verbindung zum Fotoordner erneuert werden muss.</p>
        </div>
        <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Später</button><button class="btn primary" onclick="closeModal();reconnectPhotoFolder()">🔄 Jetzt verbinden</button></div>
      `);
    }

    if(folderReady && a){
      if(!a.photos) a.photos = [];
      const zaehlerLabel = sanitizeFilename(a.zaehler || 'ohne-zaehlernummer');
      const datum = todayDe().split('.').join('-');
      const filename = nextPhotoFilename(a, zaehlerLabel, datum);
      const saved = await savePhotoToFolderNamed(filename, blob, a, datum);
      if(saved){
        a.photos.push({ filename: saved.filename, ortLabel: saved.ortLabel, strasseLabel: saved.strasseLabel, datumLabel: saved.datumLabel, koordinaten: coords, genauigkeit: accuracy });
        savePhotoRecordOwner(type);
        showToast('✅ Im Fotoordner gespeichert: ' + filename + (accuracy ? ` (±${accuracy}m)` : ''));
      } else {
        showModal(`
          <div class="modal-head"><h3>⚠️ Speichern im Fotoordner fehlgeschlagen</h3><button class="close-x" onclick="closeModal()">✕</button></div>
          <div class="modal-body"><p class="hint" style="margin-top:0">Das Foto liegt vorerst im begrenzten App-Speicher. Prüfe, ob der verknüpfte Ordner noch existiert/erreichbar ist.</p></div>
          <div class="modal-foot"><button class="btn primary" onclick="closeModal()">Verstanden</button></div>
        `);
        await kvSet('photo_' + id, JSON.stringify({ dataUrl, datum: todayDe() }));
      }
    } else {
      // No folder linked (typically mobile) — store locally with its capture
      // date, so it can be picked up later by the once-a-day "Alle sichern".
      await kvSet('photo_' + id, JSON.stringify({ dataUrl, datum: todayDe() }));
      showToast('Foto gespeichert — später über "📤 Alle Fotos sichern" nach OneDrive übertragen');
    }
    refreshPhotoArea(id, type, photoTargetElementId);
  }catch(err){
    showToast('Foto konnte nicht verarbeitet werden');
  }
});

async function getPhotoSrcList(id, type){
  const a = getPhotoRecord(id, type || 'auftrag');
  const folderReady2 = photoFolderHandle && !photoFolderNeedsPermission;
  if(a && a.photos && a.photos.length && folderReady2){
    const results = await Promise.all(a.photos.map(async (p) => ({
      filename: p.filename, koordinaten: p.koordinaten, genauigkeit: p.genauigkeit, datum: p.datumLabel,
      src: await readPhotoFromFolder(p)
    })));
    return results.filter(r => r.src);
  }
  const raw = await kvGet('photo_' + id);
  if(!raw) return [];
  try{
    const parsed = JSON.parse(raw);
    if(parsed && parsed.dataUrl) return [{ filename: null, koordinaten: a ? a.koordinaten : null, genauigkeit: null, datum: parsed.datum, src: parsed.dataUrl }];
  }catch(e){ /* old plain-string format */ }
  return [{ filename: null, koordinaten: a ? a.koordinaten : null, genauigkeit: null, src: raw }];
}

async function refreshPhotoArea(id, type, elementId){
  elementId = elementId || 'photoArea';
  const area = document.getElementById(elementId);
  if(!area) return; // modal already closed
  const photos = await getPhotoSrcList(id, type);
  area.innerHTML = photoAreaHtml(id, photos, type, elementId);
}

function photoAreaHtml(id, photos, type, elementId){
  type = type || 'auftrag';
  elementId = elementId || 'photoArea';
  const hasLocalPhoto = photos.some(p => p.filename === null);

async function loadAll(){
  try{ const v = await kvGet('auftraege'); auftraege = v ? JSON.parse(v) : []; }catch(e){ auftraege = []; }
  // migrate old string-only Wiedervorlage format ("2026-07-10") to {datum, zeit}
  let migratedWiedervorlage = false;
  auftraege.forEach(a => {
    if(a.wiedervorlage && typeof a.wiedervorlage === 'string'){
      a.wiedervorlage = { datum: a.wiedervorlage, zeit: '09:00' };
      migratedWiedervorlage = true;
    }
  });
  if(migratedWiedervorlage) saveAuftraege();
  // migrate old photoFilenames (plain strings) into the new photos array
  // (with per-photo coordinates) — best-effort fallback to the Auftrag's own
  // stored coordinates since older photos didn't capture their own.
  let migratedPhotos = false;
  auftraege.forEach(a => {
    if(a.photoFilenames && a.photoFilenames.length && !a.photos){
      a.photos = a.photoFilenames.map(fn => ({ filename: fn, koordinaten: a.koordinaten || null, genauigkeit: null }));
      migratedPhotos = true;
    }
  });
  if(migratedPhotos) saveAuftraege();
  // backfill koordinatenQuelle for data that predates this feature — best
  // guess is 'import' since we can't know retroactively who set it by hand.
  let migratedQuelle = false;
  auftraege.forEach(a => {
    if(a.koordinaten && !a.koordinatenQuelle){ a.koordinatenQuelle = 'import'; migratedQuelle = true; }
  });
  if(migratedQuelle) saveAuftraege();
  try{ const v = await kvGet('adressbuch'); adressbuch = v ? JSON.parse(v) : []; }catch(e){ adressbuch = []; }
  let migratedQuelleAdr = false;
  adressbuch.forEach(e => {
    if(e.koordinaten && !e.koordinatenQuelle){ e.koordinatenQuelle = 'import'; migratedQuelleAdr = true; }
  });
  if(migratedQuelleAdr) saveAdressbuch();
  try{ const v = await kvGet('settings'); settings = v ? JSON.parse(v) : { organizerEmail:'', lastImport:null }; }
  catch(e){ settings = { organizerEmail:'', lastImport:null }; }
  if(!settings.visibleColumns){ settings.visibleColumns = Object.assign({}, DEFAULT_VISIBLE_COLUMNS); }
  // fill in any newly introduced columns for users with an older saved settings object
  DEFAULT_COLUMN_ORDER.forEach(k => { if(!(k in settings.visibleColumns)) settings.visibleColumns[k] = true; });
  if(!settings.columnOrder){ settings.columnOrder = DEFAULT_COLUMN_ORDER.slice(); }
  if(!settings.customFields){ settings.customFields = []; }
  // include any new columns that aren't in a saved order yet (appended at the end)
  DEFAULT_COLUMN_ORDER.forEach(k => { if(!settings.columnOrder.includes(k)) settings.columnOrder.push(k); });
  try{ const v = await kvGet('column-mapping'); columnMapping = v ? JSON.parse(v) : null; }catch(e){ columnMapping = null; }
}

/* --- Linked file (Desktop Chrome/Edge only) ------------------------
   Stores a FileSystemFileHandle in IndexedDB so the permission
   can be silently reused across page reloads (where the browser allows).
   Uses the file-picker (not the folder-picker) since that's the dialog
   that reliably shows OneDrive/SharePoint locations. */
function idbHandleDb(){
  return new Promise((resolve,reject) => {
    const req = indexedDB.open('auftragsmappe-fs', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetHandle(key){
  key = key || 'file';
  try{
    const db = await idbHandleDb();
    return await new Promise((resolve) => {
      const tx = db.transaction('handles','readonly');
      const r = tx.objectStore('handles').get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    });
  }catch(e){ return null; }
}
async function idbSetHandle(handle, key){
  key = key || 'file';
  try{
    const db = await idbHandleDb();
    await new Promise((resolve) => {
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  }catch(e){}
}

function sanitizeFilename(s){
  return (s||'').toString().trim().replace(/[\\/:*?"<>|]/g,'_') || 'unbenannt';
}
function parseOrtUndStrasse(adresse){
  // Erwartetes Format: "Ortsteil, Straße Hausnummer, Ort" (wie beim Import
  // zusammengesetzt) — robust auch bei 1-2 Teilen statt 3.
  const parts = (adresse||'').split(',').map(p => p.trim()).filter(Boolean);
  if(parts.length >= 3) return { strasse: parts[1], ort: parts[parts.length-1] };
  if(parts.length === 2) return { strasse: parts[0], ort: parts[1] };
  if(parts.length === 1) return { strasse: parts[0], ort: 'Unbekannt' };
  return { strasse: 'Unbekannt', ort: 'Unbekannt' };
}
async function getNestedPhotoFolder(a, datumLabel){
  if(!photoFolderHandle) return null;
  // Cache the Ort/Straßen-Ordnername on the canonical Anlagen-Eintrag
  // (nicht pro Auftrag) — Zählerplatz-ID entscheidet, einmal festgelegt bleibt
  // der Ordnername für immer gleich, auch wenn spätere Importe die Straße
  // anders schreiben. Verhindert doppelte Ordner für dieselbe Anlage.
  const canonical = a.adrEntryId ? adressbuch.find(e => e.id === a.adrEntryId) : a;
  const target = canonical || a;
  let ortLabel = target.photoFolderOrtLabel;
  let strasseLabel = target.photoFolderStrasseLabel;
  if(!ortLabel || !strasseLabel){
    const { strasse, ort } = parseOrtUndStrasse(a.adresse || target.adresse);
    ortLabel = sanitizeFilename(ort);
    const zpid = a.zaehlerplatzId || target.zaehlerplatzId;
    strasseLabel = sanitizeFilename(zpid ? `${strasse} (${zpid})` : strasse);
    target.photoFolderOrtLabel = ortLabel;
    target.photoFolderStrasseLabel = strasseLabel;
    if(canonical) saveAdressbuch(); // sofort merken, unabhängig davon ob der Auftrag gleich mitgespeichert wird
  }
  const ortFolder = await photoFolderHandle.getDirectoryHandle(ortLabel, { create:true });
  const strasseFolder = await ortFolder.getDirectoryHandle(strasseLabel, { create:true });
  const datumFolder = await strasseFolder.getDirectoryHandle(datumLabel, { create:true });
  return { folder: datumFolder, ortLabel, strasseLabel, datumLabel };
}
async function savePhotoToFolderNamed(filename, blob, a, datumLabel){
  if(!photoFolderHandle || photoFolderNeedsPermission) return false;
  try{
    const nested = a ? await getNestedPhotoFolder(a, datumLabel) : null;
    const targetFolder = nested ? nested.folder : photoFolderHandle;
    const fileHandle = await targetFolder.getFileHandle(filename, { create:true });
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
    return nested ? { filename, ortLabel: nested.ortLabel, strasseLabel: nested.strasseLabel, datumLabel: nested.datumLabel } : { filename };
  }catch(e){ console.error('savePhotoToFolderNamed', e); return false; }
}
async function savePhotoToFolder(auftragOrEntry, blob){
  if(!photoFolderHandle || photoFolderNeedsPermission) return false;
  const zaehler = sanitizeFilename(auftragOrEntry.zaehler || 'ohne-zaehlernummer');
  const datum = todayDe().split('.').join('-'); // TT-MM-JJJJ, dateisicher
  const filename = `${zaehler}.jpg`;
  return await savePhotoToFolderNamed(filename, blob, auftragOrEntry, datum);
}
async function resolvePhotoFolderPath(photoEntry){
  if(!photoFolderHandle) return null;
  if(!photoEntry.ortLabel) return photoFolderHandle; // flat/legacy photo
  try{
    const ortFolder = await photoFolderHandle.getDirectoryHandle(photoEntry.ortLabel);
    const strasseFolder = await ortFolder.getDirectoryHandle(photoEntry.strasseLabel);
    if(photoEntry.datumLabel) return await strasseFolder.getDirectoryHandle(photoEntry.datumLabel);
    return strasseFolder; // older entries saved before the Datum level existed
  }catch(e){ return null; }
}
async function readPhotoFromFolder(photoEntry){
  if(!photoFolderHandle || photoFolderNeedsPermission || !photoEntry) return null;
  try{
    const folder = await resolvePhotoFolderPath(photoEntry);
    if(!folder) return null;
    const fileHandle = await folder.getFileHandle(photoEntry.filename);
    const file = await fileHandle.getFile();
    return URL.createObjectURL(file);
  }catch(e){ return null; /* Datei fehlt/wurde umbenannt — kein harter Fehler */ }
}
async function removePhotoFromFolder(photoEntry){
  if(!photoFolderHandle || photoFolderNeedsPermission || !photoEntry) return;
  try{
    const folder = await resolvePhotoFolderPath(photoEntry);
    if(folder) await folder.removeEntry(photoEntry.filename);
  }catch(e){ /* schon weg, ignorieren */ }
}

function scheduleFolderSync(){

/* ---------------------------------------------------------------
   Address book helpers
--------------------------------------------------------------- */
function findAdrEntry(zaehlerplatzId, kundencode, adresse, zaehler){
  // Messlokation ist laut Nutzer garantiert eindeutig — genau ein Eintrag pro
  // Messlokation, daher reicht sie allein als verlässlicher Haupt-Schlüssel.
  if(kundencode){
    const hit = adressbuch.find(a => a.kundencode && norm(a.kundencode) === norm(kundencode));
    if(hit) return hit;
  }
  // Fallback: match on Zähler(-nummer) alone. This is what lets a manually
  // created entry (just Zähler + Standort, no Messlokation yet) get "found"
  // and enriched once an import row with the same Zähler brings a Messlokation.
  if(zaehler){
    const hit = adressbuch.find(a => a.zaehler && norm(a.zaehler) === norm(zaehler));
    if(hit) return hit;
  }
  return null;
}
function upsertAdrFromImport(row){
  let entry = findAdrEntry(row.zaehlerplatzId, row.kundencode, row.adresse, row.zaehler);
  if(!entry){
    entry = {
      id: uid(),
      kundencode: row.kundencode || '',
      zaehlerplatzId: row.zaehlerplatzId || '',
      kundenname: row.kundenname || '',
      adresse: row.adresse || '',
      telefonnummer: row.telefonnummer || '',
      email: row.email || '',
      koordinaten: row.koordinaten || null,
      koordinatenAktualisiertAm: row.koordinaten ? todayDe() : '',
      koordinatenQuelle: row.koordinaten ? 'import' : '',
      zaehler: row.zaehler || '',
      bauform: row.bauform || '',
      standort: row.standort || '',
      history: [{ ts: nowIso(), field:'angelegt', old:'', new:'aus Datei-Import' }]
    };
    adressbuch.push(entry);
  } else {
    // Merge into the existing entry: empty fields get filled in.
    // If a field is already filled but the new import has a DIFFERENT value,
    // keep both (combined) rather than silently dropping the new one.
    const mergeField = (key) => {
      const newVal = (row[key] || '').toString().trim();
      if(!newVal) return;
      const oldVal = (entry[key] || '').toString().trim();
      if(!oldVal){
        entry[key] = newVal;
      } else if(norm(oldVal) !== norm(newVal)){
        const parts = oldVal.split(' / ').map(p => p.trim());
        if(!parts.some(p => norm(p) === norm(newVal))){
          entry[key] = oldVal + ' / ' + newVal;
          entry.history.push({ ts: nowIso(), field: key, old: oldVal, new: entry[key] });
        }
      }
    };
    mergeField('adresse');
    mergeField('telefonnummer');
    mergeField('email');
    mergeField('kundenname');
    mergeField('zaehler');
    mergeField('bauform');
    mergeField('standort');
    // Messlokation/Zählerplatz-ID only ever get filled in when missing (e.g. a
    // manually created entry with just Zähler+Standort gets "enriched" once
    // an import row with the same Zähler brings the Messlokation along) —
    // never combined, since that's meant to be a single stable identifier.
    if(!entry.kundencode && row.kundencode){
      entry.kundencode = row.kundencode;
      entry.history.push({ ts: nowIso(), field:'kundencode', old:'', new: row.kundencode + ' (automatisch ergänzt)' });
    }
    if(!entry.zaehlerplatzId && row.zaehlerplatzId) entry.zaehlerplatzId = row.zaehlerplatzId;
    if(!entry.koordinaten && row.koordinaten){
      entry.koordinaten = row.koordinaten;
      entry.koordinatenAktualisiertAm = todayDe();
      entry.koordinatenQuelle = 'import';
    }
  }
  return entry;
}
function todayDe(){
  const d = new Date();
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
}
function koordinatenQuelleDot(quelle, withLabel){

  if(quelle === 'import') return `<span title="Aus Import" style="color:#a3392f;font-size:14px">🔴</span>${withLabel ? ' aus Import' : ''}`;

}
function fmtHistoryDate(ts){
  const d = new Date(ts);
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
}
function lastFieldUpdateStr(entity, fieldName){
  if(!entity || !entity.history) return '';
  const entries = entity.history.filter(h => h.field === fieldName);
  if(entries.length === 0) return '';
  return fmtHistoryDate(entries[entries.length-1].ts);
}
function fieldUpdateHint(entity, fieldName){

}
function mostRecentUpdateStr(entity){

  const real = entity.history.filter(h => h.field !== 'angelegt');
  if(real.length === 0) return '';
  return fmtHistoryDate(real[real.length-1].ts);
}
function updateAuftragCoords(id, value){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  const oldStr = fmtCoords(a.koordinaten);
  if(!value.trim()){
    if(!a.koordinaten) return;
    a.history.push({ ts: nowIso(), field:'koordinaten', old: oldStr, new: '' });
    a.koordinaten = null;
    a.koordinatenAktualisiertAm = '';
    a.koordinatenQuelle = '';
    saveAuftraege();
    updateAdrCoords(ensureAdrEntryForAuftrag(a).id, null);
    render();
    return;
  }
  const parsed = parseCoords(value);
  if(!parsed){
    showToast('Ungültiges Koordinatenformat, z.B. 52.130, 11.630');
    render();
    return;
  }
  a.history.push({ ts: nowIso(), field:'koordinaten', old: oldStr, new: fmtCoords(parsed) });
  a.koordinaten = parsed;
  a.koordinatenAktualisiertAm = todayDe();
  a.koordinatenQuelle = 'manuell';
  saveAuftraege();
  updateAdrCoords(ensureAdrEntryForAuftrag(a).id, parsed);
  showToast('Gespeichert');
}
let pendingGpsAccept = null;
let pendingGpsRetry = null;

function captureGps(onSuccess, onFailure){
  if(!navigator.geolocation){
    showToast('Standortzugriff wird von diesem Gerät/Browser nicht unterstützt');
    if(onFailure) onFailure();
    return;
  }
  const threshold = settings.gpsAccuracyThreshold || 10;
  showToast(`Standort wird ermittelt… (Ziel: ±${threshold} m)`);

  let best = null;
  let watchId = null;
  let settled = false;
  let timeoutHandle = null;

  const cleanup = () => {
    if(watchId !== null) navigator.geolocation.clearWatch(watchId);
    if(timeoutHandle) clearTimeout(timeoutHandle);
  };
  const finish = (coords) => {
    if(settled) return;
    settled = true;
    cleanup();
    onSuccess(coords);
  };
  const onTimeout = () => {
    if(settled) return;
    settled = true;
    cleanup();
    if(best){
      offerLowAccuracyGps(best, threshold, onSuccess, onFailure);
    } else {
      showToast('Standort konnte nicht ermittelt werden — Berechtigung erteilt?');
      if(onFailure) onFailure();
    }
  };

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const acc = pos.coords.accuracy;
      const coords = { lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: acc };
      if(!best || acc < best.accuracy){ best = { ...coords }; }
      if(acc <= threshold){ finish(coords); }
    },
    () => { /* einzelne fehlerhafte Messungen ignorieren, auf Timeout verlassen */ },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
  );
  timeoutHandle = setTimeout(onTimeout, 8000);
}

function offerLowAccuracyGps(best, threshold, onSuccess, onFailure){
  pendingGpsAccept = () => {
    closeModal();
    onSuccess({ lat: best.lat, lon: best.lon, accuracy: best.accuracy });
  };
  pendingGpsRetry = () => {
    closeModal();
    captureGps(onSuccess, onFailure);
  };
  pendingGpsCancelFailureFn = onFailure || null;
  showModal(`
    <div class="modal-head"><h3>GPS-Genauigkeit gering</h3><button class="close-x" onclick="cancelGpsFailure()">✕</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-top:0">Beste erreichte Genauigkeit: <strong>±${Math.round(best.accuracy)} m</strong> (Ziel: ±${threshold} m).</p>
      <p class="hint">Am Fenster/im Freien wird GPS meist genauer. Trotzdem übernehmen oder nochmal versuchen?</p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="cancelGpsFailure()">Abbrechen</button>
      <button class="btn" onclick="pendingGpsRetry()">🔄 Erneut versuchen</button>
      <button class="btn primary" onclick="pendingGpsAccept()">Trotzdem verwenden</button>
    </div>
  `);
}
let pendingGpsCancelFailureFn = null;
function cancelGpsFailure(){
  closeModal();
  const fn = pendingGpsCancelFailureFn;
  pendingGpsCancelFailureFn = null;
  if(fn) fn();
}
function captureGpsForAuftrag(id){
  captureGps((coords) => {
    updateAuftragCoords(id, fmtCoords(coords));
    const a = auftraege.find(x => x.id === id);
    if(a && coords.accuracy != null){
      a.koordinatenGenauigkeit = Math.round(coords.accuracy);
      saveAuftraege();
      if(a.adrEntryId){
        const entry = adressbuch.find(e => e.id === a.adrEntryId);
        if(entry){ entry.koordinatenGenauigkeit = a.koordinatenGenauigkeit; saveAdressbuch(); }
      }
    }
    render();
  });
}
function captureGpsForAdr(id){
  captureGps((coords) => {
    updateAdrCoords(id, coords);
    const entry = adressbuch.find(e => e.id === id);
    if(entry && coords.accuracy != null){
      entry.koordinatenGenauigkeit = Math.round(coords.accuracy);
      saveAdressbuch();
    }
    render();
    showToast('Koordinaten gespeichert: ' + fmtCoords(coords) + (coords.accuracy != null ? ` (±${Math.round(coords.accuracy)}m)` : ''));
  });
}
function updateAdrCoords(entryId, coords){
  const entry = adressbuch.find(a => a.id === entryId);
  if(!entry) return;
  const oldStr = fmtCoords(entry.koordinaten);
  const newStr = fmtCoords(coords);
  if(oldStr === newStr) return;
  entry.history.push({ ts: nowIso(), field:'koordinaten', old: oldStr, new: newStr });
  entry.koordinaten = coords;
  entry.koordinatenAktualisiertAm = coords ? todayDe() : '';
  entry.koordinatenQuelle = coords ? 'manuell' : '';
  saveAdressbuch();

  const linked = auftraege.filter(a => a.adrEntryId === entryId);
  if(linked.length){
    linked.forEach(a => {
      a.history.push({ ts: nowIso(), field:'koordinaten', old: fmtCoords(a.koordinaten), new: newStr });
      a.koordinaten = coords;
      a.koordinatenAktualisiertAm = coords ? todayDe() : '';
      a.koordinatenQuelle = coords ? 'manuell' : '';
    });
    saveAuftraege();
  }
}
function updateAdrField(entryId, field, newVal){
  const entry = adressbuch.find(a => a.id === entryId);
  if(!entry) return;
  const oldVal = entry[field] || '';
  if(oldVal === newVal) return;
  entry.history.push({ ts: nowIso(), field, old: oldVal, new: newVal });
  entry[field] = newVal;
  saveAdressbuch();

  // push master-data corrections down into any linked Aufträge (read-only there)
  const linked = auftraege.filter(a => a.adrEntryId === entryId);
  if(linked.length){
    linked.forEach(a => {
      if(field in a){
        a.history.push({ ts: nowIso(), field, old: a[field]||'', new: newVal });
        a[field] = newVal;
      }
    });
    saveAuftraege();
  }
}

/* ---------------------------------------------------------------
   File Import (CSV/TSV via PapaParse, Excel/ODS via SheetJS)
--------------------------------------------------------------- */
let importAdrOnlyMode = false;
function startImport(adrOnly){
  importAdrOnlyMode = adrOnly;
  document.getElementById('csvInput').click();
}

document.getElementById('csvInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();

  function proceed(rows, headers, sheetInfo){
    if(!rows || rows.length === 0){
      showToast('Keine Zeilen in der Datei gefunden');
      return;
    }
    pendingCsvRows = rows;
    pendingCsvHeaders = headers;
    if(sheetInfo) showToast(sheetInfo);
    if(!columnMapping || !mappingMatchesHeaders(pendingCsvHeaders)){
      openMappingModal(false);
    } else {
      runImport();
    }
  }

  if(ext === 'csv' || ext === 'tsv' || ext === 'txt'){
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: function(results){
        proceed(results.data, results.meta.fields || []);
      },
      error: function(err){ showToast('Datei konnte nicht gelesen werden'); }
    });
  } else if(ext === 'xlsx' || ext === 'xls' || ext === 'ods') {
    const reader = new FileReader();
    reader.onload = function(evt){
      try{
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheetName = wb.SheetNames[0];
        const sheet = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
        const headers = rows.length ? Object.keys(rows[0]) : (XLSX.utils.sheet_to_json(sheet, { header:1 })[0] || []);
        const info = wb.SheetNames.length > 1
          ? `Tabellenblatt "${sheetName}" verwendet (von ${wb.SheetNames.length} Blättern)`
          : null;
        proceed(rows, headers, info);
      }catch(err){
        showToast('Excel-Datei konnte nicht gelesen werden');
      }
    };
    reader.onerror = function(){ showToast('Datei konnte nicht gelesen werden'); };
    reader.readAsArrayBuffer(file);
  } else {
    showToast('Nicht unterstütztes Dateiformat: .' + ext);
  }
  e.target.value = '';
});

function mappingMatchesHeaders(headers){
  if(!columnMapping) return false;
  const req = ['kundencode','vorgang'];
  return req.every(k => headers.includes(columnMapping[k]));
}

function openMappingModal(manual){

    { key:'kundencode', label:'Messlokation', required:true },

    { key:'email', label:'E-Mail', required:false },
    { key:'zaehlerplatzId', label:'Zählerplatz-ID', required:false },
  ];

    { key:'kundenname', label:'Kundenname (eine Spalte)' },

    { key:'nachname', label:'Nachname' },
  ];
  const addressFields = [
    { key:'adresse', label:'Adresse (eine Spalte)' },

    { key:'hausnummer', label:'Hausnummer' },
    { key:'hausnummerzusatz', label:'Hausnummerzusatz' },

    const optionsHtml = opts.map(o => `<option value="${escapeHtml(o)}" ${o===current?'selected':''}>${o===''?'– nicht vorhanden –':escapeHtml(o)}</option>`).join('');
    return `<div class="mapping-row">
      <label>${f.label}${f.required?' <span class="req-star">*</span>':''}</label>

  } else {

      ${basicFields.map(buildRow).join('')}

      ${kundeFields.map(buildRow).join('')}
      <p class="hint" style="margin:14px 0 8px"><strong>Adresse</strong> — entweder eine fertige Spalte wählen, oder aus mehreren Spalten zusammensetzen (z.B. Straße + Hausnummer + Ort):</p>
      ${addressFields.map(buildRow).join('')}
      <p class="hint" style="margin:14px 0 8px"><strong>Zähler</strong>:</p>

      <p class="hint" style="margin-top:0">Ordne die Spalten deiner Datei den benötigten Feldern zu. Diese Zuordnung wird gespeichert und beim nächsten Import automatisch wiederverwendet.</p>
      ${bodyHtml}
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" ${headers.length===0?'disabled':''} onclick="confirmMapping(${manual})">Übernehmen${pendingCsvRows && !manual ? ' & importieren' : ''}</button>
    </div>
  `);
}

function confirmMapping(manual){
  const fields = ['kundencode','vorgang','auftragsnummer','auftragsbeschreibung','telefonnummer','email','zaehlerplatzId',
    'kundenname','vorname','nachname',
    'adresse','strasse','hausnummer','hausnummerzusatz','ortsteil','ort',
    'zaehler','bauform','standort',
    'breite','laenge','koordinaten'];
  const mapping = {};
  for(const f of fields){
    const el = document.getElementById('map_'+f);
    mapping[f] = el ? el.value : '';
  }
  if(!mapping.kundencode || (!mapping.vorgang && !importAdrOnlyMode)){
    showToast(importAdrOnlyMode ? 'Messlokation muss zugeordnet werden' : 'Messlokation und Vorgang müssen zugeordnet werden');
    return;
  }
  columnMapping = mapping;
  saveMapping();
  closeModal();
  if(!manual && pendingCsvRows){
    runImport();
  } else {
    showToast('Spaltenzuordnung gespeichert');
  }
}

function toStr(v){
  if(v === undefined || v === null) return '';
  let s = v.toString().trim();
  // Excel sometimes stores identifiers (meter numbers etc.) as numbers,
  // which surfaces as a trailing ".0" once converted to text — strip that.
  if(/^\d+\.0$/.test(s)) s = s.slice(0, -2);
  return s;
}

function buildAddress(raw, m){
  if(m.adresse && toStr(raw[m.adresse]).trim()){
    return toStr(raw[m.adresse]).trim();
  }
  const strasse = m.strasse ? toStr(raw[m.strasse]).trim() : '';
  const hausnr = m.hausnummer ? toStr(raw[m.hausnummer]).trim() : '';
  const hausnrZusatz = m.hausnummerzusatz ? toStr(raw[m.hausnummerzusatz]).trim() : '';
  const ortsteil = m.ortsteil ? toStr(raw[m.ortsteil]).trim() : '';
  const ort = m.ort ? toStr(raw[m.ort]).trim() : '';

  const strassenteil = [strasse, (hausnr + hausnrZusatz)].filter(Boolean).join(' ');
  const parts = [ortsteil, strassenteil, ort].filter(Boolean);
  return parts.join(', ');
}

function buildCoords(raw, m){
  if(m.breite && m.laenge){
    const latRaw = toStr(raw[m.breite]).trim().replace(',', '.');
    const lonRaw = toStr(raw[m.laenge]).trim().replace(',', '.');
    const lat = parseFloat(latRaw);
    const lon = parseFloat(lonRaw);
    if(!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180){
      return { lat, lon };
    }
    return null;
  }
  if(m.koordinaten){
    return parseCoords(raw[m.koordinaten]);
  }
  return null;
}

function buildKundenname(raw, m){
  if(m.kundenname && toStr(raw[m.kundenname]).trim()){
    return toStr(raw[m.kundenname]).trim();
  }
  const vorname = m.vorname ? toStr(raw[m.vorname]).trim() : '';
  const nachname = m.nachname ? toStr(raw[m.nachname]).trim() : '';
  return [vorname, nachname].filter(Boolean).join(' ');
}

function isOhneTerminStandort(standort){
  if(!standort) return false;
  const s = standort.toString().toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
  return s.includes('station') || s.includes('zaehleranschlusssaeule');
}

function runImport(){
  if(!pendingCsvRows || !columnMapping){ return; }
  const m = columnMapping;
  let added = 0, updatedExisting = 0, skippedDup = 0, skippedEmpty = 0, adrOnly = 0;

  // Map of ALL existing Aufträge (including erledigt) by key, so duplicates —
  // including already-completed ones — are recognized and never recreated.
  // Auftragsnummer is a true unique identifier per real work order, so a
  // completed one must always "win" over a re-imported copy of itself.
  const useAuftragsnummer = !!m.auftragsnummer;
  const existingByKey = new Map();
  auftraege.forEach(a => {
    const secondPart = useAuftragsnummer ? norm(a.auftragsnummer) : norm(a.vorgang);
    existingByKey.set(norm(a.kundencode) + '|' + secondPart, a);
  });

  for(const raw of pendingCsvRows){
    const kundencode = toStr(m.kundencode ? raw[m.kundencode] : '');
    const vorgang = toStr(m.vorgang ? raw[m.vorgang] : '');
    const auftragsnummer = toStr(m.auftragsnummer ? raw[m.auftragsnummer] : '');
    const zaehlerplatzId = toStr(m.zaehlerplatzId ? raw[m.zaehlerplatzId] : '');
    const telefonnummer = toStr(m.telefonnummer ? raw[m.telefonnummer] : '');
    const email = toStr(m.email ? raw[m.email] : '');
    const auftragsbeschreibung = toStr(m.auftragsbeschreibung ? raw[m.auftragsbeschreibung] : '');
    const adresse = buildAddress(raw, m);
    const koordinaten = buildCoords(raw, m);
    const kundenname = buildKundenname(raw, m);
    const zaehler = toStr(m.zaehler ? raw[m.zaehler] : '');
    const bauform = toStr(m.bauform ? raw[m.bauform] : '');
    const standort = toStr(m.standort ? raw[m.standort] : '');

    // Only skip a row if there's truly nothing at all to record — every row
    // with any usable field still gets an address book entry, even without
    // a Messlokation or Zählerplatz-ID.
    const hasAnyData = kundencode.trim() || zaehlerplatzId.trim() || adresse.trim()
      || telefonnummer.trim() || kundenname.trim() || standort.trim() || zaehler.trim();
    if(!hasAnyData){ skippedEmpty++; continue; }

    // Always keep the address book current — regardless of whether this
    // row has a Vorgang (Auftragstyp). This is the master data (Anschrift,
    // Zählerplatz-ID, Standort etc.) and should cover every metering point,
    // not just ones with a currently open order.
    const adrEntry = upsertAdrFromImport({ kundencode, vorgang, telefonnummer, email, adresse, zaehlerplatzId, koordinaten, kundenname, zaehler, bauform, standort });

    if(importAdrOnlyMode || !vorgang.trim() || !kundencode.trim()){
      adrOnly++;
      continue; // Anlagen-only mode, or no Auftragstyp/Messlokation → address book updated, but no Auftrag created
    }

    const key = norm(kundencode) + '|' + (useAuftragsnummer ? norm(auftragsnummer) : norm(vorgang));

    if(existingByKey.has(key)){
      // Duplicate: don't touch fields already filled (manual edits win),
      // but backfill anything still empty — covers newly-mapped columns
      // (e.g. Auftragsbeschreibung) that didn't exist on the first import.
      const existing = existingByKey.get(key);
      const backfill = { telefonnummer, email, auftragsbeschreibung, adresse, zaehlerplatzId, koordinaten, kundenname, zaehler, bauform, standort, auftragsnummer };
      let changed = false;
      Object.entries(backfill).forEach(([field, val]) => {
        const isEmpty = existing[field] === '' || existing[field] === null || existing[field] === undefined;
        const hasVal = field === 'koordinaten' ? !!val : (val !== '' && val !== null && val !== undefined);
        if(isEmpty && hasVal){
          existing.history.push({ ts: nowIso(), field, old:'', new: field==='koordinaten' ? fmtCoords(val) : val });
          existing[field] = val;
          if(field === 'koordinaten') existing.koordinatenQuelle = 'import';
          changed = true;
        }
      });
      if(changed) updatedExisting++;
      skippedDup++;
      continue;
    }

    const effectiveStandort = standort || adrEntry.standort || '';

    const newAuftrag = {
      id: uid(),
      kundencode: kundencode.trim(),
      vorgang: vorgang.trim(),
      auftragsnummer: auftragsnummer.trim(),
      auftragsbeschreibung: auftragsbeschreibung,
      telefonnummer: telefonnummer || adrEntry.telefonnummer || '',
      email: email || adrEntry.email || '',
      adresse: adresse || adrEntry.adresse || '',
      zaehlerplatzId: zaehlerplatzId || adrEntry.zaehlerplatzId || '',
      koordinaten: koordinaten || adrEntry.koordinaten || null,
      koordinatenQuelle: (koordinaten || adrEntry.koordinaten) ? (adrEntry.koordinatenQuelle || 'import') : '',
      kundenname: kundenname || adrEntry.kundenname || '',
      zaehler: zaehler || '',
      bauform: bauform || adrEntry.bauform || '',
      standort: effectiveStandort,
      adrEntryId: adrEntry.id,
      status: isOhneTerminStandort(effectiveStandort) ? 'ohne_termin' : 'offen',
      kommentar: '',
      termin: null,
      importedAt: nowIso(),
      history: [{ ts: nowIso(), field:'angelegt', old:'', new:'aus Datei-Import' }]
    };
    auftraege.push(newAuftrag);
    existingByKey.set(key, newAuftrag);
    added++;
  }

  saveAuftraege();
  saveAdressbuch();
  settings.lastImport = { ts: nowIso(), added, updatedExisting, skippedDup, skippedEmpty, adrOnly, adrOnlyMode: importAdrOnlyMode };
  saveSettings();
  pendingCsvRows = null;
  render();

  if(importAdrOnlyMode){
    showToast(`Anlagen-Import fertig: ${adrOnly} Zeilen verarbeitet, ${updatedExisting} bestehende ergänzt, keine Aufträge angelegt`);
  } else {
    const bits = [`${added} neu`];
    if(updatedExisting) bits.push(`${updatedExisting} bestehende ergänzt`);
    if(adrOnly) bits.push(`${adrOnly} nur ins Anlagen (kein Vorgang)`);
    bits.push(`${skippedDup - updatedExisting} unverändert übersprungen`);
    showToast(`Import fertig: ${bits.join(', ')}`);
  }
  importAdrOnlyMode = false;
}

/* ---------------------------------------------------------------
   Backup export / import (for syncing via SharePoint/OneDrive)
--------------------------------------------------------------- */
function adressbuchExportRows(){
  return adressbuch.slice()
    .sort((a,b) => (a.adresse||'').localeCompare(b.adresse||''))
    .map(e => ({
      'Kundenname': e.kundenname || '',
      'Adresse': e.adresse || '',
      'Telefonnummer': e.telefonnummer || '',
      'E-Mail': e.email || '',
      'Standort': e.standort || '',
      'Zähler': e.zaehler || '',
      'Bauform Zähler': e.bauform || '',
      'Zählerplatz-ID': e.zaehlerplatzId || '',
      'Messlokation': e.kundencode || '',
      'Breitengrad': e.koordinaten ? e.koordinaten.lat : '',
      'Längengrad': e.koordinaten ? e.koordinaten.lon : '',
    }));
}

function exportAdressbuchExcel(){
  if(adressbuch.length === 0){ showToast('Anlagen ist leer'); return; }
  const rows = adressbuchExportRows();
  const ws = XLSX.utils.json_to_sheet(rows);
  // Force ID-like columns to text format so Excel never turns them into numbers
  // (that's exactly the ".0" / lost-leading-zero bug we hit before).
  const textCols = ['Telefonnummer','Zähler','Zählerplatz-ID','Messlokation'];
  const headerRow = Object.keys(rows[0] || {});
  textCols.forEach(colName => {
    const colIdx = headerRow.indexOf(colName);
    if(colIdx === -1) return;
    for(let r = 1; r <= rows.length; r++){
      const cellRef = XLSX.utils.encode_cell({ r, c: colIdx });
      const cell = ws[cellRef];
      if(cell && cell.v !== ''){ cell.t = 's'; cell.z = '@'; }
    }
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Anlagen');
  XLSX.writeFile(wb, `adressbuch-export-${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('Anlagen als Excel exportiert');
}

function exportAdressbuchCsv(){
  if(adressbuch.length === 0){ showToast('Anlagen ist leer'); return; }
  const rows = adressbuchExportRows();
  const csv = Papa.unparse(rows);
  // UTF-8 BOM so Excel shows Umlaute (ä/ö/ü) correctly when opening the CSV directly
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `adressbuch-export-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showToast('Anlagen als CSV exportiert');
}

async function exportBackup(){
  const payload = {
    kind: 'auftragsmappe-sicherung',
    version: 1,
    exportedAt: nowIso(),
    auftraege,
    adressbuch,
    settings,
    columnMapping,
  };
  const jsonStr = JSON.stringify(payload, null, 2);
  const filename = 'auftragsmappe-daten.json';
  const file = new File([jsonStr], filename, { type: 'application/json' });

  let shared = false;
  if(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })){
    try{
      await navigator.share({ files: [file], title: 'Auftragsmappe-Sicherung' });
      shared = true;
    }catch(e){
      // user cancelled the share sheet, or it failed — fall through to download
      if(e && e.name === 'AbortError'){ return; } // user just cancelled, don't also trigger a download
    }
  }

  if(!shared){
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  settings.lastExport = nowIso();
  saveSettings();
  render();
  showToast(shared ? 'Sicherung geteilt' : 'Sicherung heruntergeladen – im SharePoint-/OneDrive-Ordner ablegen');
}

document.getElementById('backupInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    let data;
    try{ data = JSON.parse(evt.target.result); }
    catch(err){ showToast('Datei ist kein gültiges Sicherungs-JSON'); return; }
    const looksValid = data.kind === 'auftragsmappe-sicherung'
      || (Array.isArray(data.auftraege) && Array.isArray(data.adressbuch));
    if(!looksValid){
      showToast('Das ist keine Auftragsmappen-Sicherungsdatei (keine Aufträge/Anlagen darin gefunden)');
      return;
    }
    if(data.kind !== 'auftragsmappe-sicherung'){
      showToast('Hinweis: Kennzeichnung fehlte in der Datei, importiere trotzdem (Struktur passt)');
    }
    mergeBackup(data);
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Returns a dedupe+sorted union of two history arrays
function mergeHistories(h1, h2){
  const all = (h1||[]).concat(h2||[]);
  const seen = new Set();
  const out = [];
  for(const h of all){
    const key = h.ts + '|' + h.field + '|' + h.new;
    if(seen.has(key)) continue;
    seen.add(key);
    out.push(h);
  }
  out.sort((a,b) => new Date(a.ts) - new Date(b.ts));
  return out;
}
function lastTs(history){
  if(!history || history.length === 0) return 0;
  return Math.max(...history.map(h => new Date(h.ts).getTime()));
}
// Merge two records of the same entity: field values come from whichever
// side was edited more recently, history is the union of both, nothing lost.
function mergeRecord(local, incoming, fieldKeys){
  const mergedHistory = mergeHistories(local.history, incoming.history);
  const localNewer = lastTs(local.history) >= lastTs(incoming.history);
  const base = localNewer ? local : incoming;
  const merged = Object.assign({}, base);
  merged.history = mergedHistory;
  return merged;
}
function mergeCollection(localArr, incomingArr){
  const map = new Map();
  for(const item of localArr) map.set(item.id, item);
  for(const item of incomingArr){
    if(!map.has(item.id)){
      map.set(item.id, item);
    } else {
      map.set(item.id, mergeRecord(map.get(item.id), item));
    }
  }
  return Array.from(map.values());
}

function mergeBackup(data, silent){
  const beforeA = auftraege.length, beforeB = adressbuch.length;
  auftraege = mergeCollection(auftraege, data.auftraege || []);
  adressbuch = mergeCollection(adressbuch, data.adressbuch || []);

  // keep local settings unless locally unset
  if(!settings.organizerEmail && data.settings && data.settings.organizerEmail){
    settings.organizerEmail = data.settings.organizerEmail;
  }
  if(!columnMapping && data.columnMapping){
    columnMapping = data.columnMapping;
  }
  settings.lastMergeImport = { ts: nowIso(), sourceExportedAt: data.exportedAt };

  saveAuftraege();
  saveAdressbuch();
  saveSettings();
  if(columnMapping) saveMapping();
  if(!silent){
    render();
    showToast(`Sicherung zusammengeführt (${auftraege.length - beforeA >= 0 ? '+'+(auftraege.length-beforeA) : (auftraege.length-beforeA)} Aufträge, ${adressbuch.length - beforeB >= 0 ? '+'+(adressbuch.length-beforeB) : (adressbuch.length-beforeB)} Adressen neu)`);
  }
}

function moveColumnPicker(index, direction){
  syncTempColumnOrderFromDom();
  const target = index + direction;
  if(target < 0 || target >= tempColumnOrder.length) return;
  const tmp = tempColumnOrder[index];
  tempColumnOrder[index] = tempColumnOrder[target];
  tempColumnOrder[target] = tmp;
  document.getElementById('colPickerBody').innerHTML = renderColumnPickerRows();
}

function saveColumnPicker(){
  syncTempColumnOrderFromDom();
  settings.columnOrder = tempColumnOrder.map(item => item.key);
  tempColumnOrder.forEach(item => { settings.visibleColumns[item.key] = item.visible !== false; });
  saveSettings();
  closeModal();
  render();
