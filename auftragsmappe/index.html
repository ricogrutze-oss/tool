}

function slugify(label){
  return 'cf_' + label.toString().trim().toLowerCase()
    .replace(/[äÄ]/g,'ae').replace(/[öÖ]/g,'oe').replace(/[üÜ]/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || ('feld' + Date.now());
}

function addCustomField(){
  const input = document.getElementById('newCustomFieldLabel');
  const label = input ? input.value.trim() : '';
  if(!label){ showToast('Bitte einen Namen für das Feld eingeben'); return; }
  if(!settings.customFields) settings.customFields = [];
  let key = slugify(label);
  let n = 1;
  while(settings.customFields.some(cf => cf.key === key) || COLUMN_LABELS[key]){
    key = slugify(label) + '_' + (++n);
  }
  settings.customFields.push({ key, label });
  if(!settings.visibleColumns) settings.visibleColumns = {};
  settings.visibleColumns[key] = true;
  saveSettings();
  render();
  showToast('Feld „' + label + '" hinzugefügt');
}

function removeCustomField(key){
  settings.customFields = (settings.customFields||[]).filter(cf => cf.key !== key);
  saveSettings();
  render();
  showToast('Feld entfernt (bereits eingetragene Werte in Aufträgen bleiben erhalten)');
}

function renderStatistik(){
  const total = auftraege.length;
  const byStatus = {};
  Object.keys(STATUS).forEach(k => byStatus[k] = 0);
  auftraege.forEach(a => { byStatus[a.status] = (byStatus[a.status]||0) + 1; });

  const byVorgang = {};
  auftraege.forEach(a => { if(a.vorgang) byVorgang[a.vorgang] = (byVorgang[a.vorgang]||0) + 1; });
  const vorgangSorted = Object.entries(byVorgang).sort((a,b) => b[1]-a[1]).slice(0, 8);

  const now = new Date();
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - ((now.getDay()+6)%7)); startOfWeek.setHours(0,0,0,0);
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  let erledigtWeek = 0, erledigtMonth = 0;
  auftraege.forEach(a => {
    if(a.status !== 'erledigt') return;
    const entry = a.history.slice().reverse().find(h => h.field === 'status' && h.new === STATUS.erledigt.label);
    if(!entry) return;
    const d = new Date(entry.ts);
    if(d >= startOfWeek) erledigtWeek++;
    if(d >= startOfMonth) erledigtMonth++;
  });

  const maxStatusCount = Math.max(1, ...Object.values(byStatus));
  const statusRows = Object.entries(STATUS).map(([k,v]) => `
    <div class="stat-row">
      <span class="stat-label">${v.label}</span>
      <div class="stat-bar-track"><div class="stat-bar-fill ${v.cls}" style="width:${(byStatus[k]/maxStatusCount*100).toFixed(0)}%"></div></div>
      <span class="stat-count">${byStatus[k]}</span>
    </div>`).join('');

  const maxVorgangCount = Math.max(1, ...vorgangSorted.map(v => v[1]));
  const vorgangRows = vorgangSorted.map(([name,count]) => `
    <div class="stat-row">
      <span class="stat-label">${escapeHtml(name)}</span>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(count/maxVorgangCount*100).toFixed(0)}%;background:${colorForVorgang(name)}"></div></div>
      <span class="stat-count">${count}</span>
    </div>`).join('');

  return `
    <div class="settings-section">
      <h4>Überblick</h4>
      <div class="stat-summary">
        <div class="stat-tile"><div class="stat-tile-num">${total}</div><div class="stat-tile-label">Gesamt</div></div>
        <div class="stat-tile"><div class="stat-tile-num">${byStatus.offen||0}</div><div class="stat-tile-label">Offen</div></div>
        <div class="stat-tile"><div class="stat-tile-num">${byStatus.erledigt||0}</div><div class="stat-tile-label">Erledigt</div></div>
        <div class="stat-tile"><div class="stat-tile-num">${erledigtWeek}</div><div class="stat-tile-label">Diese Woche erledigt</div></div>
        <div class="stat-tile"><div class="stat-tile-num">${erledigtMonth}</div><div class="stat-tile-label">Diesen Monat erledigt</div></div>
      </div>
    </div>
    <div class="settings-section">
      <h4>Nach Status</h4>
      ${statusRows}
    </div>
    <div class="settings-section">
      <h4>Nach Vorgangstyp (Top 8)</h4>
      ${vorgangRows || '<p class="hint">Noch keine Daten</p>'}
    </div>
  `;
}

    }
  });
  return entries;
}

function renderTermineWeek(entries){
  const now = new Date();
  const dayOfWeek = (now.getDay()+6)%7; // Monday = 0
  const monday = new Date(now);
  monday.setDate(now.getDate() - dayOfWeek + termineWeekOffset*7);
  monday.setHours(0,0,0,0);

  const todayIso = new Date().toISOString().slice(0,10);
  const dayNames = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    const dateIso = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    days.push({ dateIso, dateDe: `${pad(d.getDate())}.${pad(d.getMonth()+1)}.`, name: dayNames[i], isToday: dateIso === todayIso });
  }
  const weekLabel = `${days[0].dateDe} – ${days[6].dateDe} ${monday.getFullYear()} · KW ${getIsoWeek(monday)}`;

  const groupsHtml = days.map(day => {
    const dayEntries = entries.filter(e => e.dateIso === day.dateIso).sort((a,b)=>a.time.localeCompare(b.time));
    return `
      <div class="agenda-group">
        <div class="agenda-date-header ${day.isToday?'is-today':''}">${day.name}, ${day.dateDe} ${monday.getFullYear()}${day.isToday?' · Heute':''}</div>
        ${dayEntries.length ? dayEntries.map(agendaItemHtml).join('') : `<div class="agenda-item" style="cursor:default"><span class="muted" style="font-size:12.5px">Keine Termine</span></div>`}
      </div>`;
  }).join('');

  return `
    <div class="view-toggle">
      <button class="btn small" onclick="shiftTermineWeek(-1)">◀ Vorherige Woche</button>
      <span class="muted" style="font-size:12.5px">${weekLabel}</span>
      <button class="btn small" onclick="shiftTermineWeek(1)">Nächste Woche ▶</button>
      ${termineWeekOffset !== 0 ? `<button class="btn small ghost" onclick="termineWeekOffset=0;render()">Heute</button>` : ''}
    </div>
    <div class="grid-wrap" style="padding:8px 0">${groupsHtml}</div>`;
}
function getIsoWeek(d){
  const date = new Date(d.getTime());
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - (date.getDay()+6)%7);
  const week1 = new Date(date.getFullYear(),0,4);
  return 1 + Math.round(((date-week1)/86400000 - 3 + (week1.getDay()+6)%7)/7);
}

function renderTermine(list, allAuftraege){
  const todayIso = new Date().toISOString().slice(0,10);
  const viewToggleHtml = `
    <div class="view-toggle">
      <button class="btn small ${termineViewMode==='agenda'?'active':''}" onclick="toggleTermineViewMode('agenda')">📋 Agenda</button>
      <button class="btn small ${termineViewMode==='woche'?'active':''}" onclick="toggleTermineViewMode('woche')">🗓️ Woche</button>
    </div>`;

  if(termineViewMode === 'woche'){
    const allEntries = buildAgendaEntries(auftraege.filter(a=>a.termin), allAuftraege);
    return viewToggleHtml + renderTermineWeek(allEntries);
  }

  // Build one combined list of agenda entries: Termine + Rückrufe (Wiedervorlage)
  let entries = buildAgendaEntries(list, allAuftraege);

  // By default: hide erledigt Aufträge and anything before today — done is done.
  const hiddenCount = entries.filter(e => e.auftrag.status === 'erledigt' || e.dateIso < todayIso).length;
  if(!termineShowPast){
    entries = entries.filter(e => e.auftrag.status !== 'erledigt' && e.dateIso >= todayIso);
  }

  const toggleBarHtml = hiddenCount > 0 ? `
    <div class="view-toggle">
      <button class="btn small ${termineShowPast?'active':''}" onclick="toggleTerminePast()">
        ${termineShowPast ? '🙈 Vergangene/erledigte wieder ausblenden' : `👁 ${hiddenCount} vergangene/erledigte anzeigen`}
      </button>
    </div>` : '';

  if(entries.length === 0){
    return viewToggleHtml + (toggleBarHtml || `<div class="empty-state">
      <div class="big">Noch keine Termine oder Rückrufe</div>
      <div>Termine (📅) und Rückruf-Erinnerungen (📞) erscheinen hier zusammen, chronologisch nach Tag.</div>
    </div>`);
  }

  const sorted = entries.slice().sort((a,b) => (a.dateIso + 'T' + a.time).localeCompare(b.dateIso + 'T' + b.time));

  const groups = [];
  let currentGroup = null;
  sorted.forEach(entry => {
    if(!currentGroup || currentGroup.dateIso !== entry.dateIso){
      currentGroup = { dateIso: entry.dateIso, date: entry.date, items: [] };
      groups.push(currentGroup);
    }
    currentGroup.items.push(entry);
  });

  const groupsHtml = groups.map(g => {
    const isPast = g.dateIso < todayIso;
    const isToday = g.dateIso === todayIso;
    const itemsHtml = g.items.map(agendaItemHtml).join('');
    return `
      <div class="agenda-group">
        <div class="agenda-date-header ${isPast?'is-past':''} ${isToday?'is-today':''}">
          ${g.date}${isToday ? ' · Heute' : ''}
        </div>
        ${itemsHtml}
      </div>`;
  }).join('');

  return `${viewToggleHtml}${toggleBarHtml}<div class="grid-wrap" style="padding:8px 0">${groupsHtml}</div>`;
}

function daysSinceLastBackup(){
  const dates = [];
  if(settings.lastExport) dates.push(new Date(settings.lastExport));
  if(settings.folderLastSync) dates.push(new Date(settings.folderLastSync));
  if(dates.length === 0) return null;
  const mostRecent = new Date(Math.max(...dates.map(d => d.getTime())));
  return Math.floor((Date.now() - mostRecent.getTime()) / (1000*60*60*24));
}
function backupStalenessWarningHtml(){
  // Only nudge if there's no auto-synced folder linked — that case is already handled automatically.
  if(photoFolderHandle && !photoFolderNeedsPermission) return '';
  const days = daysSinceLastBackup();
  if(days === null){
    return `<p class="hint" style="color:var(--red)">⚠️ Noch nie gesichert. Bei einer über Jahre wachsenden Liste lohnt sich eine regelmäßige Sicherung außerhalb des Geräts.</p>`;
  }
  if(days >= 14){
    return `<p class="hint" style="color:var(--red)">⚠️ Letzte Sicherung ist ${days} Tage her. Zeit für eine neue Sicherung nach SharePoint/OneDrive.</p>`;
  }
  return '';
}

function dupKeyFor(mode, a){
  switch(mode){
    case 'auftragsnummer': return norm(a.kundencode) + '|' + norm(a.auftragsnummer);
    case 'zaehler': return norm(a.kundencode) + '|' + norm(a.zaehler);
    case 'vorgang': return norm(a.kundencode) + '|' + norm(a.vorgang);
    case 'kundencode': return norm(a.kundencode);
    default: return norm(a.kundencode) + '|' + norm(a.auftragsnummer);
  }
}
function buildDupGroups(mode){
  const groups = {};
  auftraege.forEach(a => {
    const key = dupKeyFor(mode, a);
    if(!groups[key]) groups[key] = [];
    groups[key].push(a);
  });
  return groups;
}

        <label style="display:flex;gap:8px;align-items:center"><input type="radio" name="dupKeyMode" value="zaehler"> Messlokation + Zählernummer</label>
        <label style="display:flex;gap:8px;align-items:center"><input type="radio" name="dupKeyMode" value="vorgang"> Messlokation + Vorgang</label>
        <label style="display:flex;gap:8px;align-items:center"><input type="radio" name="dupKeyMode" value="kundencode"> Nur Messlokation <span class="muted">(fasst auch verschiedene Vorgänge zusammen!)</span></label>
      </div>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="previewCleanupDuplicates()">Weiter</button></div>
  `);

function previewCleanupDuplicates(){
  const mode = document.querySelector('input[name="dupKeyMode"]:checked').value;
  const groups = buildDupGroups(mode);
  const dupGroups = Object.values(groups).filter(g => g.length > 1);
  const totalRemovable = dupGroups.reduce((sum,g) => sum + g.length - 1, 0);
  if(totalRemovable === 0){
    showToast('Keine Duplikate gefunden für dieses Kriterium');
    return;
  }
  showModal(`
    <div class="modal-head"><h3>Duplikate zusammenführen?</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-top:0">${dupGroups.length} Kombinationen sind doppelt vorhanden — macht ${totalRemovable} überzählige Aufträge.</p>
      <p class="hint">Ist einer davon bereits erledigt, wird der behalten (mit Status, Notizen, Termin, Foto). Fehlende Felder werden vorher aus den anderen übernommen. Nicht rückgängig zu machen.</p>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Abbrechen</button><button class="btn danger" onclick="doCleanupDuplicates('${mode}')">Zusammenführen</button></div>
  `);
}
function doCleanupDuplicates(mode){
  const groups = buildDupGroups(mode);
  const toRemove = new Set();
  let removedCount = 0, keptErledigt = 0;
  const mergeFields = ['telefonnummer','email','adresse','zaehlerplatzId','koordinaten','kundenname','zaehler','bauform','standort','auftragsbeschreibung','auftragsnummer'];

  Object.values(groups).forEach(group => {
    if(group.length < 2) return;
    // Prefer to keep an erledigt one; otherwise keep the one with the most filled fields.
    let keep = group.find(a => a.status === 'erledigt');
    if(keep) keptErledigt++;
    if(!keep){
      keep = group.slice().sort((a,b) => {
        const filledCount = (x) => mergeFields.filter(f => x[f]).length;
        return filledCount(b) - filledCount(a);
      })[0];
    }
    group.forEach(a => {
      if(a === keep) return;
      mergeFields.forEach(f => {
        const isEmpty = keep[f] === '' || keep[f] === null || keep[f] === undefined;
        const hasVal = f === 'koordinaten' ? !!a[f] : (a[f] !== '' && a[f] !== null && a[f] !== undefined);
        if(isEmpty && hasVal){
          keep.history.push({ ts: nowIso(), field: f, old:'', new: f==='koordinaten' ? fmtCoords(a[f]) : a[f] + ' (aus Duplikat übernommen)' });
          keep[f] = a[f];
        }
      });
      toRemove.add(a.id);
      removedCount++;
    });
  });

  auftraege = auftraege.filter(a => !toRemove.has(a.id));
  saveAuftraege();
  closeModal();
  render();
  showToast(`${removedCount} Duplikate entfernt (${keptErledigt}× erledigten Auftrag behalten)`);
}

      <p class="hint">Danach deine Ursprungsdatei einmal neu importieren, um die korrekten Koordinaten pro Zeile wieder aufzufüllen. Nicht rückgängig zu machen.</p>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Abbrechen</button><button class="btn danger" onclick="doResetKoordinaten()">Koordinaten zurücksetzen</button></div>
  `);

function findSuspectAuftraege(){
  // The actual bug: multiple Aufträge with DIFFERENT Messlokation/Zähler
  // incorrectly pointing at the very SAME Anlagen-entry object (adrEntryId).
  // That's a real merge error. This deliberately does NOT look at coordinate
  // VALUES, because it's entirely legitimate for many different Messlokationen
  // to share the same real-world position (e.g. a Stationsgebäude or
  // Zähleranschlusssäule serving several customers) — that's correct data,
  // not a bug, and must never be touched.
  const byEntry = {};
  auftraege.forEach(a => {
    if(!a.adrEntryId) return;
    if(!byEntry[a.adrEntryId]) byEntry[a.adrEntryId] = [];
    byEntry[a.adrEntryId].push(a);
  });
  const suspects = [];
  Object.values(byEntry).forEach(group => {
    if(group.length < 2) return;
    const distinctKeys = new Set(group.map(a => norm(a.kundencode) + '|' + norm(a.zaehler)));
    if(distinctKeys.size > 1) suspects.push(...group);
  });
  return suspects;
}
function confirmResetZaehler(){
  showModal(`
    <div class="modal-head"><h3>Zähler-Werte zurücksetzen?</h3><button class="close-x" onclick="closeModal()">✕</button></div>

      <p class="hint">Grund: Aus früheren Test-Importen können falsche/veraltete Zähler-Werte hängengeblieben sein, die ein normaler Reimport nicht überschreibt (er füllt nur leere Felder). Danach deine saubere Ursprungsdatei neu importieren, dann wird jeder Auftrag wieder mit seinem korrekten, zeilenspezifischen Zähler befüllt.</p>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Abbrechen</button><button class="btn danger" onclick="doResetZaehler()">Zähler zurücksetzen</button></div>
  `);
}
function doResetZaehler(){
  let count = 0;
  auftraege.forEach(a => {
    if(a.zaehler){
      a.history.push({ ts: nowIso(), field:'zaehler', old: a.zaehler, new:'' });
      a.zaehler = '';
      count++;
    }
  });
  adressbuch.forEach(e => {
    if(e.zaehler){
      e.history.push({ ts: nowIso(), field:'zaehler', old: e.zaehler, new:'' });
      e.zaehler = '';
    }
  });
  saveAuftraege();
  saveAdressbuch();
  closeModal();
  render();
  showToast(`${count} Zähler-Werte zurückgesetzt — jetzt Ursprungsdatei neu importieren.`);
}

function doResetKoordinaten(){
  const suspects = findSuspectAuftraege();

  suspects.forEach(a => {
    if(a.koordinaten){
      a.history.push({ ts: nowIso(), field:'koordinaten', old: fmtCoords(a.koordinaten), new:'' });
    }
    a.koordinaten = null;
    a.koordinatenAktualisiertAm = '';
    a.koordinatenGenauigkeit = null;
    a.koordinatenQuelle = '';
    // Also clear the wrong shared link itself — otherwise a reimport would just
    // find the same wrongly-shared Anlagen entry again via this stale id
    // and the coordinates would get merged right back together.
    a.history.push({ ts: nowIso(), field:'adrEntryId', old: a.adrEntryId, new:'(wird bei Import/Speichern neu verknüpft)' });
    a.adrEntryId = '';
  });

  saveAuftraege();
  closeModal();
  render();
  showToast(`${suspects.length} Aufträge korrigiert (Koordinaten + fehlerhafte Verknüpfung aufgelöst) — Rest blieb komplett unangetastet. Jetzt Ursprungsdatei neu importieren.`);
}

function getFullListForTab(tabKey){
  return auftraege.filter(a => tabKey === 'erledigt' ? a.status === 'erledigt' : a.status !== 'erledigt');
}

function applyFilters(list, tabKey){
  const f = filters[tabKey];
  if(!f.search && f.statuses.length === 0 && f.vorgaenge.length === 0) return list;
  const q = f.search.trim().toLowerCase();
  return list.filter(a => {
    if(f.statuses.length && !f.statuses.includes(a.status)) return false;
    if(f.vorgaenge.length && !f.vorgaenge.includes(a.vorgang)) return false;
    if(q){
      const haystack = [a.kundencode, a.kundenname, a.vorgang, a.adresse, a.standort,
        a.telefonnummer, a.email, a.zaehler, a.bauform, a.zaehlerplatzId, a.kommentar]
        .map(v => (v||'').toString().toLowerCase()).join(' ');
      if(!haystack.includes(q)) return false;
    }
    return true;
  });
}

function renderFilterBar(tabKey, fullList){
  const f = filters[tabKey];
  const statusActive = f.statuses.length > 0;
  const vorgangActive = f.vorgaenge.length > 0;
  const anyActive = !!(f.search || statusActive || vorgangActive);
  return `
    <div class="filter-bar">
      <input type="text" id="filtersearch-${tabKey}" class="filter-search" placeholder="Suchen (Name, Adresse, Messlokation, Kommentar…)"
        value="${escapeHtml(f.search)}" oninput="setFilter('${tabKey}','search', this.value)">
      <button class="btn small ${statusActive?'primary':''}" onclick="openMultiFilterModal('${tabKey}','status')">
        Status${statusActive ? ' (' + f.statuses.length + ')' : ''} ▾
      </button>
      <button class="btn small ${vorgangActive?'primary':''}" onclick="openMultiFilterModal('${tabKey}','vorgang')">
        Vorgangstyp${vorgangActive ? ' (' + f.vorgaenge.length + ')' : ''} ▾
      </button>
      ${anyActive ? `<button class="btn small ghost" onclick="resetFilter('${tabKey}')">✕ Filter zurücksetzen</button>` : ''}
    </div>`;
}

function setFilter(tabKey, key, value){
  filters[tabKey][key] = value;
  const searchEl = document.getElementById('filtersearch-' + tabKey);
  const cursorPos = searchEl ? searchEl.selectionStart : null;

  renderTabView(tabKey, getFullListForTab(tabKey));

  if(key === 'search'){
    const newEl = document.getElementById('filtersearch-' + tabKey);
    if(newEl){
      newEl.focus();
      if(cursorPos !== null) newEl.setSelectionRange(cursorPos, cursorPos);
    }
  }
}
function resetFilter(tabKey){
  filters[tabKey] = { search:'', statuses:[], vorgaenge:[] };
  render();
}

/* --- Excel-style multi-select filter popover (as a modal) --- */
function openMultiFilterModal(tabKey, type){
  const isStatus = type === 'status';
  const options = isStatus
    ? Object.entries(STATUS).map(([k,v]) => ({ value:k, label:v.label }))
    : Array.from(new Set(getFullListForTab(tabKey).map(a => a.vorgang).filter(Boolean))).sort().map(v => ({ value:v, label:v }));

  const current = filters[tabKey][isStatus ? 'statuses' : 'vorgaenge'];
  const startSelected = current.length === 0 ? options.map(o => o.value) : current.slice();
  tempFilterSelection = { tabKey, type, selected: startSelected };
  tempFilterOptions = options;

  showModal(`
    <div class="modal-head"><h3>${isStatus ? 'Status' : 'Vorgangstyp'} filtern</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="settings-row" style="margin-bottom:10px">
        <button class="btn small" onclick="toggleAllFilterOptions(true)">Alle auswählen</button>
        <button class="btn small" onclick="toggleAllFilterOptions(false)">Alle abwählen</button>
      </div>
      <div class="col-picker" id="filterOptionsBody">${renderFilterOptionRows()}</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="applyMultiFilter()">Anwenden</button>
    </div>
  `);
}
function renderFilterOptionRows(){
  return tempFilterOptions.map(o => `
    <label>
      <input type="checkbox" data-fval="${escapeHtml(o.value)}" ${tempFilterSelection.selected.includes(o.value)?'checked':''} onchange="syncFilterCheckbox(this)">
      ${escapeHtml(o.label)}
    </label>
  `).join('');
}
function syncFilterCheckbox(el){
  const val = el.dataset.fval;
  if(el.checked){
    if(!tempFilterSelection.selected.includes(val)) tempFilterSelection.selected.push(val);
  } else {
    tempFilterSelection.selected = tempFilterSelection.selected.filter(v => v !== val);
  }
}
function toggleAllFilterOptions(checkAll){
  tempFilterSelection.selected = checkAll ? tempFilterOptions.map(o => o.value) : [];
  document.getElementById('filterOptionsBody').innerHTML = renderFilterOptionRows();
}
function applyMultiFilter(){
  const { tabKey, type, selected } = tempFilterSelection;
  const key = type === 'status' ? 'statuses' : 'vorgaenge';
  // everything selected == no filter, stored as empty array for clean "all" state
  filters[tabKey][key] = (selected.length === tempFilterOptions.length) ? [] : selected.slice();
  closeModal();
  render();
}

  const list = applyFilters(fullList, tabKey);

      <span>${selCount} ausgewählt</span>

      <button class="btn small ghost" style="color:#fff" onclick="clearSelection('${tabKey}')">Auswahl aufheben</button>

  const toggleHtml = `
    <div class="view-toggle">
      <button class="btn small ${viewMode[tabKey]==='liste'?'active':''}" onclick="setViewMode('${tabKey}','liste')">📋 Liste</button>
      <button class="btn small ${viewMode[tabKey]==='karte'?'active':''}" onclick="setViewMode('${tabKey}','karte')">🗺️ Karte</button>

      `}
      ${list.length !== fullList.length ? `<span class="count-pill" style="margin-left:6px">${list.length} von ${fullList.length}</span>` : ''}
    </div>`;
  const filterHtml = renderFilterBar(tabKey, fullList);

  if(viewMode[tabKey] === 'karte'){

    initMapForTab(tabKey, list);
  } else {

    container.innerHTML = selectionBarHtml + filterHtml + toggleHtml + renderAuftragTable(list, tabKey === 'erledigt');
  }
}

  viewMode[tabKey] = mode;
  render();
}


let mapColorMode = { offen: 'status', erledigt: 'status' };

function colorForVorgang(str){
  const s = (str || '–').toString();
  let hash = 0;
  for(let i=0;i<s.length;i++){ hash = s.charCodeAt(i) + ((hash<<5)-hash); }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 58%, 40%)`;
}
function shapeForVorgang(str){
  const s = (str || '–').toString();
  let hash = 0;
  for(let i=0;i<s.length;i++){ hash = s.charCodeAt(i) * 7 + ((hash<<3)-hash); }
  const shapes = ['circle','square','diamond','triangle','hex'];
  return shapes[Math.abs(hash) % shapes.length];
}
function shapeMarkerHtml(vorgang, color, size, isSelected){
  const shape = shapeForVorgang(vorgang);
  const border = isSelected ? '3px solid var(--teal)' : '2px solid #fff';
  const glow = isSelected ? ', 0 0 6px rgba(31,92,86,.6)' : '';
  const mark = isSelected ? `<span style="color:#fff;font-size:${size-10}px;font-weight:bold">✓</span>` : '';
  const base = `width:${size}px;height:${size}px;background:${color};box-shadow:0 0 0 1px ${color}${glow};display:flex;align-items:center;justify-content:center`;
  switch(shape){
    case 'square':
      return `<div style="${base};border:${border}">${mark}</div>`;
    case 'diamond':
      return `<div style="${base};border:${border};transform:rotate(45deg)">${mark?`<span style="transform:rotate(-45deg)">${mark}</span>`:''}</div>`;
    case 'triangle':
      return `<div style="width:0;height:0;border-left:${size/2}px solid transparent;border-right:${size/2}px solid transparent;border-bottom:${size}px solid ${color};filter:drop-shadow(0 0 0 #fff)"></div>`;
    case 'hex':
      return `<div style="${base};border:${border};clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%)">${mark}</div>`;
    default:
      return `<div style="${base};border:${border};border-radius:50%">${mark}</div>`;
  }
}

function initMapForTab(tabKey, list){
  const withCoords = list.filter(a => a.koordinaten);
  const el = document.getElementById('map-' + tabKey);
  if(!el) return;
  if(mapInstances[tabKey]){ mapInstances[tabKey].remove(); delete mapInstances[tabKey]; }

  if(withCoords.length === 0){
    el.outerHTML = `<div class="map-empty">Keine Koordinaten in ${tabKey === 'erledigt' ? 'den erledigten' : 'den offenen'} Aufträgen vorhanden.</div>`;
    return;
  }

  const map = L.map('map-' + tabKey);
  mapInstances[tabKey] = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  const statusColor = {
    offen:'#55635f', ohne_termin:'#4a6b8a', in_bearbeitung:'#b5790a', termin_vereinbart:'#2b5a8c',
    kunde_rueckmeldung:'#6a4c8c', anlage_nicht_fertig:'#a3392f',
    warte_planung:'#b5540a', inbetriebnahme_erfolgt:'#106b78', erledigt:'#2c7a4b'
  };
  const statusIcon = {
    offen:'', ohne_termin:'🏭', in_bearbeitung:'🔧', termin_vereinbart:'📅',
    kunde_rueckmeldung:'📞', anlage_nicht_fertig:'🚧',
    warte_planung:'⏳', inbetriebnahme_erfolgt:'⚡', erledigt:'✅'
  };
  const byVorgang = mapColorMode[tabKey] === 'vorgang';
  const colorFor = (a) => byVorgang ? colorForVorgang(a.vorgang) : (statusColor[a.status] || '#55635f');

  const bounds = [];
  const sel = selection[tabKey];
  const cluster = L.markerClusterGroup({
    maxClusterRadius: 45,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false
  });
  withCoords.forEach(a => {
    const color = colorFor(a);
    const isSelected = sel.has(a.id);
    const size = isSelected ? 22 : 20;
    let innerHtml;
    if(byVorgang){
      innerHtml = shapeMarkerHtml(a.vorgang, color, size, isSelected);
    } else {
      const symbol = statusIcon[a.status] || '';
      innerHtml = `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:${isSelected?'3px solid var(--teal)':'2px solid #fff'};box-shadow:0 0 0 1px ${color}${isSelected?', 0 0 6px rgba(31,92,86,.6)':''};display:flex;align-items:center;justify-content:center;font-size:${size-9}px;line-height:1">${isSelected ? '✓' : symbol}</div>`;
    }
    const icon = L.divIcon({ className:'', html: innerHtml, iconSize:[size,size], iconAnchor:[size/2,size/2] });
    const marker = L.marker([a.koordinaten.lat, a.koordinaten.lon], { icon });
    marker.bindPopup(`
      <div class="pop-code">${escapeHtml(a.kundencode)}</div>
      ${a.kundenname ? `<div>${escapeHtml(a.kundenname)}</div>` : ''}
      <div>${escapeHtml(a.vorgang)}</div>
      <div class="pop-status" style="background:${color}22;color:${color}">${byVorgang ? escapeHtml(a.vorgang) : statusLabelWithTermin(a)}</div>
      ${a.adresse ? `<div style="margin-top:6px">${escapeHtml(a.adresse)}</div>` : ''}
      ${a.standort ? `<div class="muted">${escapeHtml(a.standort)}</div>` : ''}
      ${a.telefonnummer ? `<div class="muted">${escapeHtml(a.telefonnummer)}</div>` : ''}
      ${a.koordinaten && a.koordinatenQuelle ? `<div class="muted" style="font-size:11px">${koordinatenQuelleDot(a.koordinatenQuelle, true)}</div>` : ''}
      <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px">
        <input type="checkbox" ${isSelected?'checked':''} onchange="toggleSelect('${tabKey}','${a.id}')"> Für Route auswählen
      </label>
      <div style="margin-top:8px;display:flex;gap:6px">
        <button class="btn small" onclick="navigateToAuftrag('${a.id}')" style="flex:1">🧭 Navigation</button>
        <button class="btn small primary" onclick="openAuftragEditModal('${a.id}')" style="flex:1">✏️ Bearbeiten</button>
      </div>
    `);
    cluster.addLayer(marker);
    bounds.push([a.koordinaten.lat, a.koordinaten.lon]);
  });
  map.addLayer(cluster);
  if(showMyLocation[tabKey] && userLocationCache){
    const meIcon = L.divIcon({
      className: '',
      html: `<div style="width:22px;height:22px;border-radius:50%;background:#2b5a8c;border:3px solid #fff;box-shadow:0 0 0 2px #2b5a8c, 0 0 8px rgba(43,90,140,.6)"></div>`,
      iconSize:[22,22], iconAnchor:[11,11]
    });
    L.marker([userLocationCache.lat, userLocationCache.lon], { icon: meIcon }).addTo(map).bindPopup('📍 Dein Standort');
    bounds.push([userLocationCache.lat, userLocationCache.lon]);
  }
  if(bounds.length === 1){ map.setView(bounds[0], 15); }
  else{ map.fitBounds(bounds, { padding: [30,30] }); }
}

function setMapColorMode(tabKey, mode){
  mapColorMode[tabKey] = mode;

function renderMapLegend(tabKey, list){
  if(mapColorMode[tabKey] !== 'vorgang') return '';
  const types = Array.from(new Set(list.filter(a=>a.koordinaten).map(a=>a.vorgang).filter(Boolean))).sort();
  if(types.length === 0) return '';
  const chips = types.map(t => `
    <span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);margin-right:10px">
      <span style="width:12px;height:12px;display:inline-flex">${shapeMarkerHtml(t, colorForVorgang(t), 12, false)}</span>${escapeHtml(t)}
    </span>`).join('');
  return `<div style="padding:8px 2px 12px;line-height:2">${chips}</div>`;
}

/* ---------------------------------------------------------------
   Zähler-Scanner (QR/Barcode via Kamera) — ZXing-Engine
--------------------------------------------------------------- */
let zxingReader = null;

let scannerFillTarget = null;
let pendingScanCallback = null;

function openScanner(){
  scannerFillTarget = null;
  pendingScanCallback = null;
  openScannerModalUi('Zähler scannen', 'Halte den Barcode/QR-Code der Zählernummer vor die Kamera. Gefunden wird über das Feld „Zähler" bei Aufträgen und im Anlagen — springt direkt in die Bearbeitung.');
}
function openScannerModalUi(title, hint){
  if(typeof ZXing === 'undefined'){
    showToast('Scanner konnte nicht geladen werden (kein Internet?)');
    return;
  }
  showModal(`
    <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="close-x" onclick="closeScannerModal()">✕</button></div>
    <div class="modal-body">
      <video id="qr-video" style="width:100%;border-radius:8px;background:#000" playsinline muted></video>
      <p class="hint">${hint}</p>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeScannerModal()">Abbrechen</button></div>
  `);
  startScanner();
}

let scanStream = null;
let scanLoopActive = false;

async function startScanner(){
  const video = document.getElementById('qr-video');
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    scanStream = stream;
    video.srcObject = stream;
    await video.play();

    if('BarcodeDetector' in window){
      // Native, OS-level detection — no internet, no library, fast.
      let formats;
      try{ formats = await BarcodeDetector.getSupportedFormats(); }
      catch(e){ formats = ['qr_code','code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','data_matrix','pdf417']; }
      const detector = new BarcodeDetector({ formats });
      scanLoopActive = true;
      const scanFrame = async () => {
        if(!scanLoopActive) return;
        try{
          const codes = await detector.detect(video);
          if(codes && codes.length > 0){
            onScanSuccess(codes[0].rawValue);
            return;
          }
        }catch(e){ /* transient per-frame detection error, ignore */ }
        if(scanLoopActive) requestAnimationFrame(scanFrame);
      };
      scanFrame();
    } else if(typeof ZXing !== 'undefined'){
      // Fallback for browsers without native BarcodeDetector (e.g. Safari/iPhone)
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93,
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.QR_CODE,
        ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.PDF_417, ZXing.BarcodeFormat.AZTEC
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      zxingReader = new ZXing.BrowserMultiFormatReader(hints);
      zxingReader.decodeFromVideoElement(video, (result) => {
        if(result){ onScanSuccess(result.getText()); }
      });
    } else {
      showToast('Kein Scanner auf diesem Gerät verfügbar');
    }
  }catch(e){
    showToast('Kamera konnte nicht gestartet werden — Berechtigung erteilt?');
  }
}

function stopScanner(){
  scanLoopActive = false;
  if(zxingReader){
    try{ zxingReader.reset(); }catch(e){}
    zxingReader = null;
  }
  if(scanStream){
    scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
  }
}

function closeScannerModal(){
  stopScanner();
  scannerFillTarget = null;
  pendingScanCallback = null;
  closeModal();
}

function onScanSuccess(decodedText){
  stopScanner();
  const val = decodedText.trim();
  closeModal();

  if(pendingScanCallback){
    const cb = pendingScanCallback;
    pendingScanCallback = null;
    cb(val);
    return;
  }

  let found = auftraege.find(a => a.zaehler && a.zaehler.trim() === val);
  if(!found) found = auftraege.find(a => a.zaehler && a.zaehler.includes(val));
  if(found){
    openAuftragEditModal(found.id);
    return;
  }
  const adrHit = adressbuch.find(e => e.zaehler && (e.zaehler.trim() === val || e.zaehler.includes(val)));
  if(adrHit){
    openAnlageDetailModal(adrHit.id);
    return;
  }
  offerNewEntryForScannedZaehler(val);
}

function offerNewEntryForScannedZaehler(val){
  showModal(`
    <div class="modal-head"><h3>Kein Treffer</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-top:0">Kein Auftrag und kein Anlagen-Eintrag mit Zähler „${escapeHtml(val)}" gefunden.</p>
      <p class="hint">Gleich einen neuen Anlagen-Eintrag damit anlegen?</p>
    </div>

      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="switchTab('adressbuch');openNewAdrEntryModal({zaehler:'${val.replace(/'/g,"\\'")}'})">+ Neuer Eintrag</button>
    </div>
  `);
}

/* ---------------------------------------------------------------
   Sprachnotiz-Diktierfunktion (Web Speech API)
--------------------------------------------------------------- */
function startDictation(targetId){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    showToast('Diktierfunktion wird von diesem Browser nicht unterstützt (Chrome/Edge nutzen)');
    return;
  }
  const btn = document.getElementById('dictate_' + targetId);
  const recog = new SpeechRecognition();
  recog.lang = 'de-DE';
  recog.interimResults = false;
  recog.maxAlternatives = 1;
  if(btn){ btn.textContent = '🔴'; btn.title = 'Aufnahme läuft…'; }
  recog.onresult = (event) => {
    const text = event.results[0][0].transcript;
    const el = document.getElementById(targetId);
    if(el){ el.value = el.value ? el.value.trim() + ' ' + text : text; }
  };
  recog.onerror = () => { showToast('Diktat fehlgeschlagen oder Mikrofon nicht erlaubt'); };
  recog.onend = () => { if(btn){ btn.textContent = '🎙️'; btn.title = 'Diktieren'; } };
  try{ recog.start(); }catch(e){ showToast('Diktat konnte nicht gestartet werden'); }
}

function toggleSelect(tabKey, id){
  const sel = selection[tabKey];
  if(sel.has(id)) sel.delete(id); else sel.add(id);
  render();
}
function toggleSelectAll(tabKey, checked){
  const fullList = getFullListForTab(tabKey);
  const list = applyFilters(fullList, tabKey);
  const sel = selection[tabKey];
  if(checked){ list.forEach(a => sel.add(a.id)); }
  else{ list.forEach(a => sel.delete(a.id)); }
  render();
}
function clearSelection(tabKey){
  selection[tabKey].clear();
  render();
}

function openBulkStatusModal(tabKey){
  const count = selection[tabKey].size;
  showModal(`
    <div class="modal-head"><h3>Status für ${count} Aufträge ändern</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field">

function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180, dLon = (lon2-lon1) * Math.PI/180;
  const aa = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(aa));
}

function planRouteForSelection(tabKey){
  const ids = Array.from(selection[tabKey]);
  const items = auftraege.filter(a => ids.includes(a.id) && a.koordinaten);
  const skipped = ids.length - items.length;
  if(items.length === 0){
    showToast('Keine der ausgewählten Aufträge hat Koordinaten');
    return;
  }
  if(skipped > 0) showToast(`${skipped} ohne Koordinaten werden übersprungen`);

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      (pos) => buildAndOpenRoute(items, { lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => buildAndOpenRoute(items, null),
      { timeout: 6000 }
    );
  } else {
    buildAndOpenRoute(items, null);
  }
}

function computeRouteOrder(items, start){
  // Nearest-neighbor ordering. Returns [{ auftrag, travelKm }], travelKm = distance
  // from the previous stop (0 for the very first stop).
  const remaining = items.slice();
  const order = [];
  let current = start;
  if(!current){
    current = { lat: remaining[0].koordinaten.lat, lon: remaining[0].koordinaten.lon };
    order.push({ auftrag: remaining.shift(), travelKm: 0 });
  }
  while(remaining.length){
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((it, idx) => {
      const dist = haversineKm(current.lat, current.lon, it.koordinaten.lat, it.koordinaten.lon);
      if(dist < bestDist){ bestDist = dist; bestIdx = idx; }
    });
    const next = remaining.splice(bestIdx, 1)[0];
    order.push({ auftrag: next, travelKm: bestDist });
    current = { lat: next.koordinaten.lat, lon: next.koordinaten.lon };
  }
  return order;
}

function buildAndOpenRoute(items, start){
  const order = computeRouteOrder(items, start);
  const route = order.map(o => o.auftrag);

  const originParam = start ? `${start.lat},${start.lon}` : `${route[0].koordinaten.lat},${route[0].koordinaten.lon}`;
  const destination = route[route.length - 1];
  const destParam = `${destination.koordinaten.lat},${destination.koordinaten.lon}`;
  const waypointItems = start ? route.slice(0, -1) : route.slice(1, -1);
  const waypointsParam = waypointItems.map(it => `${it.koordinaten.lat},${it.koordinaten.lon}`).join('|');

  let url = `https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${destParam}&travelmode=driving`;
  if(waypointsParam) url += `&waypoints=${encodeURIComponent(waypointsParam)}`;
  window.open(url, '_blank');
}

/* ---------------------------------------------------------------
   Sammel-Termine für eine geplante Route (mit geschätzter Fahrzeit)
--------------------------------------------------------------- */
const ASSUMED_SPEED_KMH = 35; // grobe Annahme für Fahrzeit zwischen Stopps
let tempBulkRoute = [];

function planBulkTermineForSelection(tabKey){
  const ids = Array.from(selection[tabKey]);
  const items = auftraege.filter(a => ids.includes(a.id) && a.koordinaten);
  if(items.length === 0){ showToast('Keine ausgewählten Aufträge mit Koordinaten'); return; }

  const proceed = (start) => {
    tempBulkRoute = computeRouteOrder(items, start);
    tempBulkRoute._tabKey = tabKey;
    openBulkTerminModal();
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      (pos) => proceed({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => proceed(null),
      { timeout: 6000 }
    );
  } else proceed(null);
}

function openBulkTerminModal(){
  const today = new Date().toISOString().slice(0,10);
  showModal(`
    <div class="modal-head"><h3>Sammel-Termine für Route (${tempBulkRoute.length} Stopps)</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>Datum</label><input type="date" id="bulkTerminDate" value="${today}" oninput="updateBulkTerminPreview()"></div>
        <div class="field"><label>Startzeit</label><input type="time" id="bulkTerminStart" value="08:00" oninput="updateBulkTerminPreview()"></div>
        <div class="field" style="max-width:130px"><label>Dauer je Stopp (Min.)</label><input type="number" id="bulkTerminDuration" value="30" min="5" step="5" oninput="updateBulkTerminPreview()"></div>
      </div>
      <p class="hint">Reihenfolge wie bei der Routenplanung. Fahrzeit dazwischen grob geschätzt (Ø ${ASSUMED_SPEED_KMH} km/h), je nach Entfernung.</p>
      <div id="bulkTerminPreview">${renderBulkTerminPreview()}</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="confirmBulkTermine()">📅 Termine erstellen</button>
    </div>
  `);
}

function computeBulkTerminSchedule(){
  const dateIso = document.getElementById('bulkTerminDate')?.value || new Date().toISOString().slice(0,10);
  const startTime = document.getElementById('bulkTerminStart')?.value || '08:00';
  const duration = parseInt(document.getElementById('bulkTerminDuration')?.value, 10) || 30;
  const [y,mo,d] = dateIso.split('-').map(n=>parseInt(n,10));
  const [hh,mm] = startTime.split(':').map(n=>parseInt(n,10));
  let cursor = new Date(y, mo-1, d, hh, mm, 0);
  return tempBulkRoute.map((stop, idx) => {
    if(idx > 0){
      const travelMin = Math.max(5, Math.round(stop.travelKm / ASSUMED_SPEED_KMH * 60));
      cursor = new Date(cursor.getTime() + travelMin*60000);
    }
    const start = new Date(cursor.getTime());
    const end = new Date(start.getTime() + duration*60000);
    cursor = end;
    return { auftrag: stop.auftrag, start, end, travelKm: stop.travelKm };
  });
}

function renderBulkTerminPreview(){
  const schedule = computeBulkTerminSchedule();
  const rows = schedule.map((s, idx) => `
    <div class="agenda-item" style="cursor:default">
      <div class="agenda-time">${pad(s.start.getHours())}:${pad(s.start.getMinutes())}–${pad(s.end.getHours())}:${pad(s.end.getMinutes())}</div>
      <div class="agenda-main">
        <div class="agenda-title"><span class="code">${escapeHtml(s.auftrag.kundencode)}</span> ${escapeHtml(s.auftrag.kundenname||'')}</div>
        <div class="agenda-sub">${escapeHtml(s.auftrag.adresse||'')}${idx>0 ? ' · ~' + Math.max(5, Math.round(s.travelKm/ASSUMED_SPEED_KMH*60)) + ' Min. Fahrzeit davor' : ''}</div>
      </div>
    </div>
  `).join('');
  return `<div class="grid-wrap" style="margin-top:10px">${rows}</div>`;
}

  const el = document.getElementById('bulkTerminPreview');
  if(el) el.innerHTML = renderBulkTerminPreview();
}

function confirmBulkTermine(){
  const schedule = computeBulkTerminSchedule();
  const tabKey = tempBulkRoute._tabKey;
  const icsBlocks = [];

  schedule.forEach(s => {
    const a = s.auftrag;
    const dtStart = `${s.start.getFullYear()}${pad(s.start.getMonth()+1)}${pad(s.start.getDate())}T${pad(s.start.getHours())}${pad(s.start.getMinutes())}00`;
    const dtEnd = `${s.end.getFullYear()}${pad(s.end.getMonth()+1)}${pad(s.end.getDate())}T${pad(s.end.getHours())}${pad(s.end.getMinutes())}00`;
    const eventUid = uid() + '@auftragsmappe';
    const descLines = [];
    if(a.kundenname) descLines.push('Kunde: ' + a.kundenname);
    if(a.telefonnummer) descLines.push('Telefon: ' + a.telefonnummer);
    if(a.zaehler) descLines.push('Zähler: ' + a.zaehler);
    if(a.kommentar) descLines.push('Notiz: ' + a.kommentar);
    icsBlocks.push([
      'BEGIN:VEVENT',
      'UID:' + eventUid,
      'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z',
      'DTSTART:' + dtStart,
      'DTEND:' + dtEnd,
      'SUMMARY:' + icsEscape(a.vorgang || 'Termin'),
      'LOCATION:' + icsEscape(a.adresse || ''),
      'DESCRIPTION:' + icsEscape(descLines.join(String.fromCharCode(10))),
      'STATUS:CONFIRMED',
      'SEQUENCE:0',
      'END:VEVENT'
    ].join('\r\n'));

    const dateIsoStop = `${s.start.getFullYear()}-${pad(s.start.getMonth()+1)}-${pad(s.start.getDate())}`;
    const timeStop = `${pad(s.start.getHours())}:${pad(s.start.getMinutes())}`;
    const oldTermin = a.termin ? `${a.termin.date} ${a.termin.time}` : '';
    a.termin = {
      dateIso: dateIsoStop,
      date: `${pad(s.start.getDate())}.${pad(s.start.getMonth()+1)}.${s.start.getFullYear()}`,
      time: timeStop,
      duration: Math.round((s.end - s.start)/60000),
      uid: eventUid, sequence: 0
    };
    a.history.push({ ts: nowIso(), field:'termin', old: oldTermin, new: `${a.termin.date} ${a.termin.time}` });
    if(a.status === 'offen' || a.status === 'ohne_termin'){
      a.history.push({ ts: nowIso(), field:'status', old: STATUS[a.status].label, new: STATUS.termin_vereinbart.label });
      a.status = 'termin_vereinbart';
    }
  });

  const icsContent = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Auftragsmappe//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH']
    .concat(icsBlocks).concat(['END:VCALENDAR']).join('\r\n');
  const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `Route_${schedule.length}_Termine_${new Date().toISOString().slice(0,10)}.ics`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  saveAuftraege();
  if(tabKey) selection[tabKey].clear();
  closeModal();
  render();
  showToast(`${schedule.length} Termine erstellt und als Kalenderdatei heruntergeladen`);
}

    return `<div class="empty-state">

      <div>${isErledigtTab ? 'Erledigte Aufträge erscheinen hier automatisch.' : 'Importiere eine CSV- oder Excel-Datei, um Vorgänge anzulegen.'}</div>
    </div>`;
  }
  const cols = getOrderedVisibleColumns();
  const sel = selection[tabKey];
  const allChecked = list.every(a => sel.has(a.id));

  let sortedList;
  if(distanceSortActive[tabKey] && userLocationCache){
    const withDist = list.filter(a => a.koordinaten);
    const withoutDist = list.filter(a => !a.koordinaten);
    withDist.sort((a,b) => haversineKm(userLocationCache.lat, userLocationCache.lon, a.koordinaten.lat, a.koordinaten.lon)
                          - haversineKm(userLocationCache.lat, userLocationCache.lon, b.koordinaten.lat, b.koordinaten.lon));
    sortedList = withDist.concat(withoutDist);
  } else {
    sortedList = list.slice().sort((a,b) => (a.kundencode||'').localeCompare(b.kundencode||''));
  }

  const rows = sortedList.map(a => `
    <tr>
      <td data-label="Auswahl"><input type="checkbox" ${sel.has(a.id)?'checked':''} onchange="toggleSelect('${tabKey}','${a.id}')"></td>
      <td data-label="Messlokation"><span class="code-sm">${escapeHtml(a.kundencode)}</span>${(distanceSortActive[tabKey] && userLocationCache && a.koordinaten) ? ` <span class="muted" style="font-size:11px">(${haversineKm(userLocationCache.lat, userLocationCache.lon, a.koordinaten.lat, a.koordinaten.lon).toFixed(1)} km)</span>` : ''}</td>
      ${cols.map(key => getCellRenderer(key)(a)).join('')}
      <td data-label="Aktionen">
        <div class="row-actions">
          <button class="icon-btn" onclick="openAuftragEditModal('${a.id}')" title="Bearbeiten">✏️</button>
          <button class="icon-btn" onclick="navigateToAuftrag('${a.id}')" title="Navigation">🧭</button>
          <button class="icon-btn" onclick="openTerminModal('${a.id}')" title="Termin festlegen">📅</button>
          <button class="icon-btn" onclick="openAuftragHistory('${a.id}')" title="Verlauf">🕒</button>
        </div>
      </td>
    </tr>
  `).join('');

  const headCells = [`<th><input type="checkbox" ${allChecked?'checked':''} onchange="toggleSelectAll('${tabKey}', this.checked)"></th>`, '<th>Messlokation</th>']
    .concat(cols.map(key => `<th>${getColumnLabel(key)}</th>`))
    .concat(['<th></th>'])
    .join('');

  return `<div class="grid-wrap"><table>
    <thead><tr>${headCells}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function scanForNewAdrZaehler(){
  const fv = (id) => document.getElementById(id)?.value.trim() || '';
  const draft = {
    zaehler: '',
    koordinaten: fv('new_adr_koordinaten'),
    standort: fv('new_adr_standort'),
    kundenname: fv('new_adr_kundenname'),
    adresse: fv('new_adr_adresse'),
    telefon: fv('new_adr_telefon'),
    email: fv('new_adr_email'),
    kundencode: fv('new_adr_kundencode'),
    zaehlerplatzid: fv('new_adr_zaehlerplatzid'),
    bauform: fv('new_adr_bauform'),
    notiz: fv('new_adr_notiz'),
  };
  pendingScanCallback = (val) => {
    draft.zaehler = val;
    openNewAdrEntryModal(draft);
  };
  openScannerModalUi('Zähler scannen', 'Halte den Barcode/QR-Code der Zählernummer vor die Kamera — deine übrigen Eingaben bleiben erhalten.');

let newAdrEntryGpsAccuracy = null;
function captureGpsForNewEntry(){
  captureGps((coords) => {
    const el = document.getElementById('new_adr_koordinaten');
    if(el) el.value = fmtCoords(coords);
    newAdrEntryGpsAccuracy = coords.accuracy != null ? Math.round(coords.accuracy) : null;
    showToast('Standort übernommen' + (newAdrEntryGpsAccuracy != null ? ` (±${newAdrEntryGpsAccuracy}m)` : ''));
  });
}
function saveNewAdrEntry(){
  const val = (id) => document.getElementById(id)?.value.trim() || '';
  const zaehler = val('new_adr_zaehler');
  const standort = val('new_adr_standort');
  const adresse = val('new_adr_adresse');
  const koordinatenRaw = val('new_adr_koordinaten');
  const koordinaten = koordinatenRaw ? parseCoords(koordinatenRaw) : null;
  if(!zaehler || !koordinaten){
    showToast('Zähler und GPS-Koordinaten sind Pflichtfelder');
    return;
  }
  const dupZaehler = adressbuch.find(e => e.zaehler && norm(e.zaehler) === norm(zaehler));
  const dupAdresse = adresse && adressbuch.find(e => e.adresse && norm(e.adresse) === norm(adresse));
  if(dupZaehler || dupAdresse){
    const reasons = [];
    if(dupZaehler) reasons.push(`Zähler „${dupZaehler.zaehler}" (${dupZaehler.kundenname || dupZaehler.adresse || 'ohne Namen'})`);
    if(dupAdresse && dupAdresse !== dupZaehler) reasons.push(`Adresse „${dupAdresse.adresse}" (${dupAdresse.kundenname || 'ohne Namen'})`);
    showModal(`
      <div class="modal-head"><h3>Möglicher Doppeleintrag</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <p class="hint" style="margin-top:0">Es gibt schon einen ähnlichen Eintrag:</p>
        <ul style="margin:0 0 10px;padding-left:18px;font-size:13px">${reasons.map(r=>`<li>${escapeHtml(r)}</li>`).join('')}</ul>
        <p class="hint">Trotzdem einen neuen, separaten Eintrag anlegen?</p>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
        <button class="btn primary" onclick="createNewAdrEntry()">Trotzdem anlegen</button>
      </div>
    `);
    return;
  }
  createNewAdrEntry();
}
function createNewAdrEntry(){
  const val = (id) => document.getElementById(id)?.value.trim() || '';
  const zaehler = val('new_adr_zaehler');
  const koordinatenRaw = val('new_adr_koordinaten');
  const koordinaten = koordinatenRaw ? parseCoords(koordinatenRaw) : null;
  const entry = {
    id: uid(),
    kundencode: val('new_adr_kundencode'),
    zaehlerplatzId: val('new_adr_zaehlerplatzid'),
    kundenname: val('new_adr_kundenname'),
    adresse: val('new_adr_adresse'),
    telefonnummer: val('new_adr_telefon'),
    email: val('new_adr_email'),
    koordinaten,
    koordinatenAktualisiertAm: todayDe(),
    koordinatenGenauigkeit: newAdrEntryGpsAccuracy,
    koordinatenQuelle: koordinaten ? 'manuell' : '',
    zaehler,
    bauform: val('new_adr_bauform'),
    standort: val('new_adr_standort'),
    notiz: val('new_adr_notiz'),
    history: [{ ts: nowIso(), field:'angelegt', old:'', new:'manuell angelegt' }]
  };
  adressbuch.push(entry);
  saveAdressbuch();
  newAdrEntryGpsAccuracy = null;
  closeModal();
  render();
  showToast('Eintrag angelegt');
}

function initAdrMap(entries){
  const withCoords = entries.filter(e => e.koordinaten);
  const el = document.getElementById('map-adressbuch');
  if(!el) return;
  if(adrMapInstance){ adrMapInstance.remove(); adrMapInstance = null; }

  if(withCoords.length === 0){
    el.outerHTML = `<div class="map-empty">Keine Koordinaten im Anlagen vorhanden.</div>`;
    return;
  }

  const map = L.map('map-adressbuch');
  adrMapInstance = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  const cluster = L.markerClusterGroup({ maxClusterRadius: 50 });
  const bounds = [];
  withCoords.forEach(e => {
    const marker = L.marker([e.koordinaten.lat, e.koordinaten.lon]);
    marker.bindPopup(`
      <div class="pop-code">${escapeHtml(e.kundenname || e.kundencode || 'Messpunkt')}</div>
      ${e.adresse ? `<div style="margin-top:4px">${escapeHtml(e.adresse)}</div>` : ''}
      ${e.zaehlerplatzId ? `<div class="muted" style="font-family:var(--font-mono);font-size:11px">${escapeHtml(e.zaehlerplatzId)}</div>` : ''}
      ${e.telefonnummer ? `<div class="muted">${escapeHtml(e.telefonnummer)}</div>` : ''}
      <div style="margin-top:8px;display:flex;gap:6px">
        <button class="btn small" onclick="navigateToAdr('${e.id}')" style="flex:1">🧭 Navigation</button>
        <button class="btn small primary" onclick="openAnlageDetailModal('${e.id}')" style="flex:1">✏️ Öffnen</button>
      </div>
    `);
    cluster.addLayer(marker);
    bounds.push([e.koordinaten.lat, e.koordinaten.lon]);
  });
  map.addLayer(cluster);
  map.fitBounds(bounds, { padding: [30,30] });
}

function navigateToAdr(id){
  const e = adressbuch.find(x => x.id === id);
  if(!e) return;
  let url;
  if(e.koordinaten) url = `https://www.google.com/maps/dir/?api=1&destination=${e.koordinaten.lat},${e.koordinaten.lon}`;
  else if(e.adresse) url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(e.adresse)}`;
  else { showToast('Keine Adresse oder Koordinaten hinterlegt'); return; }
  window.open(url, '_blank');
}

let adrViewMode = 'liste';

function renderAdressbuch(){
  if(adressbuch.length === 0){
    return `<div class="settings-row" style="margin-bottom:14px">
      <button class="btn primary" onclick="openNewAdrEntryModal()">+ Neuer Eintrag</button>
    </div>
    <div class="empty-state">

      <div>Einträge entstehen automatisch beim Import und bleiben dauerhaft erhalten, oder leg selbst einen an.</div>
    </div>`;
  }
  const q = adrSearch.trim().toLowerCase();
  const filtered = !q ? adressbuch : adressbuch.filter(e => {
    const haystack = [e.adresse, e.kundenname, e.zaehlerplatzId, e.kundencode, e.zaehler, e.telefonnummer, e.standort].map(v=>(v||'').toString().toLowerCase()).join(' ');
    return haystack.includes(q);
  });

  const searchBar = `
    <div class="filter-bar">
      <input type="text" id="adrSearchInput" class="filter-search" placeholder="Suchen nach Ort, Ortsteil, Straße oder Name…"
        value="${escapeHtml(adrSearch)}" oninput="setAdrSearch(this.value)">
      ${filtered.length !== adressbuch.length ? `<span class="count-pill">${filtered.length} von ${adressbuch.length}</span>` : ''}
    </div>`;

  const toggleHtml = `
    <div class="view-toggle">
      <button class="btn small ${adrViewMode==='liste'?'active':''}" onclick="setAdrViewMode('liste')">📋 Liste</button>
      <button class="btn small ${adrViewMode==='karte'?'active':''}" onclick="setAdrViewMode('karte')">🗺️ Karte</button>
      <button class="btn small primary" onclick="openNewAdrEntryModal()" style="margin-left:auto">+ Neuer Eintrag</button>
    </div>`;

  if(filtered.length === 0){
    return searchBar + toggleHtml + `<div class="empty-state"><div class="big">Keine Treffer</div><div>Versuch einen anderen Suchbegriff.</div></div>`;

    setTimeout(() => initAdrMap(filtered), 0);
    return searchBar + toggleHtml + `<div id="map-adressbuch" style="height:560px;border-radius:10px;overflow:hidden;border:1px solid var(--line)"></div>`;
  }

  if(adrMapInstance){ adrMapInstance.remove(); adrMapInstance = null; }

  const cards = filtered.slice().sort((a,b)=>(a.adresse||'').localeCompare(b.adresse||'')).map(e => {
    const detailsOpen = !!adrDetailsOpen[e.id];
    return `
    <div class="adr-card">
      <div class="adr-card-main">

          onchange="updateAdrField('${e.id}','adresse', this.value)">
        <input class="adr-phone-input" type="text" value="${escapeHtml(e.telefonnummer)}" placeholder="Telefonnummer"
          onchange="updateAdrField('${e.id}','telefonnummer', this.value)">
        <div style="display:flex;gap:8px;margin-top:2px">
          <input class="adr-addr-input" type="text" value="${escapeHtml(e.zaehler||'')}" placeholder="Zähler"
            onchange="updateAdrField('${e.id}','zaehler', this.value)" style="flex:1;font-family:var(--font-mono);font-size:12.5px">
          <input class="adr-addr-input" type="text" value="${escapeHtml(e.standort||'')}" placeholder="Standort" list="standortSuggestions"
            onchange="updateAdrField('${e.id}','standort', this.value)" style="flex:1">
        </div>
        ${mostRecentUpdateStr(e) ? `<span style="font-size:11px;color:var(--ink-soft)">Zuletzt geändert: ${mostRecentUpdateStr(e)}${e.koordinaten && e.koordinatenQuelle ? ` · ${koordinatenQuelleDot(e.koordinatenQuelle, true)}` : ''}</span>` : ''}
      </div>
      <div class="adr-card-actions">
        ${e.telefonnummer
          ? phoneButtonsHtml(e.telefonnummer)
          : `<button class="icon-btn" onclick="searchPhoneForAdr('${e.id}')" title="Im Web nach Telefonnummer suchen">🔍</button>`}
        <button class="icon-btn" onclick="toggleAdrDetails('${e.id}')" title="Details">${detailsOpen ? '▲' : '▼'}</button>
        <button class="icon-btn" onclick="openAdrHistory('${e.id}')" title="Verlauf">🕒 ${e.history.length}</button>
        <button class="icon-btn" onclick="openAdrUebersicht('${e.id}')" title="Übersichtsblatt (alle Daten + Fotos)">📄</button>

    filtered.forEach(e => {

    });

  return searchBar + toggleHtml + `<div class="adr-card-list">${cards}</div>`;
}
function updateAdrCoordsField(entryId, value){
  if(!value.trim()){ updateAdrCoords(entryId, null); render(); return; }
  const parsed = parseCoords(value);
  if(!parsed){ showToast('Ungültiges Koordinatenformat, z.B. 52.130, 11.630'); render(); return; }
  updateAdrCoords(entryId, parsed);
  showToast('Gespeichert');
}

   Field updates
--------------------------------------------------------------- */
function updateCustomField(id, key, value, silent){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  if(!a.customFields) a.customFields = {};
  const oldVal = a.customFields[key] || '';
  if(oldVal === value) return;
  a.history.push({ ts: nowIso(), field: key, old: oldVal, new: value });
  a.customFields[key] = value;
  saveAuftraege();
  if(!silent) showToast('Gespeichert');
}

function ensureAdrEntryForAuftrag(a){
  if(a.adrEntryId){
    const existing = adressbuch.find(e => e.id === a.adrEntryId);
    if(existing) return existing;
  }
  // Link is missing or points at a deleted entry (e.g. after "Anlagen löschen")
  // — heal it by creating a fresh entry from the Auftrag's current data instead
  // of silently dropping the update.
  const entry = {
    id: uid(),
    kundencode: a.kundencode || '',
    zaehlerplatzId: a.zaehlerplatzId || '',
    kundenname: a.kundenname || '',
    adresse: a.adresse || '',
    telefonnummer: a.telefonnummer || '',
    email: a.email || '',
    koordinaten: a.koordinaten || null,
    zaehler: a.zaehler || '',
    bauform: a.bauform || '',
    standort: a.standort || '',
    history: [{ ts: nowIso(), field:'angelegt', old:'', new:'automatisch ergänzt (Verknüpfung fehlte)' }]
  };
  adressbuch.push(entry);
  a.adrEntryId = entry.id;
  saveAdressbuch();
  return entry;
}

function updateAuftragField(id, field, value, silent){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  const oldVal = a[field] || '';
  if(oldVal === value) return;
  a.history.push({ ts: nowIso(), field, old: oldVal, new: value });
  a[field] = value;
  saveAuftraege();

  // propagate persistent customer/meter fields into address book
  const propagatedFields = ['telefonnummer','email','adresse','kundenname','zaehler','bauform','standort'];
  if(propagatedFields.includes(field)){
    const entry = ensureAdrEntryForAuftrag(a);
    updateAdrField(entry.id, field, value);
  }
  if(!silent) showToast('Gespeichert');
}

function setStatus(id, newStatus, silent){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  if(a.status === newStatus) return;
  if(newStatus === 'erledigt' && !silent){
    const missing = [];
    if(!a.telefonnummer) missing.push('Telefonnummer');
    if(!a.adresse) missing.push('Adresse');
    if(!a.koordinaten) missing.push('Koordinaten');
    if(missing.length > 0){
      confirmErledigtWithMissing(id, newStatus, missing);
      return;
    }
  }
  applyStatus(id, newStatus, silent);
}
function confirmErledigtWithMissing(id, newStatus, missing){
  showModal(`
    <div class="modal-head"><h3>Fehlende Daten</h3><button class="close-x" onclick="closeModal();render();">✕</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-top:0">Diesem Auftrag fehlen: <strong>${escapeHtml(missing.join(', '))}</strong>.</p>
      <p class="hint">Trotzdem als erledigt markieren?</p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal();render();">Abbrechen</button>
      <button class="btn primary" onclick="applyStatus('${id}','${newStatus}');closeModal();">Trotzdem markieren</button>
    </div>
  `);
}
function applyStatus(id, newStatus, silent){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  const old = a.status;
  if(old === newStatus) return;
  a.history.push({ ts: nowIso(), field:'status', old: STATUS[old].label, new: STATUS[newStatus].label });
  a.status = newStatus;
  saveAuftraege();
  if(!silent){
    render();
    const undo = () => {
      const a2 = auftraege.find(x => x.id === id);
      if(!a2) return;
      a2.history.push({ ts: nowIso(), field:'status', old: STATUS[a2.status].label, new: STATUS[old].label + ' (rückgängig)' });
      a2.status = old;
      saveAuftraege();
      render();
      showToast('Status zurückgesetzt auf „' + STATUS[old].label + '"');
    };
    showToast(newStatus === 'erledigt' ? 'Als erledigt markiert' : 'Status aktualisiert', undo);
  }
}

/* ---------------------------------------------------------------
   Wiedervorlage / Rückruf-Erinnerung
--------------------------------------------------------------- */
function setWiedervorlageQuick(auftragId, daysFromNow){
  const d = new Date();
  d.setDate(d.getDate() + daysFromNow);
  const iso = d.toISOString().slice(0,10);
  const datumEl = document.getElementById('edit_wiedervorlage_datum');
  const zeitEl = document.getElementById('edit_wiedervorlage_zeit');
  if(datumEl) datumEl.value = iso;
  const zeit = (zeitEl && zeitEl.value) ? zeitEl.value : '09:00';
  if(zeitEl) zeitEl.value = zeit;
  saveWiedervorlage(auftragId, iso, zeit);
}
function saveWiedervorlageFromModal(auftragId){
  const datumEl = document.getElementById('edit_wiedervorlage_datum');
  const zeitEl = document.getElementById('edit_wiedervorlage_zeit');
  const datum = datumEl ? datumEl.value : '';
  const zeit = (zeitEl && zeitEl.value) ? zeitEl.value : '09:00';
  if(!datum){ showToast('Bitte ein Datum wählen'); return; }
  saveWiedervorlage(auftragId, datum, zeit);
}
function clearWiedervorlage(auftragId){
  const a = auftraege.find(x => x.id === auftragId);
  if(!a || !a.wiedervorlage) return;
  a.history.push({ ts: nowIso(), field:'wiedervorlage', old: fmtDateDe(a.wiedervorlage.datum) + ' ' + a.wiedervorlage.zeit, new: 'entfernt' });
  a.wiedervorlage = null;
  saveAuftraege();
  render();
  showToast('Rückruf-Erinnerung entfernt');
}
function saveWiedervorlage(auftragId, datum, zeit){
  const a = auftraege.find(x => x.id === auftragId);
  if(!a) return;
  const oldVal = a.wiedervorlage ? (fmtDateDe(a.wiedervorlage.datum) + ' ' + a.wiedervorlage.zeit) : '';
  const newVal = fmtDateDe(datum) + ' ' + zeit;
  if(oldVal === newVal) return;
  a.history.push({ ts: nowIso(), field:'wiedervorlage', old: oldVal, new: newVal });
  a.wiedervorlage = { datum, zeit };
  saveAuftraege();
  render();
  showToast('Rückruf-Erinnerung gesetzt: ' + newVal);
}

    img{ max-width:100%; }
  </style></head><body>${content}</body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 300);
}

function openAdrHistory(id){
  const e = adressbuch.find(x => x.id === id);
  if(!e) return;
  showModal(`
    <div class="modal-head"><h3>Verlauf · ${escapeHtml(e.adresse || e.zaehlerplatzId || 'Anlagen')}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${historyHtml(e.history)}</div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Schließen</button></div>
  `);
}

/* ---------------------------------------------------------------
   Termin modal + ICS generation
--------------------------------------------------------------- */
function openTerminModal(id){
  const a = auftraege.find(x => x.id === id);
  if(!a) return;
  terminModalAuftragId = id;
  const today = new Date().toISOString().slice(0,10);
  showModal(`
    <div class="modal-head"><h3>Termin festlegen · ${escapeHtml(a.kundencode)}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>Datum</label><input type="date" id="terminDate" value="${a.termin ? a.termin.dateIso : today}"></div>
        <div class="field"><label>Uhrzeit</label><input type="time" id="terminTime" value="${a.termin ? a.termin.time : '09:00'}"></div>
        <div class="field" style="max-width:120px"><label>Dauer (Min.)</label><input type="number" id="terminDuration" value="${a.termin ? a.termin.duration : 60}" min="15" step="15"></div>
      </div>
      <div class="field">
        <label>Betreff</label>
        <input type="text" id="terminSubject" value="${escapeHtml(a.vorgang)}">
      </div>
      <div class="field">
        <label>Ort</label>
        <input type="text" id="terminLocation" value="${escapeHtml(a.adresse)}">
      </div>
      <div class="field">
        <label>Teilnehmer-E-Mail (optional)</label>
        <input type="email" id="terminAttendee" value="" placeholder="kunde@beispiel.de">
        <p class="hint">Standardmäßig wird eine normale Kalenderdatei erzeugt, die du beim Öffnen direkt in deinen Kalender übernimmst — ohne dass irgendwas automatisch an eine E-Mail-Adresse geht. Nur wenn du hier selbst eine Adresse einträgst, wird stattdessen eine Termineinladung erzeugt, die du nach dem Öffnen in Outlook noch senden musst.</p>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="generateIcs()">Termindatei erzeugen</button>
    </div>
  `);
}

function pad(n){ return n.toString().padStart(2,'0'); }

function generateIcs(){
  const a = auftraege.find(x => x.id === terminModalAuftragId);
  if(!a) return;
  const dateIso = document.getElementById('terminDate').value;
  const time = document.getElementById('terminTime').value;
  const duration = parseInt(document.getElementById('terminDuration').value, 10) || 60;
  const subject = document.getElementById('terminSubject').value || 'Termin';
  const location = document.getElementById('terminLocation').value || '';
  const attendee = document.getElementById('terminAttendee').value.trim();

  if(!dateIso || !time){ showToast('Bitte Datum und Uhrzeit angeben'); return; }
  if(!settings.organizerEmail){
    showToast('Bitte zuerst deine Absenderadresse hinterlegen');
    openSettingsModal();
    return;
  }

  const [y,mo,d] = dateIso.split('-').map(n=>parseInt(n,10));
  const [hh,mm] = time.split(':').map(n=>parseInt(n,10));
  const start = new Date(y, mo-1, d, hh, mm, 0);
  const end = new Date(start.getTime() + duration*60000);

  const dtStart = `${start.getFullYear()}${pad(start.getMonth()+1)}${pad(start.getDate())}T${pad(start.getHours())}${pad(start.getMinutes())}00`;
  const dtEnd = `${end.getFullYear()}${pad(end.getMonth()+1)}${pad(end.getDate())}T${pad(end.getHours())}${pad(end.getMinutes())}00`;
  const dtStamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const eventUid = (a.termin && a.termin.uid) ? a.termin.uid : (uid() + '@auftragsmappe');
  const seq = (a.termin && typeof a.termin.sequence === 'number') ? a.termin.sequence + 1 : 0;

  const descLines = [];
  if(a.kundenname) descLines.push('Kunde: ' + a.kundenname);
  if(a.telefonnummer) descLines.push('Telefon: ' + a.telefonnummer);
  if(a.zaehler) descLines.push('Zähler: ' + a.zaehler);
  if(a.auftragsbeschreibung) descLines.push('Beschreibung: ' + a.auftragsbeschreibung);
  if(a.kommentar) descLines.push('Notiz: ' + a.kommentar);
  const description = descLines.join(String.fromCharCode(10));

  const method = attendee ? 'REQUEST' : 'PUBLISH';
  let icsLines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Auftragsmappe//DE',
    'CALSCALE:GREGORIAN',
    'METHOD:' + method,
    'BEGIN:VEVENT',
    'UID:' + eventUid,
    'DTSTAMP:' + dtStamp,
    'DTSTART:' + dtStart,
    'DTEND:' + dtEnd,
    'SUMMARY:' + icsEscape(subject),
    'LOCATION:' + icsEscape(location),
    'DESCRIPTION:' + icsEscape(description),
    'ORGANIZER;CN=' + icsEscape(settings.organizerEmail) + ':mailto:' + settings.organizerEmail,
  ];
  if(attendee){
    icsLines.push('ATTENDEE;CN=' + icsEscape(a.kundencode) + ';RSVP=TRUE:mailto:' + attendee);
  }
  icsLines.push('STATUS:CONFIRMED');
  icsLines.push('SEQUENCE:' + seq);
  icsLines.push('END:VEVENT');
  icsLines.push('END:VCALENDAR');

  const icsContent = icsLines.join('\r\n');
  const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  const fileStamp = `${y}${pad(mo)}${pad(d)}_${pad(hh)}${pad(mm)}_${Date.now().toString().slice(-4)}`;
  link.download = `Termin_${(a.kundencode||'auftrag').replace(/[^a-z0-9]/gi,'_')}_${fileStamp}.ics`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  const oldTermin = a.termin ? `${a.termin.date} ${a.termin.time}` : '';
  a.termin = { dateIso, date: `${pad(d)}.${pad(mo)}.${y}`, time, duration, uid: eventUid, sequence: seq };
  a.history.push({ ts: nowIso(), field:'termin', old: oldTermin, new: `${a.termin.date} ${a.termin.time}` });
  if(a.status === 'offen'){
    a.history.push({ ts: nowIso(), field:'status', old: STATUS.offen.label, new: STATUS.termin_vereinbart.label });
    a.status = 'termin_vereinbart';
  }
  saveAuftraege();
  closeModal();
  render();
  showToast(attendee
    ? 'Termindatei heruntergeladen – öffnen und in Outlook senden'
    : 'Termindatei heruntergeladen – öffnen, um sie in den Kalender zu übernehmen');
}

function icsEscape(s){
  return (s||'').toString().replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}

/* ---------------------------------------------------------------
   Init
--------------------------------------------------------------- */
(async function init(){
  await loadAll();
  await tryRestorePhotoFolder();
  render();
  if(settings.remindersEnabled) startReminderChecks();
})();

function saveUserName(val){
  settings.userName = val.trim();
  saveSettings();
  showToast(settings.userName ? 'Name gespeichert: ' + settings.userName : 'Name entfernt');
}
function saveGpsAccuracyThreshold(val){
  const n = parseInt(val, 10);
  settings.gpsAccuracyThreshold = (n && n > 0) ? n : 10;
  saveSettings();
  showToast('GPS-Zielgenauigkeit: ±' + settings.gpsAccuracyThreshold + ' m');
}
function toggleReminders(enabled){
  if(enabled && Notification && Notification.permission !== 'granted'){
    Notification.requestPermission().then(perm => {
      if(perm === 'granted'){
        settings.remindersEnabled = true;
        saveSettings();
        startReminderChecks();
        showToast('Erinnerungen aktiviert');
      } else {
        settings.remindersEnabled = false;
        saveSettings();
        document.getElementById('remindersToggle').checked = false;
        showToast('Benachrichtigungen wurden nicht erlaubt');
      }
    });
  } else {
    settings.remindersEnabled = enabled;
    saveSettings();
    if(!enabled && reminderInterval){ clearInterval(reminderInterval); reminderInterval = null; }
    showToast(enabled ? 'Erinnerungen aktiviert' : 'Erinnerungen deaktiviert');
  }
}
let reminderInterval = null;
let remindedToday = {};
function startReminderChecks(){
  if(typeof Notification === 'undefined') return;
  if(reminderInterval) clearInterval(reminderInterval);
  checkDueReminders();
  reminderInterval = setInterval(checkDueReminders, 5 * 60 * 1000); // alle 5 Minuten
}
function checkDueReminders(){
  if(Notification.permission !== 'granted') return;
  const todayIso = new Date().toISOString().slice(0,10);
  auftraege.forEach(a => {
    if(a.wiedervorlage && a.status !== 'erledigt' && a.wiedervorlage.datum <= todayIso){
      const key = a.id + '_' + todayIso;
      if(remindedToday[key]) return;
      remindedToday[key] = true;
      new Notification('📞 Rückruf fällig', {
        body: `${a.kundencode} ${a.kundenname||''} — ${a.telefonnummer||'keine Nummer hinterlegt'}`,
        tag: key
      });
    }
  });
}

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
