<!DOCTYPE html>
<html lang="de">
<head>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Impulswert">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zähler & Wandler — Netzplaner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{ --bg:var(--tb-bg); --panel:var(--tb-panel); --panel2:var(--tb-panel2); --edge:var(--tb-edge); --amber:var(--tb-acc); --text:var(--tb-text); --text-dim:var(--tb-dim); }
  body { background-color: var(--bg); padding: 15px; font-family: sans-serif; font-size: 0.95rem; color: var(--text); }
  .card { border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid var(--edge); margin-bottom: 20px; background: var(--panel); }
  .header-bg { background: var(--panel2); color: var(--amber); padding: 15px; text-align: center; border-radius: 12px 12px 0 0; border-bottom: 1px solid var(--edge); }
  .header-bg h5{ margin:0; font-weight:700; }
  .btn-calc { background-color: var(--amber); color: var(--tb-on-acc); font-weight: bold; width: 100%; border-radius: 8px; padding: 12px; border: none; margin-top: 10px; }
  .result-card { background-color: var(--panel); border-left: 6px solid var(--amber); display: none; padding: 25px; border-radius: 8px; margin-top: 20px; border-top:1px solid var(--edge); border-right:1px solid var(--edge); border-bottom:1px solid var(--edge); }
  .output-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--edge); }
  .output-val { font-weight: 700; color: var(--text); }
  .form-control, .form-select { background:var(--tb-inset); border:1px solid var(--edge); color:var(--text); }
  .form-control:focus, .form-select:focus { background:var(--tb-inset); border-color:var(--amber); color:var(--text); box-shadow:0 0 0 .25rem color-mix(in srgb,var(--tb-acc) 20%,transparent); }
  label.fw-bold{ color: var(--text-dim); font-size:.85rem; }
  .text-primary{ color: var(--amber) !important; }
  .border-bottom{ border-color: var(--edge) !important; }
  .btn-danger{ background:var(--panel2); border:1px solid var(--edge); color:var(--text); }
  .highlight-box { background: var(--panel2); border-radius: 6px; padding: 10px; margin-top: 10px; border: 1px dashed var(--amber); }
  .backhome{
    position:fixed; top:10px; left:10px; z-index:9999;
    background:color-mix(in srgb,var(--tb-bg) 85%,transparent); color:var(--amber);
    border:1px solid var(--edge); border-radius:20px;
    padding:7px 14px; font-size:13px; font-weight:600;
    text-decoration:none; backdrop-filter:blur(6px);
  }
  @media print {
    .no-print, .backhome { display: none !important; }
    .result-card { display: block !important; border: none !important; box-shadow: none !important; }
    .page-break { page-break-before: always; }
    body { background: white; color:#000; }
    .output-val { color:#000 !important; }
  }
</style>
<style id="tb-tokens">
:root{--tb-bg:#000000;--tb-panel:#1c1c1e;--tb-panel2:#2c2c2e;--tb-inset:#121214;--tb-seg:#3a3a3c;--tb-toggle:#39393d;--tb-edge:#38383a;--tb-edge2:#48484a;--tb-acc:#8cc63f;--tb-acc-hi:#9fd652;--tb-acc-dim:#6f9c2e;--tb-on-acc:#0b1a02;--tb-text:#f5f5f7;--tb-dim:#98989f;--tb-green:#30d158;--tb-red:#ff453a;--tb-blue:#64a8ff;--tb-orange:#ff9f0a;--tb-purple:#bf8cff;--tb-cyan:#5ac8fa;color-scheme:dark;--tb-acc-bg:color-mix(in srgb,var(--tb-acc) 16%,var(--tb-panel));--tb-red-bg:color-mix(in srgb,var(--tb-red) 16%,var(--tb-panel));--tb-green-bg:color-mix(in srgb,var(--tb-green) 16%,var(--tb-panel));--tb-blue-bg:color-mix(in srgb,var(--tb-blue) 16%,var(--tb-panel));--tb-orange-bg:color-mix(in srgb,var(--tb-orange) 16%,var(--tb-panel));--tb-purple-bg:color-mix(in srgb,var(--tb-purple) 16%,var(--tb-panel));--tb-cyan-bg:color-mix(in srgb,var(--tb-cyan) 16%,var(--tb-panel));}
:root[data-theme="light"]{--tb-bg:#f2f2f7;--tb-panel:#ffffff;--tb-panel2:#eeeef3;--tb-inset:#f2f2f7;--tb-seg:#ffffff;--tb-toggle:#e5e5ea;--tb-edge:#d8d8de;--tb-edge2:#c6c6cc;--tb-acc:#6ba31a;--tb-acc-hi:#5d9111;--tb-acc-dim:#4d7a12;--tb-on-acc:#ffffff;--tb-text:#1c1c1e;--tb-dim:#6c6c70;--tb-green:#1f9d46;--tb-red:#d70015;--tb-blue:#0a64d8;--tb-orange:#c76a00;--tb-purple:#7a3fd0;--tb-cyan:#0a7ea4;color-scheme:light}
body{-webkit-font-smoothing:antialiased}
button:not(:disabled):active{opacity:.85}
@media print{#tb-theme-btn{display:none!important}}
</style>
<script id="tb-theme-js">
(function(){
  var K='toolbox-theme', root=document.documentElement, mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
  function mode(){try{var m=localStorage.getItem(K);return (m==='light'||m==='dark')?m:'auto'}catch(e){return 'auto'}}
  function eff(m){return m==='auto'?((mq&&mq.matches)?'light':'dark'):m}
  var ICON={auto:'◐',light:'☀︎',dark:'☾'}, NAME={auto:'Automatisch',light:'Hell',dark:'Dunkel'};
  function apply(){
    var m=mode(), e=eff(m);
    root.setAttribute('data-theme',e);
    if(root.hasAttribute('data-bs-theme')||window.bootstrap) root.setAttribute('data-bs-theme',e);
    var t=document.querySelector('meta[name="theme-color"]'); if(!t){t=document.createElement('meta');t.name='theme-color';document.head.appendChild(t)}
    t.content=e==='light'?'#f2f2f7':'#000000';
    var b=document.getElementById('tb-theme-btn'); if(b){b.textContent=ICON[m];b.title='Darstellung: '+NAME[m]+' (tippen zum Wechseln)';b.setAttribute('aria-label',b.title)}
    try{window.dispatchEvent(new CustomEvent('toolbox-theme',{detail:e}))}catch(x){}
  }
  function set(m){try{if(m==='auto')localStorage.removeItem(K);else localStorage.setItem(K,m)}catch(e){} apply()}
  function cycle(){var m=mode();set(m==='auto'?'light':m==='light'?'dark':'auto')}
  window.toolboxTheme={mode:mode,set:set,cycle:cycle,effective:function(){return eff(mode())}};
  apply();
  if(mq){(mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply))}
  window.addEventListener('storage',function(e){if(e.key===K||e.key===null)apply()});
  function btn(){
    if(window.top!==window.self||document.getElementById('tb-theme-btn')||!document.body)return;
    var s=document.createElement('style');
    s.textContent='#tb-theme-btn{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483000;width:38px;height:38px;border-radius:50%;border:.5px solid var(--tb-edge);background:var(--tb-panel2);color:var(--tb-text);font:18px/1 -apple-system,system-ui,sans-serif;padding:0;cursor:pointer;opacity:.88;box-shadow:0 2px 10px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent}#tb-theme-btn:active{transform:scale(.94)}';
    document.head.appendChild(s);
    var b=document.createElement('button');b.id='tb-theme-btn';b.type='button';b.addEventListener('click',cycle);document.body.appendChild(b);apply();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',btn);else btn();
})();
</script>
</head>
<body>

<div class="container" style="max-width: 750px;">
    <div class="card no-print">
        <div class="header-bg"><h5>Zähler-Konfiguration</h5></div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-12">
                    <label class="fw-bold">Zähler Impulswertigkeit (Optisch LED)</label>
                    <select id="z_imp_opt" class="form-select">
                        <option value="10000">10.000 Imp/kWh</option>
                        <option value="40000">40.000 Imp/kWh</option>
                        <option value="100000">100.000 Imp/kWh</option>
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-6"><label class="fw-bold">I Primär (A)</label><input type="number" id="a_pri" class="form-control"></div>
                <div class="col-6"><label class="fw-bold">I Sekundär (A)</label><select id="a_sec" class="form-select"><option value="5">5 A</option><option value="1">1 A</option></select></div>
            </div>
            <div class="row mb-3">
                <div class="col-6"><label class="fw-bold">U Primär (V)</label><input type="number" id="u_pri" class="form-control" value="400"></div>
                <div class="col-6"><label class="fw-bold">U Sekundär (V)</label><select id="u_sec" class="form-select"><option value="400">400 V</option><option value="100">100 V</option></select></div>
            </div>
            <button onclick="calculateZaehler()" class="btn btn-calc">ZÄHLER-PARAMETER BERECHNEN</button>
        </div>
    </div>
    <div id="result_zaehler" class="result-card">
        <h5 class="text-primary border-bottom pb-2">Zähler & Wandler-Protokoll</h5>
        <div class="output-row"><span>Wandlerfaktor Strom (ki):</span><span id="out_ki" class="output-val">-</span></div>
        <div class="output-row"><span>Wandlerfaktor Spannung (ku):</span><span id="out_ku" class="output-val">-</span></div>
        <div class="output-row highlight-box"><span>Gesamt-Wandlerfaktor (C):</span><span id="out_c_faktor" class="output-val text-primary">-</span></div>
        <h6 class="mt-4 fw-bold" style="color:var(--text-dim)">Reale Anlagenwerte (Primär):</h6>
        <div class="output-row" style="background: var(--tb-acc-bg);"><span>Impulswertigkeit Optisch:</span><span id="out_real_opt" class="output-val text-danger">-</span></div>
        <div class="output-row" style="background: var(--tb-acc-bg);"><span>Impulswertigkeit Elektrisch:</span><span id="out_real_el" class="output-val text-danger">-</span></div>
    </div>

    <button id="pdfBtn" onclick="window.print()" class="btn btn-danger no-print mt-3 w-100 shadow" style="display:none;">ALS PDF SPEICHERN</button>
</div>

<script>
function formatDE(num, decimals = 2) {
    if (isNaN(num)) return "-";
    return num.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: decimals });
}

function calculateZaehler() {
    const iPri = parseFloat(document.getElementById('a_pri').value);
    const iSec = parseFloat(document.getElementById('a_sec').value);
    const uPri = parseFloat(document.getElementById('u_pri').value);
    const uSec = parseFloat(document.getElementById('u_sec').value);
    const impOpt = parseFloat(document.getElementById('z_imp_opt').value);

    if (!iPri || iPri <= 0) return alert("Bitte einen gültigen Primärstrom eingeben!");
    if (!uPri || uPri <= 0) return alert("Bitte eine gültige Primärspannung eingeben!");

    const ki = iPri / iSec;
    const ku = uPri / uSec;
    const cF = ki * ku;
    document.getElementById('result_zaehler').style.display = 'block';
    document.getElementById('pdfBtn').style.display = 'block';
    document.getElementById('out_ki').innerText = formatDE(ki);
    document.getElementById('out_ku').innerText = formatDE(ku);
    document.getElementById('out_c_faktor').innerText = formatDE(cF);
    document.getElementById('out_real_opt').innerText = formatDE(impOpt/cF, 4) + " Imp/kWh";
    document.getElementById('out_real_el').innerText = formatDE((impOpt/2)/cF, 4) + " Imp/kWh";
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){});});}</script>
</body>
</html>
