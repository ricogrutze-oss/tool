<!DOCTYPE html>
<html data-bs-theme="dark" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bürde-Rechner | Rico Grzenda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-blue: #003366; --light-bg: #f0f4f8; }
        body { background-color: var(--light-bg); padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* App Card */
        .card { border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: none; max-width: 650px; margin: auto; overflow: hidden; }
        .header-bg { background: var(--primary-blue); color: white; padding: 20px; text-align: center; }
        
        /* Navigation */
        .nav-mode { background: #e9ecef; border-radius: 8px; padding: 5px; margin: 20px; display: flex; }
        .nav-mode button { flex: 1; border: none; padding: 10px; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .nav-mode button.active { background: var(--primary-blue); color: white; }
        
        .btn-calc { background-color: var(--primary-blue); color: white; font-weight: bold; width: 100%; border-radius: 8px; padding: 12px; border: none; margin-top: 15px; }
        .center-input-box { background: #f8f9fa; border-radius: 10px; padding: 15px; border: 1px solid #dee2e6; margin-bottom: 20px; }

        /* Ergebnis-Protokoll */
        .result-card { background-color: #ffffff; display: none; padding: 0; border-radius: 12px; margin-top: 20px; max-width: 700px; margin: 20px auto; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .res-content { padding: 30px; }
        
        /* Tabellen Styling */
        .summary-table { width: 100%; margin-bottom: 20px; border-collapse: collapse; }
        .summary-table td { padding: 12px; border-bottom: 1px solid #eee; }
        .summary-table td:first-child { font-weight: bold; color: var(--primary-blue); width: 40%; }
        .res-highlight-row { background-color: #e7eff6; border-left: 5px solid var(--primary-blue); }
        
        /* Farbklassen für Abweichung */
        .text-danger-bold { color: #dc3545; font-weight: bold; }
        .text-success-bold { color: #198754; font-weight: bold; }

        .error-note { padding: 15px; border-radius: 8px; margin: 15px 0; font-weight: 500; }
        .table-ref { font-size: 0.8rem; width: 100%; margin-top: 20px; }
        .table-ref th { background-color: #f8f9fa; color: var(--primary-blue); }

        /* Footer */
        .app-footer { font-size: 0.75rem; text-align: center; color: #777; margin-top: 20px; padding-bottom: 20px; }

        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .result-card { display: block !important; box-shadow: none; border: 1px solid #eee; max-width: 100%; width: 100%; margin: 0; }
            .header-print { display: block !important; background: var(--primary-blue) !important; color: white !important; padding: 20px; text-align: center; -webkit-print-color-adjust: exact; }
            .res-highlight-row { background-color: #e7eff6 !important; -webkit-print-color-adjust: exact; }
            .print-footer { display: block !important; text-align: right; font-size: 0.75rem; margin-top: 40px; padding-top: 10px; border-top: 1px solid #ddd; }
        }

        /* Vorschläge */
        .vs-wrap { display: none; }
        .vs-box { background: var(--tb-panel2, #f8f9fa); border: 1px solid var(--tb-edge, #dee2e6); border-radius: 10px; padding: 14px 16px; margin: 12px 0; font-size: 0.92rem; }
        .vs-box h6 { font-weight: bold; margin: 0 0 8px; }
        .vs-box table { width: 100%; font-size: 0.85rem; margin: 8px 0; border-collapse: collapse; }
        .vs-box td, .vs-box th { padding: 5px 6px; border-bottom: 1px solid var(--tb-edge, #dee2e6); text-align: left; }
        .vs-box tr.vs-ok td { font-weight: bold; color: var(--tb-green, #198754); }
        .vs-box tr.vs-rec td { background: color-mix(in srgb, var(--tb-green, #198754) 14%, transparent); }
        .vs-hint { font-size: 0.8rem; opacity: .75; }
        .vs-title { font-weight: bold; text-transform: uppercase; margin: 18px 0 4px; font-size: 0.95rem; }
        .stat-box { background: var(--tb-panel2, #f8f9fa); border: 1px solid var(--tb-edge, #dee2e6); border-radius: 10px; color: var(--tb-text, inherit); }
        .stat-label { color: var(--tb-dim, #6c757d); }
        .text-muted { color: var(--tb-dim, #6c757d) !important; }
        .header-print { display: none; }
        .print-footer { display: none; }
    </style>
<style id="tb-tokens">
:root{--tb-bg:#000000;--tb-panel:#1c1c1e;--tb-panel2:#2c2c2e;--tb-inset:#121214;--tb-seg:#3a3a3c;--tb-toggle:#39393d;--tb-edge:#38383a;--tb-edge2:#48484a;--tb-acc:#8cc63f;--tb-acc-hi:#9fd652;--tb-acc-dim:#6f9c2e;--tb-on-acc:#0b1a02;--tb-text:#f5f5f7;--tb-dim:#98989f;--tb-green:#30d158;--tb-red:#ff453a;--tb-blue:#64a8ff;--tb-orange:#ff9f0a;--tb-purple:#bf8cff;--tb-cyan:#5ac8fa;color-scheme:dark;--tb-acc-bg:color-mix(in srgb,var(--tb-acc) 16%,var(--tb-panel));--tb-red-bg:color-mix(in srgb,var(--tb-red) 16%,var(--tb-panel));--tb-green-bg:color-mix(in srgb,var(--tb-green) 16%,var(--tb-panel));--tb-blue-bg:color-mix(in srgb,var(--tb-blue) 16%,var(--tb-panel));--tb-orange-bg:color-mix(in srgb,var(--tb-orange) 16%,var(--tb-panel));--tb-purple-bg:color-mix(in srgb,var(--tb-purple) 16%,var(--tb-panel));--tb-cyan-bg:color-mix(in srgb,var(--tb-cyan) 16%,var(--tb-panel));}
:root[data-theme="light"]{--tb-bg:#f2f2f7;--tb-panel:#ffffff;--tb-panel2:#eeeef3;--tb-inset:#f2f2f7;--tb-seg:#ffffff;--tb-toggle:#e5e5ea;--tb-edge:#d8d8de;--tb-edge2:#c6c6cc;--tb-acc:#6ba31a;--tb-acc-hi:#5d9111;--tb-acc-dim:#4d7a12;--tb-on-acc:#ffffff;--tb-text:#1c1c1e;--tb-dim:#6c6c70;--tb-green:#1f9d46;--tb-red:#d70015;--tb-blue:#0a64d8;--tb-orange:#c76a00;--tb-purple:#7a3fd0;--tb-cyan:#0a7ea4;color-scheme:light}
body{-webkit-font-smoothing:antialiased}
button:not(:disabled):active{opacity:.85}
@media print{#tb-theme-btn{display:none!important}}
</style>

<script id="tb-theme-js">
(function(){
  var K='toolbox-theme', root=document.documentElement, mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
  function mode(){try{var m=localStorage.getItem(K);return (m==='light'||m==='dark')?m:'auto'}catch(e){return 'auto'}}
  function eff(m){return m==='auto'?((mq&&mq.matches)?'light':'dark'):m}
  var ICON={auto:'◐',light:'☀︎',dark:'☾'}, NAME={auto:'Automatisch',light:'Hell',dark:'Dunkel'};
  function apply(){
    var m=mode(), e=eff(m);
    root.setAttribute('data-theme',e);
    if(root.hasAttribute('data-bs-theme')||window.bootstrap) root.setAttribute('data-bs-theme',e);
    var t=document.querySelector('meta[name="theme-color"]'); if(!t){t=document.createElement('meta');t.name='theme-color';document.head.appendChild(t)}
    t.content=e==='light'?'#f2f2f7':'#000000';
    var b=document.getElementById('tb-theme-btn'); if(b){b.textContent=ICON[m];b.title='Darstellung: '+NAME[m]+' (tippen zum Wechseln)';b.setAttribute('aria-label',b.title)}
    try{window.dispatchEvent(new CustomEvent('toolbox-theme',{detail:e}))}catch(x){}
  }
  function set(m){try{if(m==='auto')localStorage.removeItem(K);else localStorage.setItem(K,m)}catch(e){} apply()}
  function cycle(){var m=mode();set(m==='auto'?'light':m==='light'?'dark':'auto')}
  window.toolboxTheme={mode:mode,set:set,cycle:cycle,effective:function(){return eff(mode())}};
  apply();
  if(mq){(mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply))}
  window.addEventListener('storage',function(e){if(e.key===K||e.key===null)apply()});
  function btn(){
    if(window.top!==window.self||document.getElementById('tb-theme-btn')||!document.body)return;
    var s=document.createElement('style');
    s.textContent='#tb-theme-btn{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483000;width:38px;height:38px;border-radius:50%;border:.5px solid var(--tb-edge);background:var(--tb-panel2);color:var(--tb-text);font:18px/1 -apple-system,system-ui,sans-serif;padding:0;cursor:pointer;opacity:.88;box-shadow:0 2px 10px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent}#tb-theme-btn:active{transform:scale(.94)}';
    document.head.appendChild(s);
    var b=document.createElement('button');b.id='tb-theme-btn';b.type='button';b.addEventListener('click',cycle);document.body.appendChild(b);apply();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',btn);else btn();
})();
</script>
<script>(function(){var h=document.documentElement;window.addEventListener('beforeprint',function(){h.setAttribute('data-theme','light');h.setAttribute('data-bs-theme','light')});window.addEventListener('afterprint',function(){window.toolboxTheme&&window.toolboxTheme.set(window.toolboxTheme.mode())});})();</script>

<body>

<div class="container">
    <div class="card no-print">
        <div class="header-bg">
            <h4 class="mb-0">Bürde Strom</h4>
        </div>
        
        <div class="nav-mode">
            <button id="btn-forward" class="active" onclick="setMode('forward')">Länge → Bürde</button>
            <button id="btn-backward" onclick="setMode('backward')">Ist-Bürde → Länge</button>
        </div>

        <div class="p-4 pt-0">
            <div class="center-input-box text-center">
                <label id="main-label" class="fw-bold mb-2">Abstand (m)</label>
                <input type="number" id="main-input" class="form-control form-control-lg text-center mx-auto" style="max-width: 200px;" placeholder="0.00">
            </div>

            <div class="row g-3">
                <div class="col-6">
                    <label class="small fw-bold text-muted">Nennbürde (S<sub>n</sub>)</label>
                    <select id="nenn" class="form-select" onchange="updateInfo()">
                        <option value="5">5 VA</option>
                        <option value="10">10 VA</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="small fw-bold text-muted">Querschnitt (A)</label>
                    <select id="querschnitt" class="form-select" onchange="updateInfo()">
                        <option value="1.5">1,5 mm²</option>
                        <option value="2.5" selected>2,5 mm²</option>
                        <option value="4">4 mm²</option>
                        <option value="6">6 mm²</option>
                        <option value="10">10 mm²</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="small fw-bold text-muted">Sekundärstrom (I<sub>sec</sub>)</label>
                    <select id="isec" class="form-select" onchange="updateInfo()">
                        <option value="5">5 A</option>
                        <option value="1">1 A</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="small fw-bold text-muted">Genauigkeitsklasse</label>
                    <select id="w_class" class="form-select" onchange="updateInfo()">
                        <option value="0.5">0,5S</option>
                        <option value="0.2">0,2S</option>
                    </select>
                </div>
            </div>
            
            <div id="q-limits" class="q-badge text-center my-3"></div>

            <button onclick="calculate()" class="btn btn-calc shadow-sm">BERECHNUNG STARTEN</button>
            <div class="app-footer">Entwickelt von Rico Grzenda</div>
        </div>
    </div>

    <div id="result_box" class="result-card">
        <div class="header-print">
            <h2 class="mb-1" id="pdf_title">Messprotokoll Bürde</h2>
            <p class="mb-0 small" id="pdf_date"></p>
        </div>

        <div class="res-content">
            <h5 class="text-uppercase fw-bold mb-3 no-print" style="color:var(--primary-blue); border-bottom: 2px solid #eee; padding-bottom: 10px;">
                Ergebnis-Protokoll
            </h5>

            <table class="summary-table">
                <tr><td>Eingabewert:</td><td id="sum_val">-</td></tr>
                <tr><td>Konfiguration:</td><td id="sum_params">-</td></tr>
                <tr><td>Auslastung / Abweichung:</td><td id="sum_deviation">-</td></tr>
                <tr class="res-highlight-row">
                    <td id="sum_res_label">Berechnetes Ergebnis:</td>
                    <td id="sum_result" class="fs-5">-</td>
                </tr>
            </table>

            <div id="res_ampel" class="text-center p-3 mb-4 rounded-3 fw-bold text-white shadow-sm"></div>
            
            <div class="row mb-4">
                <div class="col-6">
                    <div class="p-3 stat-box">
                        <small class="stat-label d-block text-uppercase">Ist-Leistung (S)</small>
                        <span id="prot_sist" class="fw-bold fs-5">-</span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="p-3 stat-box">
                        <small class="stat-label d-block text-uppercase">Widerstand (R)</small>
                        <span id="prot_res" class="fw-bold fs-5">-</span>
                    </div>
                </div>
            </div>

            <div id="res_error_display" class="error-note shadow-sm"></div>
            <div id="vorschlaege" class="vs-wrap no-print"></div>
            
            <div id="norm_table_container"></div>

            <div class="print-footer">
                Erstellt mit Bürde-Rechner | <strong>Software erstellt durch Rico Grzenda</strong>
            </div>

            <div class="mt-4 no-print text-center">
                <button onclick="window.print()" class="btn btn-danger btn-lg px-5 shadow">Als PDF speichern</button>
                <button onclick="clearAll()" class="btn btn-link d-block mt-3 text-danger text-decoration-none fw-bold">Eingaben löschen</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentMode = 'forward';

function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-forward').className = (mode === 'forward' ? 'active' : '');
    document.getElementById('btn-backward').className = (mode === 'backward' ? 'active' : '');
    document.getElementById('main-label').innerText = (mode === 'forward' ? 'Abstand (m)' : 'Ist-Bürde (VA)');
    updateInfo();
}

function updateInfo() {
    const q = parseFloat(document.getElementById('querschnitt').value);
    const sn = parseFloat(document.getElementById('nenn').value);
    const i = parseFloat(document.getElementById('isec').value);
    const R_ue = (2 * 1) / (56 * 2.5); 
    const L_max = ((sn / Math.pow(i, 2)) - R_ue) * 56 * q / 2;
    const L_min = (((sn * 0.25) / Math.pow(i, 2)) - R_ue) * 56 * q / 2;
    document.getElementById('q-limits').innerHTML = `Gültiger Bereich (25-100%): <strong>${Math.max(0, L_min).toFixed(1)}m - ${Math.max(0, L_max).toFixed(1)}m</strong>`;
}

function clearAll() {
    document.getElementById('main-input').value = '';
    document.getElementById('result_box').style.display = 'none';
    var vb = document.getElementById('vorschlaege'); if (vb) { vb.style.display = 'none'; vb.innerHTML = ''; }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function calculate() {
    const val = parseFloat(document.getElementById('main-input').value);
    const q = parseFloat(document.getElementById('querschnitt').value);
    const i = parseFloat(document.getElementById('isec').value);
    const sn = parseFloat(document.getElementById('nenn').value);
    const wc = parseFloat(document.getElementById('w_class').value);
    const R_ue = (2 * 1) / (56 * 2.5);

    if (isNaN(val)) return alert("Bitte Wert eingeben.");

    let sIst, dist, last;

    if (currentMode === 'forward') {
        dist = val;
        const R_ges = ((2 * dist) / (56 * q)) + R_ue;
        sIst = Math.pow(i, 2) * R_ges;
        document.getElementById('pdf_title').innerText = "Protokoll: Theoretische Bürde";
        document.getElementById('sum_val').innerText = val + " m";
        document.getElementById('sum_res_label').innerText = "Berechnete Bürde:";
        document.getElementById('sum_result').innerText = sIst.toLocaleString('de-DE', {minimumFractionDigits: 2}) + " VA";
    } else {
        sIst = val;
        const R_ges = sIst / Math.pow(i, 2);
        dist = (R_ges - R_ue) * 56 * q / 2;
        document.getElementById('pdf_title').innerText = "Protokoll: Theoretische Länge";
        document.getElementById('sum_val').innerText = val + " VA";
        document.getElementById('sum_res_label').innerText = "Berechnete Länge:";
        document.getElementById('sum_result').innerText = dist.toLocaleString('de-DE', {maximumFractionDigits: 1}) + " m";
    }

    document.getElementById('sum_params').innerText = `${sn}VA | ${q}mm² | ${i}A | Kl. ${wc}S`;
    document.getElementById('pdf_date').innerText = "Erstellt am " + new Date().toLocaleString('de-DE');
    document.getElementById('prot_sist').innerText = sIst.toLocaleString('de-DE', {minimumFractionDigits: 2}) + " VA";
    document.getElementById('prot_res').innerText = ((sIst/Math.pow(i, 2))*1000).toLocaleString('de-DE', {maximumFractionDigits: 0}) + " mΩ";

    last = (sIst / sn) * 100;
    
    // Abweichung anzeigen und einfärben
    const devElement = document.getElementById('sum_deviation');
    devElement.innerText = last.toLocaleString('de-DE', {maximumFractionDigits: 1}) + "%";
    if(last < 25 || last > 100) {
        devElement.className = "text-danger-bold";
    } else {
        devElement.className = "text-success-bold";
    }

    showResult(sIst, last, wc, dist);
}

function showResult(sIst, last, wc, dist) {
    document.getElementById('result_box').style.display = 'block';
    const amp = document.getElementById('res_ampel');
    const errDisp = document.getElementById('res_error_display');

    let color = (last > 100) ? "#d9534f" : (last < 25) ? "#f0ad4e" : "#5cb85c";
    let statusText = (last > 100) ? "ÜBERLASTET" : (last < 25) ? "UNTERBÜRDET" : "KONFORM";
    
    amp.style.backgroundColor = color;
    amp.innerText = `${statusText} (${last.toLocaleString('de-DE', {maximumFractionDigits: 1})}%)`;

    if (last > 100) {
        errDisp.innerHTML = "<strong>Warnung:</strong> Der Wandler wird überlastet (>100%). Dies kann zu Messfehlern und Sättigung führen.";
        errDisp.className = "error-note bg-danger text-white";
    } else if (last < 25) {
        errDisp.innerHTML = "<strong>Hinweis:</strong> Die Bürde liegt unter 25%. Die Genauigkeitsklasse ist laut Norm nicht mehr garantiert.";
        errDisp.className = "error-note bg-warning text-dark";
    } else {
        errDisp.innerHTML = "<strong>Optimal:</strong> Der Wandler arbeitet im spezifizierten Leistungsbereich (25-100%).";
        errDisp.className = "error-note bg-success text-white";
    }

    document.getElementById('norm_table_container').innerHTML = `
        <table class="table table-bordered table-ref text-center">
            <thead><tr><th colspan="5">Grenzwerte DIN EN 61869-2 (Kl. ${wc}S)</th></tr></thead>
            <tbody>
                <tr><td>Strom (%)</td><td>1%</td><td>5%</td><td>20%</td><td>100%</td></tr>
                <tr><td>± Fehler (%)</td><td>${(wc*3.75).toLocaleString('de-DE')}</td><td>${(wc*1.5).toLocaleString('de-DE')}</td><td>${wc.toLocaleString('de-DE')}</td><td>${wc.toLocaleString('de-DE')}</td></tr>
            </tbody>
        </table>`;
    
    renderVorschlaege(sIst, last, dist);
    document.getElementById('result_box').scrollIntoView({ behavior: 'smooth' });
}

// ---------- Vorschläge, wenn die Bürde nicht im Bereich 25-100 % liegt ----------
const Q_LIST = [1.5, 2.5, 4, 6, 10];
const E12 = (function () {
    const out = [];
    [0.01, 0.1, 1, 10, 100].forEach(d => [1, 1.2, 1.5, 1.8, 2.2, 2.7, 3.3, 3.9, 4.7, 5.6, 6.8, 8.2].forEach(m => out.push(+(m * d).toPrecision(3))));
    return out.sort((a, b) => a - b);
})();
function fmtDE(x, d) { return x.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }); }

function renderVorschlaege(sIst, last, dist) {
    const box = document.getElementById('vorschlaege');
    if (!box) return;
    if (last >= 25 && last <= 100) { box.style.display = 'none'; box.innerHTML = ''; return; }

    const q = parseFloat(document.getElementById('querschnitt').value);
    const i = parseFloat(document.getElementById('isec').value);
    const sn = parseFloat(document.getElementById('nenn').value);
    const R_ue = (2 * 1) / (56 * 2.5);
    const i2 = i * i;
    const hoch = last > 100;
    let h = '<div class="vs-title">Vorschläge – ' + (hoch ? 'Bürde zu hoch' : 'Bürde zu niedrig') + '</div>';

    // 1) Querschnitt ändern (nur wenn eine Länge bekannt ist)
    let passend = [];
    if (dist > 0) {
        let rows = '';
        Q_LIST.forEach(qq => {
            const s = i2 * ((2 * dist) / (56 * qq) + R_ue);
            const p = s / sn * 100;
            const ok = p >= 25 && p <= 100;
            if (ok) passend.push({ q: qq, s: s, p: p });
            rows += '<tr class="' + (ok ? 'vs-ok' : '') + '"><td>' + String(qq).replace('.', ',') + ' mm²' + (qq === q ? ' (aktuell)' : '') + '</td><td>' +
                fmtDE(s, 2) + ' VA</td><td>' + fmtDE(p, 1) + ' %</td><td>' + (ok ? '✓ passt' : (p > 100 ? 'zu hoch' : 'zu niedrig')) + '</td></tr>';
        });
        let best = null;
        passend.forEach(o => { if (!best || Math.abs(o.p - 62.5) < Math.abs(best.p - 62.5)) best = o; });
        h += '<div class="vs-box"><h6>Option 1: Querschnitt anpassen</h6>';
        if (best) {
            h += 'Bei <strong>' + fmtDE(dist, 1) + ' m</strong> passt der Querschnitt <strong>' + String(best.q).replace('.', ',') + ' mm²</strong> (Bürde ' + fmtDE(best.s, 2) + ' VA = ' + fmtDE(best.p, 1) + ' %).';
        } else if (hoch) {
            h += 'Bei <strong>' + fmtDE(dist, 1) + ' m</strong> reicht auch 10 mm² nicht aus. Leitung kürzen oder Option 2 wählen.';
        } else {
            h += 'Bei <strong>' + fmtDE(dist, 1) + ' m</strong> bringt kein Standardquerschnitt die Bürde in den Bereich. Siehe Bürdewiderstand (Option 2).';
        }
        h += '<table><thead><tr><th>Querschnitt</th><th>Bürde</th><th>Auslastung</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
        h += '<div class="vs-hint">Mindestquerschnitt laut Anschlussbedingungen des Netzbetreibers beachten. Zeilen in Grün liegen im Bereich 25–100 %.</div></div>';
    }

    if (hoch) {
        // 2) Alternativen bei zu hoher Bürde
        h += '<div class="vs-box"><h6>Option 2: Rahmenbedingungen ändern</h6><ul class="mb-0">';
        const Lmax = (qq) => Math.max(0, ((sn / i2) - R_ue) * 56 * qq / 2);
        h += '<li>Leitung kürzen: bei ' + String(q).replace('.', ',') + ' mm² sind höchstens <strong>' + fmtDE(Lmax(q), 1) + ' m</strong> möglich (100 %), bei 10 mm² <strong>' + fmtDE(Lmax(10), 1) + ' m</strong>.</li>';
        if (sn < 10) { const p10 = sIst / 10 * 100; h += '<li>Wandler mit höherer Nennbürde (<strong>10 VA</strong>) verwenden: dann ' + fmtDE(p10, 1) + ' % Auslastung' + (p10 > 100 ? ' (reicht allein nicht, mit Querschnitt oder Länge kombinieren)' : '') + '.</li>'; }
        if (i > 1) h += '<li>Sekundärstrom <strong>1 A</strong> statt 5 A: die Bürde sinkt auf ein Fünfundzwanzigstel (' + fmtDE(sIst / 25, 2) + ' VA, ' + fmtDE(sIst / 25 / sn * 100, 1) + ' %). Dann Auslastung neu prüfen, sie kann unter 25 % fallen.</li>';
        h += '</ul></div>';
    } else {
        // 2) Bürdewiderstand in Reihe bei zu niedriger Bürde
        const Rges = sIst / i2;
        const sZiel = 0.40 * sn;
        const R25 = Math.max(0, (0.25 * sn - sIst) / i2);
        const Rziel = Math.max(0, (sZiel - sIst) / i2);
        let cand = null;
        E12.forEach(e => {
            const p = (sIst + i2 * e) / sn * 100;
            if (p >= 25 && p <= 100 && (!cand || Math.abs(Math.log(e / Rziel)) < Math.abs(Math.log(cand / Rziel)))) cand = e;
        });
        h += '<div class="vs-box"><h6>Option 2: Bürdewiderstand in Reihe</h6>';
        if (cand !== null) {
            const sNeu = sIst + i2 * cand;
            const pNeu = sNeu / sn * 100;
            const pR = i2 * cand;
            h += 'Zusätzlicher Widerstand in Reihe zur Messleitung: <strong>' + fmtDE(cand, cand < 1 ? 3 : 2) + ' Ω</strong> (E12-Wert)<ul class="mt-2 mb-0">' +
                '<li>Mindestwert für 25 %: <strong>' + fmtDE(R25, 3) + ' Ω</strong>, rechnerisch für ca. 40 %: ' + fmtDE(Rziel, 3) + ' Ω</li>' +
                '<li>Damit: ' + fmtDE(sNeu, 2) + ' VA = <strong>' + fmtDE(pNeu, 1) + ' %</strong> von ' + sn + ' VA</li>' +
                '<li>Verlustleistung im Widerstand: ' + fmtDE(pR, 2) + ' W, einen Typ mit mindestens <strong>' + fmtDE(Math.max(1, Math.ceil(pR * 2)), 0) + ' W</strong> Nennleistung wählen (doppelte Reserve)</li>' +
                '<li>Gesamtwiderstand des Messkreises danach: ' + fmtDE(Rges + cand, 3) + ' Ω</li></ul>';
        } else {
            h += 'Mit einem Zusatzwiderstand ist die Bürde nicht sinnvoll einstellbar. Prüfe Nennbürde und Sekundärstrom.';
        }
        h += '<div class="vs-hint mt-2">Den Widerstand an Wandler- oder Zählerseite in die Stromschleife einbauen, niemals den Stromkreis dabei öffnen. Gemessenen Wert nach dem Einbau mit der Messung gegenprüfen.</div></div>';
        if (sn > 5) h += '<div class="vs-box"><h6>Option 3: Wandler mit kleinerer Nennbürde</h6>Bei <strong>5 VA</strong> Nennbürde läge die Auslastung bei ' + fmtDE(sIst / 5 * 100, 1) + ' %.</div>';
    }
    box.innerHTML = h;
    box.style.display = 'block';
}

updateInfo();
</script>

</html>
