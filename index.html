<!DOCTYPE html>
<html lang="de">
<head>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toolbox">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolbox</title>
<style>
  :root{
    --bg:var(--tb-bg); --panel:var(--tb-panel); --panel2:var(--tb-panel2); --edge:var(--tb-edge);
    --amber:var(--tb-acc); --text:var(--tb-text); --text-dim:var(--tb-dim); --green:var(--tb-green);
    --mono:'SF Mono',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
  }
  header{ padding:32px 20px 20px; text-align:center; border-bottom:1px solid var(--edge); }
  header h1{margin:0 0 6px; font-size:22px; letter-spacing:.02em;}
  header h1 b{color:var(--amber);}
  header p{margin:0; color:var(--text-dim); font-size:13px; font-family:var(--mono);}

  main{max-width:900px; margin:0 auto; padding:20px 16px 60px;}

  .tabbar{ display:flex; gap:8px; margin-bottom:16px; background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:4px; }
  .tabbtn{
    flex:1; text-align:center; padding:10px; border-radius:9px; border:none; background:transparent;
    color:var(--text-dim); font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .tabbtn.active{ background:var(--amber); color:var(--tb-on-acc); }

  .view{ display:none; }
  .view.active{ display:block; }

  .favgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px 10px; }
  .favtile{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    text-decoration:none; color:var(--text); position:relative;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .favtile .icon{
    width:56px; height:56px; border-radius:16px; background:var(--panel2);
    border:1px solid var(--edge); display:flex; align-items:center; justify-content:center;
    font-size:28px; overflow:hidden; transition:transform .12s, box-shadow .12s;
  }
  .favtile .name{ font-size:11px; text-align:center; line-height:1.25; max-width:78px; }
  .favtile.dragging{ z-index:50; opacity:.9; }
  .favtile.dragging .icon{ transform:scale(1.12); box-shadow:0 8px 20px rgba(0,0,0,.5); border-color:var(--amber); }
  .favtile.dropzone .icon{ outline:2px dashed var(--amber); outline-offset:3px; }
  .favempty{ color:var(--text-dim); font-size:13px; text-align:center; padding:50px 20px; line-height:1.6; }
  .favhint{ text-align:center; color:var(--text-dim); font-size:11px; font-family:var(--mono); margin:-8px 0 16px; }

  .searchbar{ display:flex; gap:10px; margin-bottom:18px; }
  .searchbar input{
    flex:1; background:var(--panel); border:1px solid var(--edge); color:var(--text);
    padding:10px 14px; border-radius:10px; font-size:14px; font-family:inherit;
  }
  .searchbar button{
    background:var(--panel2); border:1px solid var(--edge); color:var(--text-dim);
    padding:10px 14px; border-radius:10px; cursor:pointer; font-family:var(--mono); font-size:16px;
  }

  .overlay-bg{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000;
    align-items:center; justify-content:center; padding:20px;
  }
  .overlay-bg.open{ display:flex; }
  .share-box{
    background:var(--panel); border:1px solid var(--edge); border-radius:16px; padding:24px;
    display:flex; flex-direction:column; align-items:center; gap:14px; max-width:320px; width:100%;
  }
  .share-title{font-size:16px; font-weight:700;}
  .share-box img{ background:#fff; border-radius:10px; padding:10px; }
  .share-url{
    font-family:var(--mono); font-size:12px; color:var(--text-dim); text-align:center;
    word-break:break-all; background:var(--panel2); padding:8px 12px; border-radius:8px; width:100%;
  }
  .share-buttons{ display:flex; gap:10px; width:100%; }
  .share-buttons button{
    flex:1; padding:10px; border-radius:10px; border:1px solid var(--edge); background:var(--panel2);
    color:var(--text); font-size:13px; cursor:pointer;
  }
  .share-buttons button.primary{ background:var(--amber); color:var(--tb-on-acc); border-color:var(--amber); font-weight:700; }

  .status{color:var(--text-dim); font-size:13px; font-family:var(--mono); text-align:center; padding:30px 0;}

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .card{
    background:var(--panel); border:1px solid var(--edge); border-radius:14px; padding:16px;
    text-decoration:none; color:var(--text); display:flex; flex-direction:column; gap:8px;
    transition:.15s; position:relative; overflow:hidden;
  }
  .card:hover{ border-color:var(--amber); transform:translateY(-2px); }
  .card .icon{
    width:48px; height:48px; border-radius:12px; background:var(--panel2);
    border:1px solid var(--edge); display:flex; align-items:center; justify-content:center;
    font-size:24px; flex-shrink:0; overflow:hidden;
  }
  .card .cardhead{display:flex; align-items:center; gap:10px;}
  .card .name{font-weight:700; font-size:15px;}
  .card .desc{font-size:12.5px; color:var(--text-dim); line-height:1.4; min-height:34px;}
  .card .meta{
    display:flex; justify-content:flex-end; align-items:center;
    font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:auto; padding-top:8px;
    border-top:1px solid var(--edge);
  }
  .card .arrow{color:var(--amber); font-size:16px;}

  .pin{position:absolute; top:10px; right:10px; font-size:11px; color:var(--amber); cursor:pointer; opacity:.6;}
  .pin.active{opacity:1;}

  footer{
    text-align:center; color:var(--text-dim); font-size:11px; font-family:var(--mono);
    padding:20px; border-top:1px solid var(--edge);
  }
  footer a{color:var(--amber); text-decoration:none;}
</style>
<style id="tb-tokens">
:root{--tb-bg:#000000;--tb-panel:#1c1c1e;--tb-panel2:#2c2c2e;--tb-inset:#121214;--tb-seg:#3a3a3c;--tb-toggle:#39393d;--tb-edge:#38383a;--tb-edge2:#48484a;--tb-acc:#8cc63f;--tb-acc-hi:#9fd652;--tb-acc-dim:#6f9c2e;--tb-on-acc:#0b1a02;--tb-text:#f5f5f7;--tb-dim:#98989f;--tb-green:#30d158;--tb-red:#ff453a;--tb-blue:#64a8ff;--tb-orange:#ff9f0a;--tb-purple:#bf8cff;--tb-cyan:#5ac8fa;color-scheme:dark;--tb-acc-bg:color-mix(in srgb,var(--tb-acc) 16%,var(--tb-panel));--tb-red-bg:color-mix(in srgb,var(--tb-red) 16%,var(--tb-panel));--tb-green-bg:color-mix(in srgb,var(--tb-green) 16%,var(--tb-panel));--tb-blue-bg:color-mix(in srgb,var(--tb-blue) 16%,var(--tb-panel));--tb-orange-bg:color-mix(in srgb,var(--tb-orange) 16%,var(--tb-panel));--tb-purple-bg:color-mix(in srgb,var(--tb-purple) 16%,var(--tb-panel));--tb-cyan-bg:color-mix(in srgb,var(--tb-cyan) 16%,var(--tb-panel));}
:root[data-theme="light"]{--tb-bg:#f2f2f7;--tb-panel:#ffffff;--tb-panel2:#eeeef3;--tb-inset:#f2f2f7;--tb-seg:#ffffff;--tb-toggle:#e5e5ea;--tb-edge:#d8d8de;--tb-edge2:#c6c6cc;--tb-acc:#6ba31a;--tb-acc-hi:#5d9111;--tb-acc-dim:#4d7a12;--tb-on-acc:#ffffff;--tb-text:#1c1c1e;--tb-dim:#6c6c70;--tb-green:#1f9d46;--tb-red:#d70015;--tb-blue:#0a64d8;--tb-orange:#c76a00;--tb-purple:#7a3fd0;--tb-cyan:#0a7ea4;color-scheme:light}
body{-webkit-font-smoothing:antialiased}
button:not(:disabled):active{opacity:.85}
@media print{#tb-theme-btn{display:none!important}}
</style>
<script id="tb-theme-js">
(function(){
  var K='toolbox-theme', root=document.documentElement, mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
  function mode(){try{var m=localStorage.getItem(K);return (m==='light'||m==='dark')?m:'auto'}catch(e){return 'auto'}}
  function eff(m){return m==='auto'?((mq&&mq.matches)?'light':'dark'):m}
  var ICON={auto:'◐',light:'☀︎',dark:'☾'}, NAME={auto:'Automatisch',light:'Hell',dark:'Dunkel'};
  function apply(){
    var m=mode(), e=eff(m);
    root.setAttribute('data-theme',e);
    if(root.hasAttribute('data-bs-theme')||window.bootstrap) root.setAttribute('data-bs-theme',e);
    var t=document.querySelector('meta[name="theme-color"]'); if(!t){t=document.createElement('meta');t.name='theme-color';document.head.appendChild(t)}
    t.content=e==='light'?'#f2f2f7':'#000000';
    var b=document.getElementById('tb-theme-btn'); if(b){b.textContent=ICON[m];b.title='Darstellung: '+NAME[m]+' (tippen zum Wechseln)';b.setAttribute('aria-label',b.title)}
    try{window.dispatchEvent(new CustomEvent('toolbox-theme',{detail:e}))}catch(x){}
  }
  function set(m){try{if(m==='auto')localStorage.removeItem(K);else localStorage.setItem(K,m)}catch(e){} apply()}
  function cycle(){var m=mode();set(m==='auto'?'light':m==='light'?'dark':'auto')}
  window.toolboxTheme={mode:mode,set:set,cycle:cycle,effective:function(){return eff(mode())}};
  apply();
  if(mq){(mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply))}
  window.addEventListener('storage',function(e){if(e.key===K||e.key===null)apply()});
  function btn(){
    if(window.top!==window.self||document.getElementById('tb-theme-btn')||!document.body)return;
    var s=document.createElement('style');
    s.textContent='#tb-theme-btn{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483000;width:38px;height:38px;border-radius:50%;border:.5px solid var(--tb-edge);background:var(--tb-panel2);color:var(--tb-text);font:18px/1 -apple-system,system-ui,sans-serif;padding:0;cursor:pointer;opacity:.88;box-shadow:0 2px 10px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent}#tb-theme-btn:active{transform:scale(.94)}';
    document.head.appendChild(s);
    var b=document.createElement('button');b.id='tb-theme-btn';b.type='button';b.addEventListener('click',cycle);document.body.appendChild(b);apply();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',btn);else btn();
})();
</script>
</head>
<body>

<header>
  <h1>🧰 <b>Toolbox</b></h1>
  <p id="countLabel">lädt …</p>
</header>

<main>
  <div class="tabbar">
    <button class="tabbtn active" id="tabFav">⭐ Favoriten</button>
    <button class="tabbtn" id="tabAll">🧰 Alle Tools</button>
  </div>

  <div class="view active" id="viewFav">
    <div class="favhint">Icon halten &amp; ziehen zum Sortieren</div>
    <div class="favgrid" id="favgrid"></div>
  </div>

  <div class="view" id="viewAll">
    <div class="searchbar">
      <input type="text" id="search" placeholder="Tool suchen…">
      <button id="refreshBtn">↻</button>
      <button id="shareBtn">📤</button>
    </div>
    <div id="status" class="status">Lade Tools …</div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<div class="overlay-bg" id="shareOverlay">
  <div class="share-box">
    <div class="share-title">Toolbox teilen</div>
    <img id="qrImg" alt="QR-Code" width="240" height="240">
    <div class="share-url" id="shareUrl"></div>
    <div class="share-buttons">
      <button id="copyUrlBtn">Link kopieren</button>
      <button id="closeShareBtn" class="primary">Schließen</button>
    </div>
  </div>
</div>

<footer>
  Neuer Ordner mit <code>index.html</code> in diesem Repo → taucht automatisch hier auf.<br>
  Optional: <code>meta.json</code> im Ordner für Titel/Beschreibung/Icon.
</footer>

<script>
(() => {
  // ---- Repo-Konfiguration: hier anpassen falls Name/Owner abweicht ----
  const OWNER = 'ricogrutze-oss';
  const REPO  = 'tool';
  // -----------------------------------------------------------------

  const CACHE_KEY = 'toolbox_cache_v1';
  const CACHE_TTL_MS = 10 * 60 * 1000;
  const PIN_KEY = 'toolbox_pins_v1';

  const els = {
    grid: document.getElementById('grid'),
    favgrid: document.getElementById('favgrid'),
    status: document.getElementById('status'),
    countLabel: document.getElementById('countLabel'),
    search: document.getElementById('search'),
    refreshBtn: document.getElementById('refreshBtn'),
    tabFav: document.getElementById('tabFav'),
    tabAll: document.getElementById('tabAll'),
    viewFav: document.getElementById('viewFav'),
    viewAll: document.getElementById('viewAll'),
  };

  let allTools = [];
  let pins = JSON.parse(localStorage.getItem(PIN_KEY) || '[]');

  async function loadTools(force){
    if(!force){
      const cached = localStorage.getItem(CACHE_KEY);
      if(cached){
        try{
          const {ts, data} = JSON.parse(cached);
          if(Date.now() - ts < CACHE_TTL_MS){ allTools = data; render(); return; }
        }catch(e){}
      }
    }
    // Cache-Busting: bei manuellem Refresh Zeitstempel anhängen, damit
    // GitHub-Raw-Server und Browser wirklich neu laden statt Alt-Version zu liefern
    const bust = force ? `?t=${Date.now()}` : '';
    els.status.textContent = 'Lade Tools …';
    els.status.style.display = 'block';
    try{
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/`);
      if(!res.ok){
        if(res.status === 403) throw new Error('GitHub API Rate-Limit erreicht — später erneut versuchen.');
        throw new Error('GitHub API Fehler: ' + res.status);
      }
      const items = await res.json();
      const dirs = items.filter(i => i.type === 'dir');

      const folderTools = await Promise.all(dirs.map(async (d) => {
        let meta = {};
        try{
          const metaRes = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${encodeURIComponent(d.name)}/meta.json${bust}`);
          if(metaRes.ok) meta = await metaRes.json();
        }catch(e){ /* kein meta.json vorhanden, egal */ }
        let icon = meta.icon || '🔧';
        // Relativer Bildname (z.B. "icon.svg") -> auf den Tool-Ordner beziehen
        const looksLikeImage = /\.(svg|png|jpe?g|webp|gif)$/i.test(icon);
        const isAbsolute = /^(https?:\/\/|\.\/|\/)/.test(icon);
        if(looksLikeImage && !isAbsolute){
          icon = `${encodeURIComponent(d.name)}/${icon}${bust}`;
        } else if(looksLikeImage && isAbsolute && force){
          icon = icon + (icon.includes('?') ? '&' : '?') + `t=${Date.now()}`;
        }
        return {
          folder: d.name,
          title: meta.title || d.name,
          description: meta.description || '',
          icon,
          url: `./${encodeURIComponent(d.name)}/`
        };
      }));

      // Externe Tools (eigene Repos/URLs), optional aus external-tools.json
      let externalTools = [];
      try{
        const extRes = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/external-tools.json${bust}`);
        if(extRes.ok){
          const ext = await extRes.json();
          externalTools = ext.map(t => ({
            folder: t.url,
            title: t.title,
            description: t.description || '',
            icon: t.icon || '🔗',
            url: t.url
          }));
        }
      }catch(e){ /* keine externe Liste vorhanden, egal */ }

      allTools = [...folderTools, ...externalTools];

      localStorage.setItem(CACHE_KEY, JSON.stringify({ts: Date.now(), data: allTools}));
      render();
    }catch(err){
      els.status.textContent = '⚠ ' + err.message;
      const cached = localStorage.getItem(CACHE_KEY);
      if(cached){ try{ allTools = JSON.parse(cached).data; render(); }catch(e){} }
    }
  }

  function render(){
    renderAllTools();
    renderFavorites();
  }

  function renderAllTools(){
    const q = els.search.value.trim().toLowerCase();
    let list = allTools.filter(t =>
      !q || t.title.toLowerCase().includes(q) || t.description.toLowerCase().includes(q)
    );
    list.sort((a,b) => {
      const pa = pins.includes(a.folder), pb = pins.includes(b.folder);
      if(pa !== pb) return pa ? -1 : 1;
      return a.title.localeCompare(b.title);
    });

    els.countLabel.textContent = list.length + (list.length===1 ? ' Tool' : ' Tools');
    els.status.style.display = list.length ? 'none' : 'block';
    if(!list.length && !els.status.textContent.startsWith('⚠')){
      els.status.textContent = q ? 'Keine Treffer.' : 'Noch keine Tool-Ordner gefunden.';
      els.status.style.display = 'block';
    }

    els.grid.innerHTML = '';
    list.forEach(t => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = `viewer.html?url=${encodeURIComponent(t.url)}&title=${encodeURIComponent(t.title)}`;
      const pinned = pins.includes(t.folder);
      card.innerHTML = `
        <span class="pin ${pinned?'active':''}" title="Anheften" data-name="${t.folder}">📌</span>
        <div class="cardhead">
          <div class="icon">${renderIcon(t.icon)}</div>
          <div class="name">${escapeHtml(t.title)}</div>
        </div>
        <div class="desc">${escapeHtml(t.description || 'Keine Beschreibung')}</div>
        <div class="meta"><span class="arrow">→</span></div>
      `;
      card.querySelector('.pin').addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        togglePin(t.folder);
      });
      els.grid.appendChild(card);
    });
  }

  function togglePin(name){
    if(pins.includes(name)) pins = pins.filter(n => n !== name);
    else pins.push(name);
    localStorage.setItem(PIN_KEY, JSON.stringify(pins));
    render();
  }

  // ---- Favoriten-Ansicht mit Drag-Sortierung (Touch + Maus via Pointer Events) ----
  function renderFavorites(){
    const favTools = pins
      .map(folder => allTools.find(t => t.folder === folder))
      .filter(Boolean);

    els.favgrid.innerHTML = '';

    if(!favTools.length){
      els.favgrid.innerHTML = `<div class="favempty" style="grid-column:1/-1;">
        Noch keine Favoriten.<br><br>
        Unter <b>„🧰 Alle Tools"</b> bei einem Tool oben rechts auf <b>📌</b> tippen, um es hierher zu holen.
      </div>`;
      return;
    }

    favTools.forEach(t => {
      const tile = document.createElement('a');
      tile.className = 'favtile';
      tile.href = `viewer.html?url=${encodeURIComponent(t.url)}&title=${encodeURIComponent(t.title)}`;
      tile.dataset.folder = t.folder;
      tile.innerHTML = `
        <div class="icon">${renderIcon(t.icon)}</div>
        <div class="name">${escapeHtml(t.title)}</div>
      `;
      attachDrag(tile);
      els.favgrid.appendChild(tile);
    });
  }

  function attachDrag(tile){
    let dragging = false;
    let startX = 0, startY = 0;
    let origIndex = -1;
    const THRESHOLD = 8; // px Bewegung bis Drag statt Tap erkannt wird

    tile.addEventListener('pointerdown', (e) => {
      startX = e.clientX; startY = e.clientY;
      origIndex = [...els.favgrid.children].indexOf(tile);
      const onMove = (ev) => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if(!dragging && Math.hypot(dx, dy) > THRESHOLD){
          dragging = true;
          tile.setPointerCapture(e.pointerId);
          tile.classList.add('dragging');
          tile.style.position = 'relative';
        }
        if(dragging){
          ev.preventDefault();
          tile.style.transform = `translate(${ev.clientX-startX}px, ${ev.clientY-startY}px)`;
          tile.style.pointerEvents = 'none';
          const under = document.elementFromPoint(ev.clientX, ev.clientY);
          tile.style.pointerEvents = '';
          const overTile = under && under.closest('.favtile');
          [...els.favgrid.children].forEach(c => c.classList.remove('dropzone'));
          if(overTile && overTile !== tile){
            overTile.classList.add('dropzone');
          }
        }
      };
      const onUp = (ev) => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        if(dragging){
          tile.style.pointerEvents = '';
          const under = document.elementFromPoint(ev.clientX, ev.clientY);
          const overTile = under && under.closest('.favtile');
          [...els.favgrid.children].forEach(c => c.classList.remove('dropzone'));
          tile.classList.remove('dragging');
          tile.style.transform = '';
          tile.dataset.wasDrag = '1';
          if(overTile && overTile !== tile){
            const newIndex = [...els.favgrid.children].indexOf(overTile);
            const folder = tile.dataset.folder;
            pins = pins.filter(n => n !== folder);
            const targetFolder = overTile.dataset.folder;
            const targetPos = pins.indexOf(targetFolder);
            pins.splice(targetPos, 0, folder);
            localStorage.setItem(PIN_KEY, JSON.stringify(pins));
            renderFavorites();
          }
          dragging = false;
        }
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });

    // Verhindert, dass ein erkannter Drag als Klick das Tool öffnet
    tile.addEventListener('click', (e) => {
      if(tile.dataset.wasDrag === '1'){ e.preventDefault(); tile.dataset.wasDrag=''; }
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderIcon(icon){
    const isImage = /^(https?:\/\/|\.\/|\/)/.test(icon) || /\.(svg|png|jpe?g|webp|gif)$/i.test(icon);
    if(isImage){
      return `<img src="${icon}" alt="" style="width:100%;height:100%;object-fit:contain;display:block;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span style="display:none;align-items:center;justify-content:center;width:100%;height:100%;font-size:22px;">🔧</span>`;
    }
    return icon;
  }

  els.search.addEventListener('input', renderAllTools);
  els.refreshBtn.addEventListener('click', () => loadTools(true));

  els.tabFav.addEventListener('click', () => {
    els.tabFav.classList.add('active'); els.tabAll.classList.remove('active');
    els.viewFav.classList.add('active'); els.viewAll.classList.remove('active');
  });
  els.tabAll.addEventListener('click', () => {
    els.tabAll.classList.add('active'); els.tabFav.classList.remove('active');
    els.viewAll.classList.add('active'); els.viewFav.classList.remove('active');
  });

  // ---- Teilen / QR-Code ----
  const shareOverlay = document.getElementById('shareOverlay');
  const shareBtn = document.getElementById('shareBtn');
  const closeShareBtn = document.getElementById('closeShareBtn');
  const copyUrlBtn = document.getElementById('copyUrlBtn');
  const qrImg = document.getElementById('qrImg');
  const shareUrl = document.getElementById('shareUrl');

  shareBtn.addEventListener('click', () => {
    const url = location.origin + location.pathname;
    shareUrl.textContent = url;
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}`;
    shareOverlay.classList.add('open');
  });
  closeShareBtn.addEventListener('click', () => shareOverlay.classList.remove('open'));
  shareOverlay.addEventListener('click', (e) => {
    if(e.target === shareOverlay) shareOverlay.classList.remove('open');
  });
  copyUrlBtn.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(shareUrl.textContent);
      copyUrlBtn.textContent = '✓ Kopiert';
      setTimeout(() => { copyUrlBtn.textContent = 'Link kopieren'; }, 1500);
    }catch(e){
      alert('Kopieren nicht möglich, Link manuell markieren: ' + shareUrl.textContent);
    }
  });

  loadTools(false);

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
