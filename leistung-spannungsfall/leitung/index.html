<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektro Toolbox PRO - Full Calculation</title>
    <style>
        :root { --bg: var(--tb-bg); --card: var(--tb-panel); --accent: var(--tb-acc); --orange: var(--tb-orange); --text: var(--tb-text); }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        header { background: var(--tb-inset); padding: 20px; text-align: center; border-bottom: 3px solid var(--accent); }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .calc-card { background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--tb-edge); }
        h2 { color: var(--orange); margin-top: 0; font-size: 1.2em; border-bottom: 1px solid var(--tb-edge2); padding-bottom: 10px; }
        label { display: block; margin: 12px 0 5px; font-size: 0.85em; color: #bbb; }
        input, select { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid var(--tb-edge2); background: var(--tb-panel2); color: var(--tb-text); box-sizing: border-box; font-size: 1em; }
        button { width: 100%; padding: 15px; background: var(--accent); border: none; color: var(--tb-text); font-weight: bold; border-radius: 5px; margin-top: 20px; cursor: pointer; }
        .result-box { margin-top: 20px; padding: 15px; background: var(--tb-inset); border-radius: 5px; border-left: 4px solid var(--orange); }
        .vde-note { font-size: 0.75em; color: #f1c40f; margin-top: 5px; display: block; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
<style id="tb-tokens">
:root{--tb-bg:#000000;--tb-panel:#1c1c1e;--tb-panel2:#2c2c2e;--tb-inset:#121214;--tb-seg:#3a3a3c;--tb-toggle:#39393d;--tb-edge:#38383a;--tb-edge2:#48484a;--tb-acc:#8cc63f;--tb-acc-hi:#9fd652;--tb-acc-dim:#6f9c2e;--tb-on-acc:#0b1a02;--tb-text:#f5f5f7;--tb-dim:#98989f;--tb-green:#30d158;--tb-red:#ff453a;--tb-blue:#64a8ff;--tb-orange:#ff9f0a;--tb-purple:#bf8cff;--tb-cyan:#5ac8fa;color-scheme:dark;--tb-acc-bg:color-mix(in srgb,var(--tb-acc) 16%,var(--tb-panel));--tb-red-bg:color-mix(in srgb,var(--tb-red) 16%,var(--tb-panel));--tb-green-bg:color-mix(in srgb,var(--tb-green) 16%,var(--tb-panel));--tb-blue-bg:color-mix(in srgb,var(--tb-blue) 16%,var(--tb-panel));--tb-orange-bg:color-mix(in srgb,var(--tb-orange) 16%,var(--tb-panel));--tb-purple-bg:color-mix(in srgb,var(--tb-purple) 16%,var(--tb-panel));--tb-cyan-bg:color-mix(in srgb,var(--tb-cyan) 16%,var(--tb-panel));}
:root[data-theme="light"]{--tb-bg:#f2f2f7;--tb-panel:#ffffff;--tb-panel2:#eeeef3;--tb-inset:#f2f2f7;--tb-seg:#ffffff;--tb-toggle:#e5e5ea;--tb-edge:#d8d8de;--tb-edge2:#c6c6cc;--tb-acc:#6ba31a;--tb-acc-hi:#5d9111;--tb-acc-dim:#4d7a12;--tb-on-acc:#ffffff;--tb-text:#1c1c1e;--tb-dim:#6c6c70;--tb-green:#1f9d46;--tb-red:#d70015;--tb-blue:#0a64d8;--tb-orange:#c76a00;--tb-purple:#7a3fd0;--tb-cyan:#0a7ea4;color-scheme:light}
body{-webkit-font-smoothing:antialiased}
button:not(:disabled):active{opacity:.85}
@media print{#tb-theme-btn{display:none!important}}
</style>
<style id="toolbox-design">
:root{--bg:var(--tb-bg);--card:var(--tb-panel);--accent:var(--tb-acc);--orange:var(--tb-acc);--text:var(--tb-text);}
</style>
<script id="tb-theme-js">
(function(){
  var K='toolbox-theme', root=document.documentElement, mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
  function mode(){try{var m=localStorage.getItem(K);return (m==='light'||m==='dark')?m:'auto'}catch(e){return 'auto'}}
  function eff(m){return m==='auto'?((mq&&mq.matches)?'light':'dark'):m}
  var ICON={auto:'◐',light:'☀︎',dark:'☾'}, NAME={auto:'Automatisch',light:'Hell',dark:'Dunkel'};
  function apply(){
    var m=mode(), e=eff(m);
    root.setAttribute('data-theme',e);
    if(root.hasAttribute('data-bs-theme')||window.bootstrap) root.setAttribute('data-bs-theme',e);
    var t=document.querySelector('meta[name="theme-color"]'); if(!t){t=document.createElement('meta');t.name='theme-color';document.head.appendChild(t)}
    t.content=e==='light'?'#f2f2f7':'#000000';
    var b=document.getElementById('tb-theme-btn'); if(b){b.textContent=ICON[m];b.title='Darstellung: '+NAME[m]+' (tippen zum Wechseln)';b.setAttribute('aria-label',b.title)}
    try{window.dispatchEvent(new CustomEvent('toolbox-theme',{detail:e}))}catch(x){}
  }
  function set(m){try{if(m==='auto')localStorage.removeItem(K);else localStorage.setItem(K,m)}catch(e){} apply()}
  function cycle(){var m=mode();set(m==='auto'?'light':m==='light'?'dark':'auto')}
  window.toolboxTheme={mode:mode,set:set,cycle:cycle,effective:function(){return eff(mode())}};
  apply();
  if(mq){(mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply))}
  window.addEventListener('storage',function(e){if(e.key===K||e.key===null)apply()});
  function btn(){
    if(window.top!==window.self||document.getElementById('tb-theme-btn')||!document.body)return;
    var s=document.createElement('style');
    s.textContent='#tb-theme-btn{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483000;width:38px;height:38px;border-radius:50%;border:.5px solid var(--tb-edge);background:var(--tb-panel2);color:var(--tb-text);font:18px/1 -apple-system,system-ui,sans-serif;padding:0;cursor:pointer;opacity:.88;box-shadow:0 2px 10px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent}#tb-theme-btn:active{transform:scale(.94)}';
    document.head.appendChild(s);
    var b=document.createElement('button');b.id='tb-theme-btn';b.type='button';b.addEventListener('click',cycle);document.body.appendChild(b);apply();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',btn);else btn();
})();
</script>
</head>
<body>

<header><strong>ELEKTRO TOOLBOX PRO</strong></header>

<div class="container">
    <div class="calc-card">
        <h2>Leitungsberechnung & Spannungsfall</h2>
        <span class="vde-note">Gemäß DIN VDE 0100-520 / DIN 18015</span>
        
        <label>Stromkreis-Typ:</label>
        <select id="sys">
            <option value="230">Wechselstrom (230V / 1~)</option>
            <option value="400">Drehstrom (400V / 3~)</option>
        </select>

        <label>Leistung (P) in Watt:</label>
        <input type="number" id="power" value="11000" placeholder="z.B. 11000">

        <div class="grid-2">
            <div>
                <label>cos φ:</label>
                <input type="number" id="cos" value="1.0" step="0.01">
            </div>
            <div>
                <label>Länge (m):</label>
                <input type="number" id="length" value="25">
            </div>
        </div>

        <label>Querschnitt (A) in mm²:</label>
        <select id="area">
            <option value="1.5">1,5</option>
            <option value="2.5">2,5</option>
            <option value="4">4,0</option>
            <option value="6">6,0</option>
            <option value="10">10,0</option>
            <option value="16">16,0</option>
            <option value="25">25,0</option>
            <option value="35">35,0</option>
            <option value="50">50,0</option>
            <option value="70">70,0</option>
            <option value="95">95,0</option>
            <option value="120">120,0</option>
            <option value="150">150,0</option>
            <option value="185">185,0</option>
            <option value="240">240,0</option>
        </select>

        <label>Material:</label>
        <select id="mat">
            <option value="56">Kupfer (Cu)</option>
            <option value="35">Aluminium (Al)</option>
        </select>

        <button onclick="calculateAll()">BERECHNEN</button>

        <div id="results" class="result-box" style="display:none;">
            <strong>Ergebnisse:</strong>
            <div id="out-i">Strom (Ib): -</div>
            <div id="out-u">Spannungsfall (ΔU): -</div>
            <div id="out-p">Prozent (%): -</div>
            <div id="out-status" style="font-weight:bold; margin-top:10px;"></div>
        </div>
    </div>
</div>

<script>
function calculateAll() {
    const P = parseFloat(document.getElementById('power').value);
    const U = parseFloat(document.getElementById('sys').value);
    const cosPhi = parseFloat(document.getElementById('cos').value);
    const L = parseFloat(document.getElementById('length').value);
    const A = parseFloat(document.getElementById('area').value);
    const kappa = parseFloat(document.getElementById('mat').value);
    
    let Ib, deltaU, deltaU_pct;

    // 1. Stromstärke berechnen (Ib)
    if (U == 400) {
        // Drehstrom: Ib = P / (U * sqrt(3) * cosPhi)
        Ib = P / (U * Math.sqrt(3) * cosPhi);
    } else {
        // Wechselstrom: Ib = P / (U * cosPhi)
        Ib = P / (U * cosPhi);
    }

    // 2. Spannungsfall berechnen (dU)
    if (U == 400) {
        // Drehstrom dU = (sqrt(3) * L * Ib * cosPhi) / (kappa * A)
        // Vereinfacht für ohmsche/induktive Lasten im Handwerk:
        deltaU = (Math.sqrt(3) * L * Ib * cosPhi) / (kappa * A);
    } else {
        // Wechselstrom dU = (2 * L * Ib * cosPhi) / (kappa * A)
        deltaU = (2 * L * Ib * cosPhi) / (kappa * A);
    }

    deltaU_pct = (deltaU / U) * 100;

    // Anzeige
    document.getElementById('results').style.display = 'block';
    document.getElementById('out-i').innerHTML = `Betriebsstrom (Ib): <strong>${Ib.toFixed(2)} A</strong>`;
    document.getElementById('out-u').innerHTML = `Spannungsfall (ΔU): <strong>${deltaU.toFixed(2)} V</strong>`;
    document.getElementById('out-p').innerHTML = `Verlust in %: <strong>${deltaU_pct.toFixed(2)} %</strong>`;

    const status = document.getElementById('out-status');
    if (deltaU_pct <= 3.0) {
        status.innerHTML = "✅ VDE-KONFORM (≤ 3%)";
        status.style.color = "#00ff00";
    } else {
        status.innerHTML = "❌ NICHT KONFORM (> 3%)";
        status.style.color = "#ff4444";
    }
}
</script>
</body>
</html>
