<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Standortfoto">
<meta name="theme-color" content="#1f2a37">
<title>Standortfoto</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f4f5f7;--card:#ffffff;--text:#16181d;--muted:#5d6470;--accent:#1f2a37;--gelb:#ffc400;--border:#dde1e7;--ok:#1a8f3a;}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--card:#1a1d23;--text:#eef0f3;--muted:#9aa2ae;--border:#2a2f37;--accent:#ffc400;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 16px;display:flex;align-items:center;gap:10px}
h1 img{width:30px;height:30px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
button{font:inherit;cursor:pointer}
.big{width:100%;padding:18px;font-size:19px;font-weight:600;border:0;border-radius:12px;background:#1f2a37;color:#fff}
.big:disabled{opacity:.5}
.big.save{background:var(--ok)}
.big.sec{background:transparent;color:var(--text);border:1px solid var(--border);margin-top:10px;font-size:16px;padding:12px}
.bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:14px}
.bar>div{height:100%;width:0;background:var(--gelb);transition:width .2s linear}
#status{margin-top:10px;color:var(--muted);min-height:1.4em}
#status.ok{color:var(--ok);font-weight:600}
#preview{width:100%;border-radius:10px;border:1px solid var(--border);margin-top:12px;display:block}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
.row{display:flex;gap:10px}
label{flex:1;font-size:14px;color:var(--muted)}
input[type=number],input[type=text]{width:100%;margin-top:4px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;color:var(--text)}
.check input{width:22px;height:22px}
details summary{color:var(--muted);font-size:14px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1><img src="icon.svg" alt="">Standortfoto</h1>

  <div class="card">
    <button id="start" class="big">Standort erfassen</button>
    <div class="bar"><div id="fill"></div></div>
    <div id="status">Bereit.</div>
  </div>

  <div class="card" id="saveCard" hidden>
    <button id="save" class="big save">Bild sichern</button>
    <div class="hint" id="saveHint"></div>
    <img id="preview" alt="Vorschau">
  </div>

  <div class="card">
    <details>
      <summary>Einstellungen</summary>
      <div class="row" style="margin-top:12px">
        <label>Messdauer (s)<input id="dauer" type="number" inputmode="numeric" min="3" max="60" value="10"></label>
        <label>Zoomstufen<input id="zooms" type="text" value="16,19"></label>
      </div>
      <label class="check"><input type="checkbox" id="auto" checked> Beim Öffnen sofort messen</label>
      <label class="check"><input type="checkbox" id="autosave" checked> Danach automatisch speichern</label>
      <div class="hint">Zoom 19 ist die höchste OSM-Stufe (Gebäude, Zäune, Hausnummern). Karte © OpenStreetMap-Mitwirkende, Adresse über Nominatim.</div>
    </details>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

// ---------- Layout (wie Scriptable-Version) ----------
const W = 1600, RAND = 40, MW = W - 2 * RAND, MH = 1140;
const RAHMEN = 6, RAHMEN_FARBE = '#3a3f47', INFO_H = 400;
const DUNKEL = '#1f2a37', GELB = '#ffc400';
const FONT = '-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let ergebnis = null;   // { blob, name, url }

// ---------- Einstellungen merken ----------
function ladeEinst() {
  try {
    const s = JSON.parse(localStorage.getItem('standortfoto') || '{}');
    if (s.dauer) $('dauer').value = s.dauer;
    if (s.zooms) $('zooms').value = s.zooms;
    if (typeof s.auto === 'boolean') $('auto').checked = s.auto;
    if (typeof s.autosave === 'boolean') $('autosave').checked = s.autosave;
  } catch (e) {}
}
function merke() {
  try {
    localStorage.setItem('standortfoto', JSON.stringify({
      dauer: $('dauer').value, zooms: $('zooms').value, auto: $('auto').checked, autosave: $('autosave').checked
    }));
  } catch (e) {}
}
['dauer', 'zooms', 'auto', 'autosave'].forEach(id => $(id).addEventListener('change', merke));

function parseZooms(t) {
  const z = String(t).split(/[,; ]+/).map(s => parseInt(s)).filter(n => n >= 3 && n <= 19);
  return z.length ? z : [16, 19];
}

// ---------- Geo ----------
const lon2px = (lon, z) => (lon + 180) / 360 * 256 * 2 ** z;
function lat2px(lat, z) {
  const r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 256 * 2 ** z;
}

function ladeKachel(z, x, y) {
  const n = 2 ** z; x = ((x % n) + n) % n;
  return new Promise(res => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
  });
}

function messen(sek) {
  return new Promise((resolve, reject) => {
    if (!('geolocation' in navigator)) return reject(new Error('Kein Standort im Browser verfügbar'));
    let best = null;
    const start = Date.now();
    let id = null, t = null;
    const stop = () => { clearInterval(t); if (id !== null) navigator.geolocation.clearWatch(id); };
    id = navigator.geolocation.watchPosition(p => {
      if (!best || p.coords.accuracy < best.coords.accuracy) best = p;
      $('status').textContent = `Aktuell ±${Math.round(p.coords.accuracy)} m · bester Wert ±${Math.round(best.coords.accuracy)} m`;
    }, err => {
      if (err.code === 1) { stop(); reject(new Error('Standortzugriff verweigert – bitte in den Einstellungen erlauben')); }
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: (sek + 15) * 1000 });
    t = setInterval(() => {
      const el = (Date.now() - start) / 1000;
      $('fill').style.width = Math.min(100, el / sek * 100) + '%';
      if (el >= sek && (best || el >= sek + 15)) {
        stop();
        best ? resolve(best) : reject(new Error('Kein Standort gefunden'));
      }
    }, 200);
  });
}

async function holeAdresse(lat, lon) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=de`);
    const a = (await r.json()).address || {};
    const strasse = [a.road || a.pedestrian || a.footway || a.path, a.house_number].filter(Boolean).join(' ');
    const ort = [a.postcode, a.city || a.town || a.village || a.municipality].filter(Boolean).join(' ');
    return [strasse, ort].filter(Boolean).join(', ');
  } catch (e) { return ''; }
}

// ---------- Zeichnen ----------
const p2 = n => String(n).padStart(2, '0');
const fmtDatum = d => `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()}   ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
const fmtDatei = d => `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;

function rundRechteck(ctx, x, y, w, h, r, farbe) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fillStyle = farbe;
  ctx.fill();
}
function linie(ctx, x1, y1, x2, y2, breite, farbe) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.lineWidth = breite; ctx.strokeStyle = farbe; ctx.lineCap = 'butt'; ctx.stroke();
}
function blitz(ctx, x, y, s, farbe) {
  const pts = [[0.15, -1], [-0.55, 0.15], [-0.05, 0.15], [-0.25, 1], [0.55, -0.2], [0.05, -0.2], [0.3, -1]];
  ctx.beginPath();
  pts.forEach(([a, b], i) => i ? ctx.lineTo(x + a * s, y + b * s) : ctx.moveTo(x + a * s, y + b * s));
  ctx.closePath(); ctx.fillStyle = farbe; ctx.fill();
}
// Zähler-Symbol: Gehäuse mit kWh-Display und Blitz (Mittelpunkt x/y, Breite s)
function zaehlerSymbol(ctx, x, y, s) {
  const w = s, h = 1.25 * s, rand = Math.max(3, s * 0.08);
  rundRechteck(ctx, x - w / 2, y - h / 2, w, h, s * 0.14, DUNKEL);
  rundRechteck(ctx, x - w / 2 + rand, y - h / 2 + rand, w - 2 * rand, h - 2 * rand, s * 0.1, '#ffffff');
  ctx.fillStyle = DUNKEL;
  ctx.fillRect(x - w * 0.34, y - h * 0.32, w * 0.68, h * 0.26);
  ctx.fillStyle = GELB;
  ctx.font = `bold ${Math.round(s * 0.2)}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('kWh', x, y - h * 0.19);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  blitz(ctx, x, y + h * 0.22, s * 0.2, GELB);
}
// Maßstab: "schöne" Länge, höchstens ~260 px breit
function massstab(mpp) {
  const stufen = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000];
  let m = stufen[0];
  for (const s of stufen) if (s / mpp <= 260) m = s;
  return { px: m / mpp, text: m >= 1000 ? `${m / 1000} km` : `${m} m` };
}
function kuerze(ctx, text, max) {
  if (ctx.measureText(text).width <= max) return text;
  while (text.length > 1 && ctx.measureText(text + '…').width > max) text = text.slice(0, -1);
  return text + '…';
}

async function karte(lat, lon, acc, zoom) {
  const c = document.createElement('canvas');
  c.width = MW; c.height = MH;
  const k = c.getContext('2d');
  k.fillStyle = '#f2efe9'; k.fillRect(0, 0, MW, MH);

  // Kacheln
  const cx = lon2px(lon, zoom), cy = lat2px(lat, zoom);
  const left = cx - MW / 2, top = cy - MH / 2;
  const jobs = [];
  for (let tx = Math.floor(left / 256); tx <= Math.floor((left + MW) / 256); tx++)
    for (let ty = Math.floor(top / 256); ty <= Math.floor((top + MH) / 256); ty++)
      jobs.push(ladeKachel(zoom, tx, ty).then(img => ({ img, tx, ty })));
  let ok = true;
  for (const t of await Promise.all(jobs)) {
    if (t.img) k.drawImage(t.img, Math.round(t.tx * 256 - left), Math.round(t.ty * 256 - top), 256, 256);
    else ok = false;
  }

  // Genauigkeitskreis
  const mpp = 156543.03392 * Math.cos(lat * Math.PI / 180) / 2 ** zoom;
  const r = Math.max(acc / mpp, 8), mx = MW / 2, my = MH / 2;
  k.beginPath(); k.arc(mx, my, r, 0, 2 * Math.PI);
  k.fillStyle = 'rgba(30,120,255,.18)'; k.fill();
  k.lineWidth = 4; k.strokeStyle = 'rgba(30,120,255,.85)'; k.stroke();

  // Marker: Zählerschild auf Stiel, roter Punkt genau auf dem Messpunkt
  linie(k, mx, my, mx, my - 46, 7, DUNKEL);
  k.beginPath(); k.arc(mx, my, 12, 0, 2 * Math.PI); k.fillStyle = '#fff'; k.fill();
  k.beginPath(); k.arc(mx, my, 8, 0, 2 * Math.PI); k.fillStyle = '#e8202a'; k.fill();
  zaehlerSymbol(k, mx, my - 92, 70);

  // Maßstab unten links
  const ms = massstab(mpp);
  k.font = `bold 28px ${FONT}`;
  const tw = k.measureText(ms.text).width;
  rundRechteck(k, 24, MH - 80, ms.px + tw + 50, 56, 12, '#fff');
  linie(k, 40, MH - 46, 40 + ms.px, MH - 46, 5, '#16181d');
  linie(k, 40, MH - 58, 40, MH - 34, 5, '#16181d');
  linie(k, 40 + ms.px, MH - 58, 40 + ms.px, MH - 34, 5, '#16181d');
  k.fillStyle = '#16181d'; k.textBaseline = 'middle';
  k.fillText(ms.text, 54 + ms.px, MH - 50);

  // Attribution unten rechts
  k.font = `22px ${FONT}`;
  const aw = k.measureText('© OpenStreetMap').width;
  k.fillStyle = '#fff'; k.fillRect(MW - aw - 24, MH - 38, aw + 24, 38);
  k.fillStyle = '#444'; k.fillText('© OpenStreetMap', MW - aw - 12, MH - 19);
  k.textBaseline = 'alphabetic';

  return { canvas: c, ok };
}

async function erzeugeBild(lat, lon, acc, zooms, adr, zeit) {
  const H = RAND + zooms.length * MH + (zooms.length - 1) * RAND + RAND + INFO_H;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

  let kartenOk = true, y0 = RAND;
  for (const z of zooms) {
    const k = await karte(lat, lon, acc, z);
    if (!k.ok) kartenOk = false;
    ctx.fillStyle = RAHMEN_FARBE;
    ctx.fillRect(RAND - RAHMEN, y0 - RAHMEN, MW + 2 * RAHMEN, MH + 2 * RAHMEN);
    ctx.drawImage(k.canvas, RAND, y0);
    y0 += MH + RAND;
  }

  // Infoblock
  let y = y0 + 6;
  ctx.textBaseline = 'middle';
  zaehlerSymbol(ctx, RAND + 22, y + 28, 40);
  ctx.textBaseline = 'middle';
  ctx.fillStyle = DUNKEL; ctx.font = `bold 44px ${FONT}`;
  ctx.fillText('Zählerstandort', RAND + 70, y + 30);
  y += 74;

  ctx.fillStyle = '#000'; ctx.font = `bold 64px ${FONT}`;
  ctx.fillText(`${lat.toFixed(6)}, ${lon.toFixed(6)}`, RAND, y + 40);
  y += 92;

  const stufe = acc <= 10 ? ['#1a8f3a', '#e3f4e7'] : acc <= 30 ? ['#b86e00', '#fdf0dc'] : ['#c0021b', '#fde3e6'];
  const plText = `±${Math.round(acc)} m Genauigkeit`;
  ctx.font = `bold 36px ${FONT}`;
  const plW = ctx.measureText(plText).width + 44;
  rundRechteck(ctx, RAND, y, plW, 60, 30, stufe[1]);
  ctx.fillStyle = stufe[0];
  ctx.fillText(plText, RAND + 22, y + 31);

  ctx.font = `38px ${FONT}`; ctx.fillStyle = '#222';
  const adrText = (adr || 'Adresse nicht verfügbar') + (kartenOk ? '' : '  (Karte unvollständig)');
  ctx.fillText(kuerze(ctx, adrText, MW - plW - 36), RAND + plW + 36, y + 31);
  y += 84;

  ctx.font = `32px ${FONT}`; ctx.fillStyle = '#6b7280';
  ctx.fillText(fmtDatum(zeit), RAND, y + 22);
  return c;
}

// ---------- Speichern ----------
function herunterladen() {
  const a = document.createElement('a');
  a.href = ergebnis.url; a.download = ergebnis.name;
  document.body.appendChild(a); a.click(); a.remove();
}
async function teilen() {
  const file = new File([ergebnis.blob], ergebnis.name, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    await navigator.share({ files: [file] });
    return true;
  }
  return false;
}

$('save').onclick = async () => {
  if (!ergebnis) return;
  try {
    if (IOS && await teilen()) return;
  } catch (e) { if (e.name === 'AbortError') return; }
  herunterladen();
};

// ---------- Ablauf ----------
let laeuft = false;
async function los() {
  if (laeuft) return;
  laeuft = true;
  merke();
  $('start').disabled = true;
  $('saveCard').hidden = true;
  $('status').className = '';
  if (ergebnis) URL.revokeObjectURL(ergebnis.url);
  ergebnis = null;
  $('fill').style.width = '0';
  try {
    const sek = Math.min(60, Math.max(3, parseInt($('dauer').value) || 10));
    const zooms = parseZooms($('zooms').value);
    $('status').textContent = 'Suche Standort …';
    const p = await messen(sek);
    const { latitude: lat, longitude: lon, accuracy: acc } = p.coords;
    const zeit = new Date();
    $('status').textContent = 'Lade Karte und Adresse …';
    const adr = await holeAdresse(lat, lon);
    const c = await erzeugeBild(lat, lon, acc, zooms, adr, zeit);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
    ergebnis = { blob, name: `standort_${fmtDatei(zeit)}.jpg`, url: URL.createObjectURL(blob) };
    $('preview').src = ergebnis.url;
    $('saveCard').hidden = false;

    if ($('autosave').checked && !IOS) {
      // Android / PC: direkt als Datei in "Downloads"
      herunterladen();
      $('status').textContent = `Gespeichert: ${ergebnis.name} (Downloads) · ±${Math.round(acc)} m`;
      $('status').className = 'ok';
      $('save').textContent = 'Nochmal speichern / teilen';
      $('saveHint').textContent = 'Das Bild liegt im Ordner Downloads und in der Galerie unter „Downloads“.';
    } else {
      $('status').textContent = `Fertig · ±${Math.round(acc)} m`;
      $('save').textContent = 'Bild sichern';
      $('saveHint').textContent = IOS
        ? 'Tippen, dann im Teilen-Menü „Bild sichern“ wählen. Ohne Zwischenschritt geht es am iPhone nur mit dem Scriptable-Kurzbefehl.'
        : 'Tippen, um das Bild zu speichern.';
    }
  } catch (e) {
    $('status').textContent = 'Fehler: ' + e.message;
  }
  $('start').disabled = false;
  $('start').textContent = 'Nochmal messen';
  laeuft = false;
}
$('start').onclick = los;

ladeEinst();
if ($('auto').checked) los();

// Service Worker: macht die Seite einzeln als App installierbar
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
}
</script>
</body>
</html>
