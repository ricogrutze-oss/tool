<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Standortfoto">
<meta name="theme-color" content="#1e78ff">
<title>Standortfoto</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f4f5f7;--card:#ffffff;--text:#16181d;--muted:#5d6470;--accent:#1e78ff;--border:#dde1e7;}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--card:#1a1d23;--text:#eef0f3;--muted:#9aa2ae;--border:#2a2f37;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;
  padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
button{font:inherit;cursor:pointer}
.big{width:100%;padding:18px;font-size:19px;font-weight:600;border:0;border-radius:12px;background:var(--accent);color:#fff}
.big:disabled{opacity:.5}
.big.green{background:#1a8f3a}
.bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:14px}
.bar>div{height:100%;width:0;background:var(--accent);transition:width .2s linear}
#status{margin-top:10px;color:var(--muted);min-height:1.4em}
.row{display:flex;gap:10px}
label{flex:1;font-size:14px;color:var(--muted)}
input{width:100%;margin-top:4px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px}
#results img{width:100%;border-radius:10px;border:1px solid var(--border);margin-top:12px;display:block}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
details summary{color:var(--muted);font-size:14px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Standortfoto</h1>

  <div class="card">
    <button id="start" class="big">Standort erfassen</button>
    <div class="bar"><div id="fill"></div></div>
    <div id="status">Bereit.</div>
  </div>

  <div class="card" id="saveCard" hidden>
    <button id="save" class="big green">Bilder sichern</button>
    <div class="hint">Im Teilen-Menü „Bilder sichern“ wählen – die Fotos landen als JPEG in der Galerie.</div>
    <div id="results"></div>
  </div>

  <div class="card">
    <details>
      <summary>Einstellungen</summary>
      <div class="row" style="margin-top:12px">
        <label>Messdauer (s)<input id="dauer" type="number" inputmode="numeric" min="3" max="60" value="10"></label>
        <label>Zoomstufen<input id="zooms" type="text" value="16,19"></label>
      </div>
      <div class="hint">Zoom 19 ist die höchste OSM-Stufe (Gebäude, Zäune, Hausnummern). Karte © OpenStreetMap-Mitwirkende, Adresse über Nominatim.</div>
    </details>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const W = 1080, MAP_H = 1080, INFO_H = 270;
const FONT = '-apple-system,system-ui,"Segoe UI",sans-serif';
let ergebnis = [];

// Einstellungen merken
try {
  const s = JSON.parse(localStorage.getItem('standortfoto') || '{}');
  if (s.dauer) $('dauer').value = s.dauer;
  if (s.zooms) $('zooms').value = s.zooms;
} catch (e) {}
function merke() {
  try { localStorage.setItem('standortfoto', JSON.stringify({ dauer: $('dauer').value, zooms: $('zooms').value })); } catch (e) {}
}

function parseZooms(t) {
  const z = String(t).split(/[,; ]+/).map(s => parseInt(s)).filter(n => n >= 3 && n <= 19);
  return z.length ? z : [16, 19];
}

const lon2px = (lon, z) => (lon + 180) / 360 * 256 * 2 ** z;
function lat2px(lat, z) {
  const r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 256 * 2 ** z;
}

function ladeKachel(z, x, y) {
  const n = 2 ** z; x = ((x % n) + n) % n;
  return new Promise(res => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
  });
}

function messen(sek) {
  return new Promise((resolve, reject) => {
    if (!('geolocation' in navigator)) return reject(new Error('Kein Standort im Browser verfügbar'));
    let best = null;
    const start = Date.now();
    const stop = () => { clearInterval(t); navigator.geolocation.clearWatch(id); };
    const id = navigator.geolocation.watchPosition(p => {
      if (!best || p.coords.accuracy < best.coords.accuracy) best = p;
      $('status').textContent = `Aktuell ±${Math.round(p.coords.accuracy)} m · bester Wert ±${Math.round(best.coords.accuracy)} m`;
    }, err => {
      if (err.code === 1) { stop(); reject(new Error('Standortzugriff verweigert')); }
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: (sek + 15) * 1000 });
    const t = setInterval(() => {
      const el = (Date.now() - start) / 1000;
      $('fill').style.width = Math.min(100, el / sek * 100) + '%';
      if (el >= sek && (best || el >= sek + 15)) {
        stop();
        best ? resolve(best) : reject(new Error('Kein Standort gefunden'));
      }
    }, 200);
  });
}

async function holeAdresse(lat, lon) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=de`);
    const a = (await r.json()).address || {};
    const strasse = [a.road || a.pedestrian || a.footway || a.path, a.house_number].filter(Boolean).join(' ');
    const ort = [a.postcode, a.city || a.town || a.village || a.municipality].filter(Boolean).join(' ');
    return [strasse, ort].filter(Boolean).join(', ');
  } catch (e) { return ''; }
}

const p2 = n => String(n).padStart(2, '0');
const fmtDatum = d => `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()}  ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
const fmtDatei = d => `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;

function kuerze(ctx, text, max) {
  if (ctx.measureText(text).width <= max) return text;
  while (text.length > 1 && ctx.measureText(text + '…').width > max) text = text.slice(0, -1);
  return text + '…';
}

async function zeichne(lat, lon, acc, zoom, adr, zeit) {
  const c = document.createElement('canvas');
  c.width = W; c.height = MAP_H + INFO_H;
  const ctx = c.getContext('2d');
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#e5e3df';
  ctx.fillRect(0, 0, W, MAP_H);

  // Kacheln
  const cx = lon2px(lon, zoom), cy = lat2px(lat, zoom);
  const left = cx - W / 2, top = cy - MAP_H / 2;
  const jobs = [];
  for (let tx = Math.floor(left / 256); tx <= Math.floor((left + W) / 256); tx++)
    for (let ty = Math.floor(top / 256); ty <= Math.floor((top + MAP_H) / 256); ty++)
      jobs.push(ladeKachel(zoom, tx, ty).then(img => ({ img, tx, ty })));
  let ok = true;
  for (const t of await Promise.all(jobs)) {
    if (t.img) ctx.drawImage(t.img, Math.round(t.tx * 256 - left), Math.round(t.ty * 256 - top), 256, 256);
    else ok = false;
  }

  // Genauigkeitskreis
  const mpp = 156543.03392 * Math.cos(lat * Math.PI / 180) / 2 ** zoom;
  const r = Math.max(acc / mpp, 8), mx = W / 2, my = MAP_H / 2;
  ctx.beginPath(); ctx.arc(mx, my, r, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(30,120,255,.18)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(30,120,255,.85)'; ctx.stroke();

  // Marker
  ctx.beginPath(); ctx.arc(mx, my, 16, 0, 2 * Math.PI); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(mx, my, 11, 0, 2 * Math.PI); ctx.fillStyle = '#e8202a'; ctx.fill();

  // Attribution
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(W - 230, MAP_H - 32, 230, 32);
  ctx.fillStyle = '#333'; ctx.font = `20px ${FONT}`; ctx.fillText('© OpenStreetMap', W - 218, MAP_H - 27);

  // Infoleiste
  ctx.fillStyle = '#fff'; ctx.fillRect(0, MAP_H, W, INFO_H);
  const pad = 36; let y = MAP_H + 24;
  ctx.fillStyle = '#000'; ctx.font = `bold 48px ${FONT}`;
  ctx.fillText(`${lat.toFixed(6)}, ${lon.toFixed(6)}`, pad, y); y += 66;
  ctx.fillStyle = acc <= 10 ? '#1a8f3a' : acc <= 30 ? '#d98200' : '#d0021b';
  ctx.font = `bold 40px ${FONT}`;
  ctx.fillText(`Genauigkeit ±${Math.round(acc)} m` + (ok ? '' : '   (Karte offline)'), pad, y); y += 56;
  ctx.fillStyle = '#222'; ctx.font = `34px ${FONT}`;
  ctx.fillText(kuerze(ctx, adr || 'Adresse nicht verfügbar', W - 2 * pad), pad, y); y += 48;
  ctx.fillStyle = '#666'; ctx.font = `30px ${FONT}`;
  ctx.fillText(`${fmtDatum(zeit)}   ·   Zoom ${zoom}`, pad, y);
  return c;
}

$('start').onclick = async () => {
  merke();
  $('start').disabled = true;
  $('saveCard').hidden = true;
  $('results').innerHTML = '';
  ergebnis.forEach(e => URL.revokeObjectURL(e.url));
  ergebnis = [];
  $('fill').style.width = '0';
  try {
    const sek = Math.min(60, Math.max(3, parseInt($('dauer').value) || 10));
    const zooms = parseZooms($('zooms').value);
    $('status').textContent = 'Suche Standort …';
    const p = await messen(sek);
    const { latitude: lat, longitude: lon, accuracy: acc } = p.coords;
    const zeit = new Date();
    $('status').textContent = 'Lade Karte und Adresse …';
    const adr = await holeAdresse(lat, lon);
    for (const z of zooms) {
      const c = await zeichne(lat, lon, acc, z, adr, zeit);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
      const name = `standort_${fmtDatei(zeit)}_z${z}.jpg`;
      const url = URL.createObjectURL(blob);
      ergebnis.push({ blob, name, url });
      const img = document.createElement('img');
      img.src = url; img.alt = name;
      $('results').appendChild(img);
    }
    $('status').textContent = `Fertig · ±${Math.round(acc)} m · ${ergebnis.length} Bilder`;
    $('saveCard').hidden = false;
  } catch (e) {
    $('status').textContent = 'Fehler: ' + e.message;
  }
  $('start').disabled = false;
};

$('save').onclick = async () => {
  const files = ergebnis.map(e => new File([e.blob], e.name, { type: 'image/jpeg' }));
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); } catch (e) {}
  } else {
    for (const e of ergebnis) {
      const a = document.createElement('a');
      a.href = e.url; a.download = e.name;
      document.body.appendChild(a); a.click(); a.remove();
    }
  }
};

// Service Worker: macht die Seite einzeln als App installierbar
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
}
</script>
</body>
</html>
