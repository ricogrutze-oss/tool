<!doctype html>
<html lang="de">
<head>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Standort">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Standortfoto</title>
<style>
:root{
  --bg:var(--tb-bg);--panel:var(--tb-panel);--panel2:var(--tb-panel2);--edge:var(--tb-edge);
  --amber:var(--tb-acc);--text:var(--tb-text);--text-dim:var(--tb-dim);
  --green:var(--tb-green);--red:var(--tb-red);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 16px;display:flex;align-items:center;gap:10px}
h1 svg{width:26px;height:26px;flex:none}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px;margin-bottom:14px}
button{font:inherit;cursor:pointer}
.big{width:100%;padding:18px;font-size:19px;font-weight:600;border:0;border-radius:12px;background:var(--amber);color:var(--tb-on-acc)}
.big:disabled{opacity:.5;cursor:default}
.big.green{background:var(--green);color:#06210f}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:14px;border:1px solid var(--edge)}
.bar>div{height:100%;width:0;background:var(--amber);transition:width .2s linear}
#status{margin-top:10px;color:var(--text-dim);min-height:1.4em;font-size:14px}
.row{display:flex;gap:10px}
label{flex:1;font-size:13px;color:var(--text-dim)}
input{width:100%;margin-top:4px;padding:10px;border-radius:8px;border:1px solid var(--edge);background:var(--panel2);color:var(--text);font-size:16px}
input:focus{outline:1px solid var(--amber)}
#results img{width:100%;border-radius:10px;border:1px solid var(--edge);margin-top:12px;display:block}
.hint{font-size:13px;color:var(--text-dim);margin-top:10px}
details summary{color:var(--text-dim);font-size:14px;cursor:pointer}
details summary:hover{color:var(--amber)}
</style>
<style id="tb-tokens">
:root{--tb-bg:#000000;--tb-panel:#1c1c1e;--tb-panel2:#2c2c2e;--tb-inset:#121214;--tb-seg:#3a3a3c;--tb-toggle:#39393d;--tb-edge:#38383a;--tb-edge2:#48484a;--tb-acc:#8cc63f;--tb-acc-hi:#9fd652;--tb-acc-dim:#6f9c2e;--tb-on-acc:#0b1a02;--tb-text:#f5f5f7;--tb-dim:#98989f;--tb-green:#30d158;--tb-red:#ff453a;--tb-blue:#64a8ff;--tb-orange:#ff9f0a;--tb-purple:#bf8cff;--tb-cyan:#5ac8fa;color-scheme:dark;--tb-acc-bg:color-mix(in srgb,var(--tb-acc) 16%,var(--tb-panel));--tb-red-bg:color-mix(in srgb,var(--tb-red) 16%,var(--tb-panel));--tb-green-bg:color-mix(in srgb,var(--tb-green) 16%,var(--tb-panel));--tb-blue-bg:color-mix(in srgb,var(--tb-blue) 16%,var(--tb-panel));--tb-orange-bg:color-mix(in srgb,var(--tb-orange) 16%,var(--tb-panel));--tb-purple-bg:color-mix(in srgb,var(--tb-purple) 16%,var(--tb-panel));--tb-cyan-bg:color-mix(in srgb,var(--tb-cyan) 16%,var(--tb-panel));}
:root[data-theme="light"]{--tb-bg:#f2f2f7;--tb-panel:#ffffff;--tb-panel2:#eeeef3;--tb-inset:#f2f2f7;--tb-seg:#ffffff;--tb-toggle:#e5e5ea;--tb-edge:#d8d8de;--tb-edge2:#c6c6cc;--tb-acc:#6ba31a;--tb-acc-hi:#5d9111;--tb-acc-dim:#4d7a12;--tb-on-acc:#ffffff;--tb-text:#1c1c1e;--tb-dim:#6c6c70;--tb-green:#1f9d46;--tb-red:#d70015;--tb-blue:#0a64d8;--tb-orange:#c76a00;--tb-purple:#7a3fd0;--tb-cyan:#0a7ea4;color-scheme:light}
body{-webkit-font-smoothing:antialiased}
button:not(:disabled):active{opacity:.85}
@media print{#tb-theme-btn{display:none!important}}
</style>
<script id="tb-theme-js">
(function(){
  var K='toolbox-theme', root=document.documentElement, mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
  function mode(){try{var m=localStorage.getItem(K);return (m==='light'||m==='dark')?m:'auto'}catch(e){return 'auto'}}
  function eff(m){return m==='auto'?((mq&&mq.matches)?'light':'dark'):m}
  var ICON={auto:'◐',light:'☀︎',dark:'☾'}, NAME={auto:'Automatisch',light:'Hell',dark:'Dunkel'};
  function apply(){
    var m=mode(), e=eff(m);
    root.setAttribute('data-theme',e);
    if(root.hasAttribute('data-bs-theme')||window.bootstrap) root.setAttribute('data-bs-theme',e);
    var t=document.querySelector('meta[name="theme-color"]'); if(!t){t=document.createElement('meta');t.name='theme-color';document.head.appendChild(t)}
    t.content=e==='light'?'#f2f2f7':'#000000';
    var b=document.getElementById('tb-theme-btn'); if(b){b.textContent=ICON[m];b.title='Darstellung: '+NAME[m]+' (tippen zum Wechseln)';b.setAttribute('aria-label',b.title)}
    try{window.dispatchEvent(new CustomEvent('toolbox-theme',{detail:e}))}catch(x){}
  }
  function set(m){try{if(m==='auto')localStorage.removeItem(K);else localStorage.setItem(K,m)}catch(e){} apply()}
  function cycle(){var m=mode();set(m==='auto'?'light':m==='light'?'dark':'auto')}
  window.toolboxTheme={mode:mode,set:set,cycle:cycle,effective:function(){return eff(mode())}};
  apply();
  if(mq){(mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply))}
  window.addEventListener('storage',function(e){if(e.key===K||e.key===null)apply()});
  function btn(){
    if(window.top!==window.self||document.getElementById('tb-theme-btn')||!document.body)return;
    var s=document.createElement('style');
    s.textContent='#tb-theme-btn{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483000;width:38px;height:38px;border-radius:50%;border:.5px solid var(--tb-edge);background:var(--tb-panel2);color:var(--tb-text);font:18px/1 -apple-system,system-ui,sans-serif;padding:0;cursor:pointer;opacity:.88;box-shadow:0 2px 10px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent}#tb-theme-btn:active{transform:scale(.94)}';
    document.head.appendChild(s);
    var b=document.createElement('button');b.id='tb-theme-btn';b.type='button';b.addEventListener('click',cycle);document.body.appendChild(b);apply();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',btn);else btn();
})();
</script>
</head>
<body>
<main>
  <h1>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--amber)"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    Standortfoto
  </h1>

  <div class="card">
    <button id="start" class="big">Standort erfassen</button>
    <div class="bar"><div id="fill"></div></div>
    <div id="status">Bereit.</div>
  </div>

  <div class="card" id="saveCard" hidden>
    <button id="save" class="big green">Bilder sichern</button>
    <div class="hint">Im Teilen-Menü „Bilder sichern" wählen – die Fotos landen als JPEG in der Galerie.</div>
    <div id="results"></div>
  </div>

  <div class="card">
    <details>
      <summary>Einstellungen</summary>
      <div class="row" style="margin-top:12px">
        <label>Messdauer (s)<input id="dauer" type="number" inputmode="numeric" min="3" max="60" value="10"></label>
        <label>Zoomstufen<input id="zooms" type="text" value="16,19"></label>
      </div>
      <div class="hint">Zoom 19 ist die höchste OSM-Stufe (Gebäude, Zäune, Hausnummern). Karte © OpenStreetMap-Mitwirkende, Adresse über Nominatim.</div>
    </details>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const W = 1080, MAP_H = 1080, INFO_H = 270;
const FONT = '-apple-system,system-ui,"Segoe UI",sans-serif';
let ergebnis = [];

// Einstellungen merken
try {
  const s = JSON.parse(localStorage.getItem('standortfoto') || '{}');
  if (s.dauer) $('dauer').value = s.dauer;
  if (s.zooms) $('zooms').value = s.zooms;
} catch (e) {}
function merke() {
  try { localStorage.setItem('standortfoto', JSON.stringify({ dauer: $('dauer').value, zooms: $('zooms').value })); } catch (e) {}
}

function parseZooms(t) {
  const z = String(t).split(/[,; ]+/).map(s => parseInt(s)).filter(n => n >= 3 && n <= 19);
  return z.length ? z : [16, 19];
}

const lon2px = (lon, z) => (lon + 180) / 360 * 256 * 2 ** z;
function lat2px(lat, z) {
  const r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 256 * 2 ** z;
}

function ladeKachel(z, x, y) {
  const n = 2 ** z; x = ((x % n) + n) % n;
  return new Promise(res => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
  });
}

function messen(sek) {
  return new Promise((resolve, reject) => {
    if (!('geolocation' in navigator)) return reject(new Error('Kein Standort im Browser verfügbar'));
    let best = null;
    const start = Date.now();
    const stop = () => { clearInterval(t); navigator.geolocation.clearWatch(id); };
    const id = navigator.geolocation.watchPosition(p => {
      if (!best || p.coords.accuracy < best.coords.accuracy) best = p;
      $('status').textContent = `Aktuell ±${Math.round(p.coords.accuracy)} m · bester Wert ±${Math.round(best.coords.accuracy)} m`;
    }, err => {
      if (err.code === 1) { stop(); reject(new Error('Standortzugriff verweigert')); }
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: (sek + 15) * 1000 });
    const t = setInterval(() => {
      const el = (Date.now() - start) / 1000;
      $('fill').style.width = Math.min(100, el / sek * 100) + '%';
      if (el >= sek && (best || el >= sek + 15)) {
        stop();
        best ? resolve(best) : reject(new Error('Kein Standort gefunden'));
      }
    }, 200);
  });
}

async function holeAdresse(lat, lon) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=de`);
    const a = (await r.json()).address || {};
    const strasse = [a.road || a.pedestrian || a.footway || a.path, a.house_number].filter(Boolean).join(' ');
    const ort = [a.postcode, a.city || a.town || a.village || a.municipality].filter(Boolean).join(' ');
    return [strasse, ort].filter(Boolean).join(', ');
  } catch (e) { return ''; }
}

const p2 = n => String(n).padStart(2, '0');
const fmtDatum = d => `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()}  ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
const fmtDatei = d => `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;

function kuerze(ctx, text, max) {
  if (ctx.measureText(text).width <= max) return text;
  while (text.length > 1 && ctx.measureText(text + '…').width > max) text = text.slice(0, -1);
  return text + '…';
}

async function zeichne(lat, lon, acc, zoom, adr, zeit) {
  const c = document.createElement('canvas');
  c.width = W; c.height = MAP_H + INFO_H;
  const ctx = c.getContext('2d');
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#e5e3df';
  ctx.fillRect(0, 0, W, MAP_H);

  // Kacheln
  const cx = lon2px(lon, zoom), cy = lat2px(lat, zoom);
  const left = cx - W / 2, top = cy - MAP_H / 2;
  const jobs = [];
  for (let tx = Math.floor(left / 256); tx <= Math.floor((left + W) / 256); tx++)
    for (let ty = Math.floor(top / 256); ty <= Math.floor((top + MAP_H) / 256); ty++)
      jobs.push(ladeKachel(zoom, tx, ty).then(img => ({ img, tx, ty })));
  let ok = true;
  for (const t of await Promise.all(jobs)) {
    if (t.img) ctx.drawImage(t.img, Math.round(t.tx * 256 - left), Math.round(t.ty * 256 - top), 256, 256);
    else ok = false;
  }

  // Genauigkeitskreis
  const mpp = 156543.03392 * Math.cos(lat * Math.PI / 180) / 2 ** zoom;
  const r = Math.max(acc / mpp, 8), mx = W / 2, my = MAP_H / 2;
  ctx.beginPath(); ctx.arc(mx, my, r, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(30,120,255,.18)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(30,120,255,.85)'; ctx.stroke();

  // Marker
  ctx.beginPath(); ctx.arc(mx, my, 16, 0, 2 * Math.PI); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(mx, my, 11, 0, 2 * Math.PI); ctx.fillStyle = '#e8202a'; ctx.fill();

  // Attribution
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(W - 230, MAP_H - 32, 230, 32);
  ctx.fillStyle = '#333'; ctx.font = `20px ${FONT}`; ctx.fillText('© OpenStreetMap', W - 218, MAP_H - 27);

  // Infoleiste
  ctx.fillStyle = '#fff'; ctx.fillRect(0, MAP_H, W, INFO_H);
  const pad = 36; let y = MAP_H + 24;
  ctx.fillStyle = '#000'; ctx.font = `bold 48px ${FONT}`;
  ctx.fillText(`${lat.toFixed(6)}, ${lon.toFixed(6)}`, pad, y); y += 66;
  ctx.fillStyle = acc <= 10 ? '#1a8f3a' : acc <= 30 ? '#d98200' : '#d0021b';
  ctx.font = `bold 40px ${FONT}`;
  ctx.fillText(`Genauigkeit ±${Math.round(acc)} m` + (ok ? '' : '   (Karte offline)'), pad, y); y += 56;
  ctx.fillStyle = '#222'; ctx.font = `34px ${FONT}`;
  ctx.fillText(kuerze(ctx, adr || 'Adresse nicht verfügbar', W - 2 * pad), pad, y); y += 48;
  ctx.fillStyle = '#666'; ctx.font = `30px ${FONT}`;
  ctx.fillText(`${fmtDatum(zeit)}   ·   Zoom ${zoom}`, pad, y);
  return c;
}

$('start').onclick = async () => {
  merke();
  $('start').disabled = true;
  $('saveCard').hidden = true;
  $('results').innerHTML = '';
  ergebnis.forEach(e => URL.revokeObjectURL(e.url));
  ergebnis = [];
  $('fill').style.width = '0';
  try {
    const sek = Math.min(60, Math.max(3, parseInt($('dauer').value) || 10));
    const zooms = parseZooms($('zooms').value);
    $('status').textContent = 'Suche Standort …';
    const p = await messen(sek);
    const { latitude: lat, longitude: lon, accuracy: acc } = p.coords;
    const zeit = new Date();
    $('status').textContent = 'Lade Karte und Adresse …';
    const adr = await holeAdresse(lat, lon);
    for (const z of zooms) {
      const c = await zeichne(lat, lon, acc, z, adr, zeit);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
      const name = `standort_${fmtDatei(zeit)}_z${z}.jpg`;
      const url = URL.createObjectURL(blob);
      ergebnis.push({ blob, name, url });
      const img = document.createElement('img');
      img.src = url; img.alt = name;
      $('results').appendChild(img);
    }
    $('status').textContent = `Fertig · ±${Math.round(acc)} m · ${ergebnis.length} Bilder`;
    $('saveCard').hidden = false;
  } catch (e) {
    $('status').textContent = 'Fehler: ' + e.message;
  }
  $('start').disabled = false;
};

$('save').onclick = async () => {
  const files = ergebnis.map(e => new File([e.blob], e.name, { type: 'image/jpeg' }));
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); } catch (e) {}
  } else {
    for (const e of ergebnis) {
      const a = document.createElement('a');
      a.href = e.url; a.download = e.name;
      document.body.appendChild(a); a.click(); a.remove();
    }
  }
};

// Service Worker: macht die Seite einzeln als App installierbar
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(() => {});
}
</script>
</body>
</html>
